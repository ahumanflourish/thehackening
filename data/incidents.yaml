- id: cold-chain-hacks-2026-11
  date: 2026-11-05
  title: US agencies warn of mass hacks of freezers and refrigeration systems
  kind: current
  type: devices
  summary: >-
    Hackers are breaking into internet-connected freezers and refrigeration systems,
    warned the FBI, the US cybersecurity agency CISA and three other federal
    departments. Reported targets include supermarket freezers in at least a dozen
    European countries, where food spoiled, freezers run by the US military, and a
    French blood bank (stopped before supplies were harmed). France has formally blamed
    hackers linked to Iran's Revolutionary Guard.
  impact: Food spoiled in several European countries, and medical cold storage was
    targeted. France says attacks on 11-12 Oct 2026 hit refrigeration at about 700
    shops, spoiled food worth millions of euros and started at least 15 fires, and it
    formally blamed hackers linked to Iran's Revolutionary Guard (reported 10 Nov
    2026). The US government has not officially blamed anyone (as of 10 Nov 2026). On
    12 Nov researchers at the security firm VulnCheck published 14 flaws in one widely
    used make of refrigeration controller and saw break-in attempts within two hours;
    they say nothing ties those attempts to the October attackers (SecurityWeek, 16 Nov
    2026).
  ai_involvement:
    - stage: attack
      level: unknown
      note: No official has attributed the intrusions to AI, and the reports we cite do not
        mention AI.
  related_advice: [ water-food-medications, shrink-patch-lag ]
