- id: us-bank-outage-2026-11
  date: 2026-11-16
  title: Chase and other big US banks have online banking trouble; Chase says it is a
    software fault, not an attack
  kind: current
  type: outage
  summary: >-
    Customers of Chase, the largest US bank, had trouble logging in and moving money on
    16 Nov 2026, and customers of other big banks reported problems too. Chase blamed a
    software bug in its own equipment and said it was not a cyberattack. Chase said
    transactions were back to normal by that night. The FBI told Congress on 18 Nov it
    had found no sign of hacking.
  impact: Chase's website and app, and payments between Chase and other banks, were slow
    or unavailable for part of 16 Nov 2026; Chase said transactions were processing
    normally again by that night (6abc, 17 Nov). Users filed more than 20,000 problem reports
    about Chase on the tracking site Downdetector by 2:22 p.m. Eastern (Fortune); these
    are complaints, not a count of people affected. Wells Fargo also reported technical
    issues. The payment service Zelle said its own network was working. A hack of
    suppliers to Chase, Mastercard and Visa, disclosed three days later, is a separate
    entry; Chase says the two are unrelated.
  ai_involvement:
    - stage: attack
      level: unlikely
      note: JPMorgan Chase said the cause was a software bug in one of its own hardware
        systems and that "it is not cyber-related" (statement carried by WSMV). A
        spokesman said "This is not a systemic issue" and that other banks were slowed
        only when dealing with Chase. Wells Fargo has not given a cause, and we found no
        comment from a bank regulator (as of 20 Nov). Asked about the week's failures
        at a House hearing on 18 Nov, the FBI's deputy director said there was "no
        indication whatsoever" of malicious cyber activity (The Record). Chase has not
        published a detailed account of the fault (as of 20 Nov).
  related_advice: [ cash-sized-to-outages, spending-money-on-separate-rails ]
