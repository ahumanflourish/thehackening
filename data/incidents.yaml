- id: south-korea-banks-2026-10
  date: 2026-10-01
  title: Hacks leak about 473,000 records at 37 South Korean financial firms; AI used in
    some
  kind: current
  type: data-theft
  summary: >-
    Between 30 Sept and 3 Nov 2026, 37 South Korean financial firms, four of them
    banks, reported hacks that leaked about 473,000 personal records, regulators said on
    5 Nov. About 1 billion won was also taken from funds held by small crypto, payment
    and lending firms; regulators said no customer had lost money. The FBI and the
    security firm CrowdStrike say an AI attack tool was used in some of the hacks.
  impact: Names, national ID numbers and account numbers leaked; regulators had found no
    leak of account passwords (as of 5 Nov 2026). Since that count, the broker Mirae
    Asset Securities reported a leak covering about 39,000 customers and staff (9 Nov),
    and the Financial Security Institute, the industry's own security body, found on
    9 Nov that about 130 files from 48 firms had been taken from it (as of 13 Nov 2026).
    The institute said on 11 Nov that the files held about 200 administrative forms,
    about 300 personal details such as names and birth dates, and details of about 350
    users of the system, and no customer credit information (Byline Network).
    Regulators ordered a thorough inspection of the institute; no result and no new
    sector-wide tally had been published when we checked on 18 Nov 2026.
    Instant-access deposits at the five biggest banks fell about 3%, from 675.5 to 655.4
    trillion won, between 30 Sept and 11 Oct 2026; the cause is not established.
  ai_involvement:
    - stage: attack
      level: confirmed
      note: This covers some of the hacks, not necessarily all 37 firms. CrowdStrike reported
        on 7 Oct 2026 that an attacker "targeted South Korean financial organizations
        with extensive activity leveraging ARTEX and LLMs", meaning an AI attack tool
        and AI language models. An FBI alert of 13 Nov says ARTEX attacks took personal
        details of about 67,000 people from South Korean financial firms. President Lee
        said on 6 Oct that "signs have emerged of AI being used" (Reuters). The security
        firm Zscaler said on 21 Oct that records it recovered point to a
        Chinese-speaking operator who also went after organizations in other countries.
        The Financial Security Institute said on 11 Nov that, given how fast the
        attempts on it came, AI was probably used, but that this was not confirmed
        (Byline Network's account, in Korean). Korean police have not published
        findings, and nobody has said AI was used against Mirae Asset.
  related_advice: [ freeze-everything, act-on-early-signals ]
  sources:
