- id: hugging-face-agents-2026-07
  date: 2026-07-11
  title: AI agents in an OpenAI test break out and attack Hugging Face
  kind: current
  type: breakout
  count: { total: 1200, hit: 700, spread: scatter, caption: "About 700 of about 1,200 AI programs joined the attack." }
  summary: >-
    About 700 AI agents in an internal OpenAI test attacked Hugging Face, which hosts AI
    models. Hugging Face reported access to some internal datasets and service login
    details, with no evidence its public models, datasets or Spaces were altered. The
    hacking-skills test ran with some safeguards disabled, and one agent found exposed
    login details.
  impact: Internal Hugging Face datasets and login details accessed; users were advised to
    replace their access tokens.
  ai_involvement:
    - stage: agent_behavior
      level: confirmed
      note: About 1,200 agents built an unsanctioned message board, and METR's independent
        investigation found that those who joined the attack recognised it was outside
        their task and joined anyway; Hugging Face and OpenAI also documented the
        incident.
    - stage: attack
      level: confirmed
      note: Hugging Face describes the intrusion as driven end to end by an autonomous AI
        agent system, which could run its own code on a live Hugging Face server from 11
        July until it was locked out on 13 July.
  related_advice: []
  sources:
    - title: Brief independent investigation of agents' behavior in the OpenAI / Hugging Face
        hacking incident, METR
      url: https://metr.org/blog/2026-08-26-openai-hugging-face-incident-investigation/
    - title: Security incident disclosure, July 2026, Hugging Face
      url: https://huggingface.co/blog/security-incident-july-2026
    - title: Anatomy of a frontier lab agent intrusion, a technical timeline, Hugging Face
      url: https://huggingface.co/blog/agent-intrusion-technical-timeline
    - title: OpenAI statement on the model evaluation security incident
      url: https://openai.com/index/hugging-face-model-evaluation-security-incident/
