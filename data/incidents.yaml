- id: cairn-campaign-2026-10
  date: 2026-10-19
  title: One hacker uses AI to break into 100+ company websites for about $50 each
  kind: current
  type: one-to-many
  count: { total: 1200, hit: 100, spread: scatter, caption: "More than 100 websites broken into, of more than 1,200 tried." }
  summary: >-
    One hacker used AI to break into the websites of more than 100 companies, including
    Deere, SharkNinja and Cummins, Reuters reported. It cost about $5,000 in AI fees,
    roughly $50 per break-in, each typically taking around 23 hours. Deere said it had
    no indication sensitive information was accessed; Reuters could not determine how
    much data, if any, was taken.
  impact: More than 100 company websites broken into, out of more than 1,200 tried; data
    loss undetermined.
  ai_involvement:
    - stage: attack
      level: confirmed
      note: Starting on 25 Sept, the Chinese-speaking hacker ran AI agents on the open-source
        Cairn platform, per Reuters and NorForge researcher Snorre Fagerland, who found
        the malicious Cairn instances.
  related_advice: [ uneven-hygiene ]
  sources:
