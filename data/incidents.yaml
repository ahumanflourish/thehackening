- id: fbi-artex-alert-2026-11
  date: 2026-11-13
  title: FBI warns that an AI tool is automating break-ins "at machine speed"
  kind: current
  type: advisory
  summary: >-
    The FBI warned on 13 Nov 2026 that hackers are using ARTEX, a freely shared AI
    tool, to carry out break-ins largely on its own, from scouting a target to taking
    data, sometimes in under three hours. It cites attacks on South Korean financial
    firms and on customers of the software supplier ConnectWise. Copies of the tool
    keep spreading.
  impact: A warning, not a single attack. The FBI says ARTEX has been used since at least
    August 2026 against organizations in finance, government, energy, healthcare,
    telecoms and other fields, and that researchers had found more than 1,600 ARTEX
    control panels visible on the internet as of early November 2026.
  ai_involvement:
    - stage: attack
      level: confirmed
      note: The FBI's alert (FLASH-20261113-001) says attackers have used ARTEX "to automate
        multiple phases of cyber intrusions at machine speed, from reconnaissance through
        data exfiltration", with some going "from initial targeting to privileged access
        in under three hours".
  related_advice: [ shrink-patch-lag ]
  sources:
