- id: hilltop-bank-2026-09
  date: 2026-09-08
  title: Wyoming's Hilltop Bank goes offline for about two weeks after a "cybersecurity
    incident"
  kind: current
  type: outage
  summary: >-
    Customers of Hilltop Bank in Wyoming lost online and mobile banking for about two
    weeks from 8 Sept 2026. The bank closed its branches on 9 Sept, cut itself and its
    backup system off from the internet, and limited debit cards to $1,000 a day.
    Scheduled payments stopped at first. It called this a cybersecurity incident and
    has not said what kind.
  impact: Online and mobile banking were down from 8 Sept 2026; the bank said personal
    banking systems were all working again by 22 Sept (Cowboy State Daily, 30 Sept).
    Afterwards customers reported late-posting charges and lower balances than they
    expected; the bank said it would repay late fees the outage caused. Hilltop is a
    bank of about $1.14 billion with eight offices (American Banker, 15 Sept 2026).
  ai_involvement:
    - stage: attack
      level: unknown
      note: The bank would not say what caused the incident or whether data was taken; a
        spokesman said the technical details "are not something we are able to
        discuss" (Cowboy State Daily, 30 Sept). The reports do not mention AI.
