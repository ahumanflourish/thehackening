- id: gambit-card-skimming-2026-09
  date: 2026-09-10
  title: Security firm finds one hacker used AI agents to break into 27 companies and
    take 600,000 card records
  kind: current
  type: one-to-many
  summary: >-
    One hacker used AI agents to break into at least 27 companies in six days in
    September 2026 and stole more than 600,000 payment card records from two of
    them, the security firm Gambit reported on 22 Sept. The AI agents searched for
    weak points and broke in largely on their own, at about $25 per target. The
    victims have not been named.
  impact: At least 27 companies were compromised between 10 and 15 Sept 2026.
    Card-stealing code was confirmed on 19 websites, and a related version was found on
    more than 100 others. About 79% of the stolen cards were issued in the US. Gambit
    puts the cost of the whole campaign at $12,000 to $18,000, and says the activity
    began in July and was still running when it reported (all Gambit, 22 Sept 2026).
    The unnamed victims include a large hotel company, a major US airline and an online
    fashion shop (BleepingComputer, 23 Sept 2026).
  ai_involvement:
    - stage: attack
      level: confirmed
      note: Gambit, a security firm, says three freely available AI agent tools did the
        work. One searched for weaknesses, one (Cairn) broke in, and one coordinated the
        campaign. A human typed 1,951 short instructions, in Chinese, across 260
        sessions; Gambit names no country or group. It says "at least 27 companies were
        compromised to varying degrees". The reports we read cite no victim's
        confirmation. This is a different report from the 100-website Cairn campaign
        Reuters described, which was first seen on 25 Sept; nobody has said whether the
        same person was behind both.
  related_advice: [ spend-on-credit-cards, alerts-and-fast-reporting ]
  sources:
    - title: Report on AI agents used against online retailers (22 Sept 2026), Gambit
      url: https://gambit.security/blog-posts/autonomous-ai-agents-online-retailers-25-a-company
    - title: Malicious AI agents steal 600K credit cards, infect 100+ sites with skimmers,
        BleepingComputer
      url: https://bleepingcomputer.com/news/security/malicious-ai-agents-steal-600k-credit-cards-infect-100-plus-sites-with-skimmers
  updated: 2026-11-20

- id: south-korea-banks-2026-10
  date: 2026-10-01
  title: Hacks leak about 473,000 records at 37 South Korean financial firms; AI used in
    some
  kind: current
  type: data-theft
  summary: >-
    Between 30 Sept and 3 Nov 2026, 37 South Korean financial firms, four of them
    banks, reported hacks that leaked about 473,000 personal records, regulators said on
    5 Nov. About 1 billion won was also taken from funds held by small crypto, payment
    and lending firms; regulators said no customer had lost money. The FBI and the
    security firm CrowdStrike say an AI attack tool was used in some of the hacks.
  impact: Names, national ID numbers and account numbers leaked; regulators had found no
    leak of account passwords (as of 5 Nov 2026). Since that count, the broker Mirae
    Asset Securities reported a leak covering about 39,000 customers and staff (9 Nov),
    and the Financial Security Institute, the industry's own security body, found on
    9 Nov that about 130 files from 48 firms had been taken from it (as of 13 Nov 2026).
    The institute said on 11 Nov that the files held about 200 administrative forms,
    about 300 personal details such as names and birth dates, and details of about 350
    users of the system, and no customer credit information (Byline Network).
    Regulators ordered a thorough inspection of the institute; no result and no new
    sector-wide tally had been published when we checked on 20 Nov 2026. Mirae Asset
    Life Insurance has also reported a hack that exposed customers' credit
    information, the first at an insurer in this wave, and regulators say they will
    inspect security at 580 financial firms by the end of November (Insurance
    Business, 18 Nov 2026).
    Instant-access deposits at the five biggest banks fell about 3%, from 675.5 to 655.4
    trillion won, between 30 Sept and 11 Oct 2026; the cause is not established.
  ai_involvement:
    - stage: attack
      level: confirmed
      note: This covers some of the hacks, not necessarily all 37 firms. CrowdStrike reported
        on 7 Oct 2026 that an attacker "targeted South Korean financial organizations
        with extensive activity leveraging ARTEX and LLMs", meaning an AI attack tool
        and AI language models. An FBI alert of 13 Nov says ARTEX attacks took personal
        details of about 67,000 people from South Korean financial firms. President Lee
        said on 6 Oct that "signs have emerged of AI being used" (Reuters). The security
        firm Zscaler said on 21 Oct that records it recovered point to a
        Chinese-speaking operator who also went after organizations in other countries.
        The Financial Security Institute said on 11 Nov that, given how fast the
        attempts on it came, AI was probably used, but that this was not confirmed
        (Byline Network's account, in Korean). Korean police have not published
        findings (as of 20 Nov), and nobody has said AI was used against Mirae Asset
        Securities or Mirae Asset Life Insurance.
  related_advice: [ freeze-everything, act-on-early-signals ]
  sources:
