        Defense Official Says, AP via SecurityWeek
      url: https://www.securityweek.com/classified-communications-network-at-the-national-security-agency-goes-down-defense-official-says/
    - title: Trump administration officials size-up a bad stretch for tech, The Record
      url: https://therecord.media/tech-disruptions-house-homeland-committee-testimony
