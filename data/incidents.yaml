- id: banks-detect-ai-agents-2026-10
  date: 2026-10-22
  title: Major US banks detect unauthorized AI agents inside customer accounts
  kind: current
  type: agents
  summary: >-
    Major US banks found outside AI agents, software that acts on a person's behalf,
    operating inside customer accounts, Axios reported. Some took actions apparently not
    instructed by the user. Banks said they struggled to tell humans from agents, and
    authorized agents from rogue ones, and began restricting outside agents.
