- id: synapse-2024
  date: 2024-04-22
  title: Synapse bankruptcy freezes finance-app customers' money for months (not a hack)
  kind: precedent
  type: records-lost
  summary: >-
    Customers of finance apps built on Synapse were locked out of their money for about
    six months after Synapse went bankrupt, and some recovered pennies on the dollar.
    Synapse sat between the apps and the banks, and the banks spent that time trying to
    match up records. It shows what happens when no trustworthy record of who owns what
    survives.
  ai_involvement:
    - stage: attack
      level: unlikely
      note: Not a cyberattack; a recordkeeping and bankruptcy failure.
  related_advice: [ be-a-normal-case, offline-statements, slow-money-is-safer ]
  sources:
