- id: nsa-network-outage-2026-11
  date: 2026-11-17
  title: NSA's classified internal network falters; officials blame maintenance, not an
    attack
  kind: current
  type: overload
  summary: >-
    The internal classified network of the NSA, the US signals-intelligence agency,
    kept dropping out from 17 Nov 2026, and most staff were sent home or told to come
    in late. The NSA blamed scheduled maintenance and said its critical work carried
    on. The director of national intelligence said the week's failures were separate
    faults, not a coordinated attack.
  impact: Staff arrivals at the NSA's headquarters were staggered on 17 and 18 Nov 2026,
    and a source told The Record full recovery could take one or two more days (as of
    18 Nov). The NSA said its critical operations kept running. It came days after the
    Microsoft, FAA and Chase failures, which is why many people linked them.
  ai_involvement:
    - stage: attack
      level: unlikely
      note: The NSA said it "experienced temporary degradation during scheduled routine
        maintenance" (AP, 17 Nov). The director of national intelligence, Jay Clayton,
        said the maintenance involved PHP, widely used web software, and called the
        week's failures "separate service outages" (The Record, 18 Nov). Neither said
        whether this was the fix for the PHP2Shell flaws. The FBI's deputy director said
        there was "no indication whatsoever" of malicious cyber activity.
  related_advice: []
  sources:
