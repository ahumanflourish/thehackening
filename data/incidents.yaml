- id: java4shell-2026-11
  date: 2026-11-17
  title: "Java4Shell: a serious flaw, found with AI's help, in software most big companies
    run"
  kind: current
  type: software-flaw
  summary: >-
    A serious flaw in Java, software that runs inside a great many business systems,
    was made public on 17 Nov 2026. It can let an outsider crash a system or, with more
    work, take it over without a password. The security firm that found it says AI
    helped it do so in about an hour. The US cybersecurity agency CISA urged immediate
    updates. No attacks had been seen.
  impact: A fix is in Oracle's November 2026 update, but other suppliers' versions of
    Java were still waiting for theirs as of 17 Nov 2026 (SecurityWeek). Only some
    newer Intel-type processors are affected. Cisco's Talos team had seen no attacks
    but expected probing to start soon (reported 18 Nov 2026).
  ai_involvement:
    - stage: discovery
      level: confirmed
      note: Calif, the security firm whose researchers Oracle credits with the find, says
        AI played a key part, and that "It took our own Quang Luong an hour to discover
        the vulnerability". It has not named the AI model. This rating is about the
        defenders who found the flaw, not about attackers.
    - stage: attack
      level: unknown
      note: No attacks had been reported as of 18 Nov 2026. Calif says it is holding back
        its working attack code until people have had time to update.
  related_advice: [ shrink-patch-lag ]
