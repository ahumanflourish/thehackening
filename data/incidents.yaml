- id: nsa-network-outage-2026-11
  date: 2026-11-17
  title: NSA's classified internal network falters for three days; officials blame
    software updates, not an attack
  kind: current
  type: overload
  summary: >-
    The internal classified network of the NSA, the US signals-intelligence agency,
    kept dropping out for about three days from 17 Nov 2026, and many staff were sent
    home or told to come in late. The NSA blamed scheduled maintenance, and the
    director of national intelligence said software updates had stopped some systems
    restarting. Officials said it was not an attack. The NSA was mostly back to
    normal on 20 Nov.
  impact: Staff arrivals at the NSA's headquarters were staggered on 17 and 18 Nov 2026,
    and some non-essential staff were told to work from home for a third day on 19 Nov
    (NBC News). A recorded message to staff on 20 Nov described "normal conditions,
    with exceptions", with some sites still opening late (The Record). The NSA said its
    critical operations kept running. It came days after the Microsoft, FAA and Chase
    failures, which is why many people linked them.
  ai_involvement:
    - stage: attack
      level: unlikely
      note: The NSA said it "experienced temporary degradation during scheduled routine
        maintenance" (AP, 17 Nov). The director of national intelligence, Jay Clayton,
        said the maintenance involved PHP, widely used web software, and called the
        week's failures "separate service outages" (The Record, 18 Nov). In a television
        interview he said the updates had "caused some of these systems to not come
        back up" (The Record, 20 Nov). Neither said whether this was the fix for the
        PHP2Shell flaws. The FBI's deputy director said there was "no indication
        whatsoever" of malicious cyber activity. The NSA has published no detailed
        account, and did not answer The Record's questions on 20 Nov.
  related_advice: []
  sources:
