- id: php2shell-2026-10
  date: 2026-10-21
  title: "PHP2Shell: two critical flaws in the software behind most websites"
  kind: current
  type: software-flaw
  summary: >-
    Two critical flaws in PHP, the software that runs most websites, let attackers run
    their own commands on a site's server. An emergency fix was released after the
    agreed secrecy period broke early. Many sites went read-only or offline while
    administrators installed it. Sites on older PHP versions that no longer get fixes
    remain exposed long-term.
  impact: Widespread temporary site shutdowns; a large share of sites run PHP versions
    that no longer get fixes.
  ai_involvement:
    - stage: discovery
      level: confirmed
      note: Defenders found the flaws using the most advanced AI models, per OpenAI's
        coordinated disclosure.
    - stage: attack
      level: unknown
      note: Amazon reported attacks using the flaws from October 17, before they were made
        public; whether attackers used AI is unconfirmed.
  related_advice: [ shrink-patch-lag ]
  sources:
    - title: Coordinated disclosure of critical vulnerabilities, OpenAI
      url: https://openai.com/index/coordinated-disclosure-of-critical-vulnerabilities/
    - title: Websites shut down globally after AI finds cybersecurity flaw, CNN
      url: https://www.cnn.com/2026/10/21/tech/php2shell-vulnerability-ai-intl
    - title: The Hackening, Zvi
      url: https://www.lesswrong.com/posts/iqgZaJMnmyDCYfnuC/the-hackening-1
  updated: 2026-11-13

