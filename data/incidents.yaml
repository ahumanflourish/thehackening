- id: european-commission-artex-2026-10
  date: 2026-10-22
  title: European Commission says an AI-driven attack disrupted its staff systems for
    more than 10 days
  kind: current
  type: outage
  summary: >-
    Hackers using AI tools disrupted the internal staff systems of the European
    Commission, the EU's executive body, for more than 10 days, including pay, leave
    and medical-claims systems. The Commission detected the attack on 22 Oct 2026 and
    confirmed it on 19 Nov. It says it has found no evidence of a data leak affecting
    its staff as a whole, and is still investigating. It has not said who was behind
    it.
  impact: Systems for pay, leave requests, medical reimbursements and translation were
    disrupted for more than 10 days, and several were switched off as a precaution
    (The Record, 19 Nov 2026). Staff were still paid, by TechRadar's account (20 Nov
    2026). The Commission said it knew of no ransom demand, had told the people
    affected, and was checking its other systems. Whether any staff data was taken was
    still being investigated.
  ai_involvement:
    - stage: attack
      level: confirmed
      note: The Commission, the victim, called it an "AI-generated cyber campaign"
        through its spokesperson Thomas Regnier, who did not name the tool or the
        attackers (The Record, 19 Nov). Politico reported that CERT-EU, the EU
        institutions' own cyber emergency team, identified the tool as ARTEX, the AI
        attack tool in the FBI's 13 Nov warning. That is Politico's account as relayed
        by The Record and TechRadar; we could not open Politico's report ourselves.
  related_advice: []
  sources:
    - title: European Commission confirms cyberattack, says hackers used AI tool, The
        Record
      url: https://therecord.media/european-commission-confirms-cyberattack-using-ai
    - title: European Commission says it was hacked by attackers using AI tools, TechRadar
      url: https://www.techradar.com/pro/security/european-commission-says-it-was-hacked-by-attackers-using-ai-tools-says-it-is-taking-the-necessary-steps-in-response-to-a-detected-cyber-campaign
  needs_research: true
  updated: 2026-11-20

- id: optimizely-web-code-2026-11
  date: 2026-11-16
  title: Malicious code reaches 178 websites, 32 of them financial, through the web
    tool Optimizely
  kind: current
  type: supplier
  summary: >-
    Hackers slipped malicious code onto 178 widely visited websites, 32 of them
    finance or banking sites, by exploiting a flaw in Optimizely, a tool companies use
    to test changes to their web pages. The code could copy payment card details typed
    into a page and swap crypto payment addresses for the thieves' own. Optimizely
    said on 16 Nov 2026 that it had contained the problem. Known losses are small; the
    full extent is unknown.
  impact: The outside research firm Report URI counted 178 affected websites and traced
    at least $7,000 in stolen crypto; it could not tell how many cards were copied (The
    Record, 17 Nov 2026). The code also took login cookies and screenshots and tried to
    infect iPhones and iPads. HSBC was among the sites named, and Salesforce confirmed
    it was affected (CSO, 17 Nov 2026). Optimizely says it has blocked the flaw, removed
    the code and contacted the customers affected.
  ai_involvement:
    - stage: attack
      level: unknown
      note: Neither report describes any use of AI in the attack, and Optimizely has not
        named the attackers. Optimizely said it had "identified and contained a
        security incident affecting some Optimizely Web Experimentation customers" (The
        Record). The Report URI researcher told CSO that Chinese-language text in the
        code points to China; that is his view, not an official finding.
  related_advice: [ spend-on-credit-cards, avoid-self-custody-savings ]
  sources:
    - title: Report on malicious code on Optimizely customers' websites, The Record
      url: https://therecord.media/optimizely-malicious-code-customer-sites
    - title: Optimizely confirms massive cyberattack on customer websites, injected stealer
        malware, CSO
      url: https://www.csoonline.com/article/4249925/optimizely-confirms-massive-cyberattack-on-customer-websites-injected-stealer-malware.html
  updated: 2026-11-20

- id: wellington-it-credit-unions-2026-10
  date: 2026-10-02
  title: Hack of a shared software supplier exposes saved payee details at more than
    40 Irish credit unions
  kind: current
  type: data-theft
  summary: >-
    Hackers copied saved payee details, the names and bank account numbers of people
    members pay, from more than 40 Irish credit unions by breaking into Wellington
    IT, the Belfast firm behind their mobile banking apps. The attack was in early
    October 2026, but credit unions were only told on 16 Nov. Officials say no money
    was taken. How many members are affected is not yet known.
  impact: Ireland's data regulator received more than 40 breach reports from credit
    unions (The Record, 20 Nov 2026). The Irish Times estimated on 17 Nov 2026 that up
    to 1.8 million members could be affected; Wellington IT has hired outside experts
    to establish the real number. Passwords, PINs and card details were not reached,
    according to the notices sent to credit unions (BleepingComputer, 19 Nov 2026).
    Ireland's National Cyber Security Centre said there was "no indication that member
    funds have been compromised". The main risk to members is convincing scam
    messages that use the stolen details.
  ai_involvement:
    - stage: attack
      level: unknown
      note: By BleepingComputer's account of notices seen by the Irish Examiner, an
        automated script sent about five million requests on 2-4 Oct to exploit a flaw
        in how the system checked who was allowed to see what. Automated scripts long
        predate AI, and none of the reports mentions AI. Wellington IT has not publicly
        described the flaw or named the attackers.
  related_advice: [ hang-up-and-call-back, big-bank-or-credit-union ]
  sources:
