- id: binance-breach-2026-10
  date: 2026-10-29
  title: About $6.3 billion stolen from crypto exchange Binance; FBI blames North Korea
  kind: current
  type: crypto-theft
  summary: >-
    Thieves took about $6.3 billion in crypto from the exchange Binance on 29 Oct 2026.
    The FBI blamed North Korea's TraderTraitor hacking group on 31 Oct. Binance said it
    would bear the loss itself, not its users, and began reopening withdrawals on 1 Nov.
    Binance says the way in was a fake job interview that got an engineer to install
    malicious code. More than $2.7 billion has since been frozen, the US Justice
    Department said on 12 Nov.
  impact: About $6.34 billion taken, by Binance's figure. Withdrawals were suspended for
    several days. About $2.85 billion had been frozen or intercepted as of 3 Nov 2026
    (Binance's figure, reported by BleepingComputer). The US Justice Department said on
    12 Nov 2026 that more than $2.7 billion had been frozen by government and private
    efforts, and that it had court approval to seize or hold more than $1.2 billion of
    that. Frozen is not yet returned.
  ai_involvement:
    - stage: attack
      level: suspected
      note: Binance's report, as described by BleepingComputer and CSO, says the attackers
        used one of Binance's own internal AI tools to get from one engineer's computer
        to two more. Binance has not said what the tool does. Nothing we have read says
        the attackers used AI of their own.
    - stage: agent_behavior
      level: unlikely
      note: The FBI attributes the theft to a state hacking group. An analyst at the
        blockchain firm Elliptic told The Record the laundering looked automated with
        human oversight, not run by an AI agent.
