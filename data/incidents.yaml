- id: patelco-2024
  date: 2024-06-29
  title: Hackers lock Patelco Credit Union's systems; about two weeks without online banking
  kind: precedent
  type: lockout
  summary: >-
    Patelco Credit Union shut down online banking, its app and its call center for about
    two weeks. Balances were intact, but members lost access, and the credit union
    waived fees afterward. The cause was ransomware, an attack that locks a company's
    systems until it pays. Intruders had been inside the $9 billion credit union since
    May 23.
  impact: About two weeks without online banking for hundreds of thousands of members.
  ai_involvement:
    - stage: attack
      level: unlikely
      note: RansomHub, an ordinary criminal ransomware group, claimed the attack; Patelco did
        not name the attackers. This was before capable AI attack tools existed.
  related_advice: [ cash-sized-to-outages, spending-money-on-separate-rails ]
