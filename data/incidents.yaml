- id: faa-ground-stop-2026-11
  date: 2026-11-13
  title: FAA halts US flights for four hours after a router floods its network; officials
    see no sign of an attack or of AI
  kind: current
  type: outage
  summary: >-
    The FAA, the US aviation regulator, halted departures nationwide for more than four
    hours on 13 Nov 2026 after communications failed at its regional air traffic control
    centers. Officials traced it to a router that flooded the network with data during a
    contractor's cable upgrade, and said they found no evidence of an attack or of AI
    involvement. Whether the router was faulty or wrongly installed was still being
    investigated as of 18 Nov.
  impact: >-
    Departures were halted for more than four hours, until about 8:15 p.m. Eastern on
    13 Nov 2026. About 9,159 flights were cancelled and 7,190 delayed that day
    (FlightAware figures reported by CBS News on 14 Nov), and more than 6,400 were
    cancelled the next day (FlightAware, as of 9 p.m. Eastern on 14 Nov, reported by
    Yahoo News). More than 2,300 were cancelled on 15 Nov, and more than 250 on 16 Nov
    as of 6:30 a.m. Eastern, as airlines got back to near-normal schedules (FlightAware
    figures reported by CBS News on 16 Nov). The FAA's chief said about 12,000 flights
    could not be completed on 13 Nov. At least 827 flights were diverted as of 7:05 p.m.
    that day (Cirium figures reported by OPB). As a precaution the FAA switched off the
    suspect function on about 60 similar routers (FedScoop, 16 Nov).
  ai_involvement:
    - stage: attack
      level: unlikely
      note: Transportation Secretary Sean Duffy said on 14 Nov "we don't believe this was
        cyber at all". He said a router being swapped during a contractor's
        copper-to-fiber cable upgrade "started flooding other routers", and FAA chief
        Bryan Bedford said "we have an equipment issue". The contractor, L3Harris, says
        it is supporting the investigation. The router's maker, Hewlett Packard
        Enterprise, said it "functioned as it was configured to by the installer" (ABC
        News, 15 Nov). The router is being examined at an L3Harris lab in Florida by FAA
        staff and FBI agents (FedScoop, 16 Nov). At a House hearing on 18 Nov the FBI's
        deputy director said there was "no indication whatsoever" of malicious cyber
        activity in the week's failures (The Record). No final finding had been
        published as of 18 Nov.
    - stage: agent_behavior
      level: unlikely
      note: The FAA had widened its use of a new AI traffic-management tool, SMART, days
        earlier. Bedford said on 14 Nov that officials found "zero evidence of anything
        nefarious and zero evidence of anything AI related" (Yahoo News). The tool's
        maker, Air Space Intelligence, said the ground stop "is not based on or a result
        of the SMART system". Homeland Security Secretary Markwayne Mullin had
        suggested on television, citing unnamed tech executives, that AI might have
        played a part (as described by The Record, 18 Nov); the FAA and the Transportation
        Department have not supported that.
  related_advice: []
  sources:
