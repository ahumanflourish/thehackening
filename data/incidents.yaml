- id: facestealer-2026-11
  date: 2026-11-12
  title: US disrupts North Korean fake-video-call scheme that stole $400 million in crypto
  kind: current
  type: crypto-theft
  summary: >-
    North Korean hackers stole more than $400 million in crypto over 18 months by
    inviting people to fake video meetings that installed malicious software, the US
    Justice Department said on 12 Nov 2026. They replayed secretly recorded video of
    earlier victims and, the department says, AI-made fake video of well-known people.
    US authorities seized the servers behind it.
  impact: More than $400 million stolen over 18 months, by the Justice Department's
    figure (12 Nov 2026). The FBI seized over 900 secretly recorded webcam videos of
    victims. The security firm Arctic Wolf counted 677 people targeted in 58 countries,
    mostly company founders and senior executives (reported by BleepingComputer, 14
    Nov 2026).
  ai_involvement:
    - stage: attack
      level: confirmed
      note: The Justice Department says the scheme relied on secretly recorded videos and on
        deepfakes, and that the hackers used AI to make fake videos of well-known people
        in crypto, shown in meetings to win a target's trust. Recorded video of real
        victims was the other main trick.
  related_advice: [ hang-up-and-call-back, avoid-self-custody-savings ]
  sources:
