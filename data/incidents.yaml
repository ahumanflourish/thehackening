- id: trellance-2023
  date: 2023-11-26
  title: Attack on one supplier takes about 60 credit unions offline
  kind: precedent
  type: supplier
  summary: >-
    About 60 credit unions had outages at once after ransomware, an attack that locks a
    company's systems until it pays, hit a supplier they shared. The supplier was
    Ongoing Operations, a cloud provider owned by credit union technology firm
    Trellance. The credit unions were back to full operation by mid-December.
  ai_involvement:
    - stage: attack
