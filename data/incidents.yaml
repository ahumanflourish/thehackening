- id: fbi-artex-alert-2026-11
  date: 2026-11-13
  title: FBI warns that an AI tool is automating break-ins "at machine speed"
  kind: current
  type: advisory
  summary: >-
    The FBI warned on 13 Nov 2026 that hackers are using ARTEX, a freely shared AI
    tool, to carry out break-ins largely on its own, from scouting a target to taking
    data, sometimes in under three hours. It cites attacks on South Korean financial
    firms and on customers of the software supplier ConnectWise. Copies of the tool
    keep spreading.
  impact: A warning, not a single attack. The FBI says ARTEX has been used since at least
    August 2026 against organizations in finance, government, energy, healthcare,
    telecoms and other fields, and that researchers had found more than 1,600 ARTEX
    control panels visible on the internet as of early November 2026.
  ai_involvement:
    - stage: attack
      level: confirmed
      note: The FBI's alert (FLASH-20261113-001) says attackers have used ARTEX "to automate
        multiple phases of cyber intrusions at machine speed, from reconnaissance through
        data exfiltration", with some going "from initial targeting to privileged access
        in under three hours".
  related_advice: [ shrink-patch-lag ]
  sources:
    - title: Threat Overview of ARTEX Autonomous Penetration Testing Framework
        (FLASH-20261113-001), FBI
      url: https://www.ic3.gov/CSA/2026/261113.pdf
    - title: FBI flash alert says Artex tool automating cyberattacks at 'machine speed', The
        Record
      url: https://therecord.media/artex-ai-tool-fbi-flash-alert
  updated: 2026-11-15

- id: facestealer-2026-11
  date: 2026-11-12
  title: US disrupts North Korean fake-video-call scheme that stole $400 million in crypto
  kind: current
  type: crypto-theft
  summary: >-
    North Korean hackers stole more than $400 million in crypto over 18 months by
    inviting people to fake video meetings that installed malicious software, the US
    Justice Department said on 12 Nov 2026. They replayed secretly recorded video of
    earlier victims and, the department says, AI-made fake video of well-known people.
    US authorities seized the servers behind it.
  impact: More than $400 million stolen over 18 months, by the Justice Department's
    figure (12 Nov 2026). The FBI seized over 900 secretly recorded webcam videos of
    victims. The security firm Arctic Wolf counted 677 people targeted in 58 countries,
    mostly company founders and senior executives (reported by BleepingComputer, 14
    Nov 2026).
  ai_involvement:
    - stage: attack
      level: confirmed
      note: The Justice Department says the scheme relied on secretly recorded videos and on
        deepfakes, and that the hackers used AI to make fake videos of well-known people
        in crypto, shown in meetings to win a target's trust. Recorded video of real
        victims was the other main trick.
  related_advice: [ hang-up-and-call-back, avoid-self-custody-savings ]
  sources:
