- id: patelco-2024
  date: 2024-06-29
  title: Hackers lock Patelco Credit Union's systems; about two weeks without online banking
  kind: precedent
  type: lockout
  summary: >-
    Patelco Credit Union shut down online banking, its app and its call center for about
    two weeks. Balances were intact, but members lost access, and the credit union
    waived fees afterward. The cause was ransomware, an attack that locks a company's
    systems until it pays. Intruders had been inside the $9 billion credit union since
    May 23.
  impact: About two weeks without online banking for ~450,000 members.
  ai_involvement:
    - stage: attack
      level: unlikely
      note: The attackers were RansomHub, an ordinary criminal ransomware group, and this was
        before capable AI attack tools existed.
  related_advice: [ cash-sized-to-outages, spending-money-on-separate-rails ]
  sources:
    - title: Patelco restores most banking services weeks after ransomware attack, KQED
      url: https://www.kqed.org/news/11994012/patelco-restores-most-banking-services-weeks-after-massive-ransomware-attack
    - title: Patelco notifies 726,000 of data breach, BleepingComputer
      url: https://www.bleepingcomputer.com/news/security/patelco-notifies-726-000-customers-of-ransomware-data-breach/amp/
  updated: 2026-11-13

