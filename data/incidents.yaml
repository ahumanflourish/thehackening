- id: microsoft-365-outage-2026-11
  date: 2026-11-12
  title: Microsoft 365 outage disrupts Outlook, Teams and Copilot worldwide
  kind: current
  type: overload
  summary: >-
    Microsoft's work email and collaboration services, including Outlook, Teams and
    Copilot, were disrupted worldwide for about a day from 12 Nov 2026. Microsoft's
    first report on the cause, dated 15 Nov, blames a hidden software fault in its own
    servers, set off by extra load while some servers were out of service. Microsoft
    says it was not a cyberattack and not related to AI. Its final report, due by 20
    Nov, had not appeared when we checked on 18 Nov.
  impact: Worldwide email and collaboration disruption lasting about 24 hours, from 4:20
    PM UTC on 12 Nov 2026 to 4:10 PM UTC on 13 Nov, by Microsoft's preliminary report;
    delayed email took longer to clear. At the worst point more than 80% of the affected
    servers had stopped responding. Microsoft warned on 13 Nov of scam emails posing as
    outage notices (SecurityWeek, 16 Nov 2026).
  ai_involvement:
    - stage: attack
      level: unlikely
      note: Microsoft said "This was a technical issue not related to cyber or AI / agents"
        (quoted by SecurityWeek, 16 Nov). A copy of its preliminary report, dated 15 Nov,
        says "a latent defect caused Windows servers to become overwhelmed and
        unresponsive" when load rose. We read the report in a copy posted by a
        third-party site, not on Microsoft's own customer-only page. By
        BleepingComputer's account of that report (16 Nov), the fault came in with an
        update that began in July, and about 14% of the servers concerned were already
        out of service when the load rose. The final report is due by 20 Nov; we found
        no sign of it as of 18 Nov.
  related_advice: [ offline-backups ]
  sources:
