- id: equinor-attack-2026-11
  date: 2026-11-17
  title: Cyberattack disrupts office systems at Norwegian oil and gas giant Equinor;
    production unaffected
  kind: current
  type: outage
  summary: >-
    Equinor, the Norwegian oil and gas giant, said on 17 Nov 2026 that it was under a
    cyberattack on some of its office computer systems. It said oil and gas production
    was not affected and that it saw no sign of stolen data. It was still working to
    stop the attack a day later. It has not said who was behind it or how they got in.
  impact: Staff could have trouble using company applications, an Equinor spokesperson
    said; internal email was down, according to Reuters as cited by The Record.
    Production was unaffected, and Equinor said it was too early to say how long
    repairs would take (Equinor update, 18 Nov 2026).
  ai_involvement:
    - stage: attack
      level: unknown
      note: Equinor has not named the attackers or the method, saying only that it was not
        a virus and so could not spread. Neither its statement nor The Record's report
        mentions AI.
