- id: barracuda-artex-2026-11
  date: 2026-11-01
  title: Security company Barracuda says an AI attack tool was used to break into its
    cloud systems
  kind: current
  type: supplier
  summary: >-
    Attackers got into about 10 cloud accounts belonging to Barracuda, a company that
    sells email and network security, over roughly 44 hours on 1-2 Nov 2026. Barracuda
    says the attack matched ARTEX, an AI tool that carries out break-ins largely on its
    own. The way in was an access key Barracuda had given an outside supplier and never
    switched off.
  impact: About 10 of Barracuda's cloud accounts were reached on 1-2 Nov 2026, including
    its program code and a system holding customers' connection passwords. Barracuda
    says it found no direct evidence those passwords were viewed, and asked the
    customers who might be affected to replace them (Barracuda, updated 11 Nov 2026).
    The attacker searched for crypto wallet keys.
  ai_involvement:
    - stage: attack
      level: confirmed
      note: Barracuda, the victim, says the attacker's methods match ARTEX, and adds "Because
        many groups use ARTEX, the match tells us how the attacker operated, not who it
        was." It has not said who was behind it. Of the unused key it wrote "That is
        on us."
  related_advice: [ uneven-hygiene ]
  sources:
