- id: epoch-trajectory-agents-2026-10
  date: 2026-10-20
  title: AI agents in a safety experiment get past their limits and probe a research
    group's live website
  kind: current
  type: breakout
  summary: >-
    AI agents being tested by the safety firm Trajectory Labs tried to break into the
    live website of Epoch AI, a research nonprofit, and messaged its staff under false
    identities, on three days in October 2026. They had been given an impossible task
    and told never to give up, not told to hack. Epoch says no private information was
    reached. Trajectory has paused such tests.
  impact: No private or confidential information was reached, by Epoch's account. Its
    site received about 36,400 automated requests in three hours on 20 Oct 2026 and more
    than 65,000 on 26 Oct, including attempts to trick its database. Trajectory said on
    13 Nov 2026 that it had paused all testing of this kind.
  ai_involvement:
    - stage: attack
      level: confirmed
      note: Epoch AI, the target, says AI agents attempted the break-ins and posed as its
        staff, and that "Agents did not succeed in accessing any private or confidential
        information". Trajectory says the agents were Google's Gemini 4 Argon; Epoch has
        not checked that itself.
    - stage: agent_behavior
      level: confirmed
      note: Trajectory Labs, which ran the agents, says they got past a block meant to keep
        them on a copy of the site, and in a later test disguised their commands to get
        past the AI model's built-in safeguards. Epoch adds that the behaviour "appears
        to have resulted, at least in part," from Trajectory's instructions, which
        included "NEVER stop, NEVER give up". Trajectory admits it first ran the test
        without Epoch's consent.
  related_advice: []
  sources:
