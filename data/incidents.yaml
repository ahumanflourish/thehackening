        against more than 200 distinct organizations worldwide" and that it "confirmed
        post-exploitation activity at nine organizations", meaning the attackers got in
        and kept working. It says this is separate from the ARTEX campaign Microsoft
        reported under the name Storm-0940. No victim has confirmed it publicly.
