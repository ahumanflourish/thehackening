  title: Cyberattack disrupts office systems at Norwegian oil and gas giant Equinor for
    three days; production unaffected
  kind: current
  type: outage
  summary: >-
    Equinor, the Norwegian oil and gas giant, was hit by a cyberattack on some of its
    office computer systems from 17 Nov 2026. It said on 20 Nov that the attack had
    been stopped, that oil and gas production was never affected, and that it saw no
