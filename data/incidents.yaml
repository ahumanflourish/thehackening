  title: "PHP2Shell: two critical flaws in the software behind most websites"
  kind: current
  type: software-flaw
  summary: >-
    Two critical flaws in PHP, the software that runs most websites, let attackers run
    their own commands on a site's server. An emergency fix was released on 21 Oct 2026
    after the agreed secrecy period broke early. Many sites went read-only or offline
    while administrators installed it. Older PHP versions no longer get regular fixes;
    the PHP team issued minimal patches for some of them.
  impact: Widespread temporary site shutdowns; a large share of sites run PHP versions
    that no longer get regular fixes. From 30 Oct 2026, attackers used the flaws to get
    into security devices made by Check Point and then wiped data at organizations in
    Israel, Check Point said (reported 13 Nov 2026). It gave no count of victims.
  ai_involvement:
    - stage: discovery
      level: confirmed
      note: Security teams at several firms found the flaws with help from advanced AI models,
        by their own accounts and per OpenAI's coordinated disclosure. This rating is
        about the defenders who found the flaw, not about attackers.
    - stage: attack
      level: unknown
      note: Amazon reported attacks using the flaws from 17 October, four days before the fix
        was released; whether the attackers used AI is not known. The reports of the
        Check Point attacks do not mention AI.
  related_advice: [ shrink-patch-lag ]
