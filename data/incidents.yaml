- id: cairn-china-unit42-2026-11
  date: 2026-11-12
  title: Security firm finds China-linked hackers used AI agents to break into 10
    organizations
  kind: current
  type: one-to-many
  count: { total: 19, hit: 10, spread: scatter, caption: "Break-ins confirmed at 10 of at least 19 organizations targeted." }
  summary: >-
    China-linked hackers used AI agents to break into 10 organizations in August and
    September 2026, the security firm Palo Alto Networks reported on 12 Nov. The
    hackers named a target and a goal; the AI planned and carried out the steps.
    Targets included computer-chip suppliers, defence-policy groups and a US teachers'
    union, where over a million member records were reached.
  impact: 25 attack runs against at least 19 organizations, with access or data taken
    confirmed at 10, each run lasting between 20 minutes and more than 50 hours
    (Palo Alto Networks, 12 Nov 2026). The firm says the AI raised the number of
    targets attacked, not the difficulty of the attacks; the weaknesses used were
    already known.
  ai_involvement:
    - stage: attack
      level: confirmed
      note: Unit 42, Palo Alto Networks' research team, says "The attackers supplied a target
        and a goal, then Cairn planned, executed and recorded results on its own." Cairn
        is an AI agent system. Unit 42 judges with moderate confidence that this was
        Chinese intelligence gathering by one operator or a small team. No victim has
        confirmed it publicly. This is a separate campaign from the 100-website one.
  related_advice: [ uneven-hygiene ]
  sources:
    - title: Attackers Use Autonomous AI to Target Semiconductor, Defense and Civil Society
        Sectors, Unit 42
      url: https://unit42.paloaltonetworks.com/cairn-framework-ai-autonomous-attacks/
  updated: 2026-11-15

- id: cold-chain-hacks-2026-11
  date: 2026-11-05
  title: US agencies warn of mass hacks of freezers and refrigeration systems
  kind: current
  type: devices
  summary: >-
    Hackers are breaking into internet-connected freezers and refrigeration systems,
    warned the FBI, the US cybersecurity agency CISA and three other federal
    departments. Reported targets include supermarket freezers in at least a dozen
    European countries, where food spoiled, freezers run by the US military, and a
    French blood bank (stopped before supplies were harmed). France has formally blamed
    hackers linked to Iran's Revolutionary Guard.
  impact: Food spoiled in several European countries, and medical cold storage was
    targeted. France says attacks on 11-12 Oct 2026 hit refrigeration at about 700
    shops, spoiled food worth millions of euros and started at least 15 fires, and it
    formally blamed hackers linked to Iran's Revolutionary Guard (reported 10 Nov
    2026). The US government has not officially blamed anyone (as of 10 Nov 2026). On
    12 Nov researchers at the security firm VulnCheck published 14 flaws in one widely
    used make of refrigeration controller and saw break-in attempts within two hours;
    they say nothing ties those attempts to the October attackers (SecurityWeek, 16 Nov
    2026).
  ai_involvement:
    - stage: attack
      level: unknown
