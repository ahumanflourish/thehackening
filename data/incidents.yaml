  title: Indian agencies warn that criminals are using AI to attack banks and lenders
  kind: current
  type: advisory
  summary: >-
    India's Home Ministry cybercrime unit and its cyber emergency team, CERT-In, warned
    in early November 2026 that criminals are using AI tools to attack banks and lenders
    for money. Neither warning names a victim. Days earlier, about Rs 7.8 crore (78
    million rupees) left small-loan lender Spandana Sphoorty's bank account without
    authorization; neither agency has tied that loss to AI.
  impact: Sector-wide warnings. One lender reported an unauthorized transfer of about Rs
    7.8 crore to 82 accounts on 1 Nov 2026; nobody has attributed it to AI.
