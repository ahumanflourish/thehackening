- id: java4shell-2026-11
  date: 2026-11-17
  title: "Java4Shell: a serious flaw, found with AI's help, in software most big companies
    run"
  kind: current
  type: software-flaw
  summary: >-
    A serious flaw in Java, software that runs inside a great many business systems,
    was made public on 17 Nov 2026. It can let an outsider crash a system or, with more
    work, take it over without a password. The security firm that found it says AI
    helped it do so in about an hour. The US cybersecurity agency CISA urged immediate
    updates. Security firms have since reported attackers probing for it; no
    successful attack had been confirmed as of 20 Nov.
  impact: A fix is in Oracle's November 2026 update, but other suppliers' versions of
    Java were still waiting for theirs as of 17 Nov 2026 (SecurityWeek). Only some
    newer Intel-type processors are affected. Some security firms said their decoy
    systems were recording scans and attempted attacks, by The Hacker News's account
    (article updated 19 Nov 2026); none reported a successful break-in. The flaw was
    not on the US cybersecurity agency's list of flaws known to be used in attacks
    when we checked on 20 Nov 2026.
  ai_involvement:
    - stage: discovery
      level: confirmed
      note: Calif, the security firm whose researchers Oracle credits with the find, says
        AI played a key part, and that "It took our own Quang Luong an hour to discover
        the vulnerability". It has not named the AI model. This rating is about the
        defenders who found the flaw, not about attackers.
    - stage: attack
      level: unknown
      note: No successful attack had been reported as of 20 Nov 2026. The Hacker News
        quotes the security firm watchTowr as saying "We are already seeing attackers
        spray the internet", and says another firm, Previdian, logged nine attempts on
        its decoy systems. Nobody has said whether those attackers used AI. Calif
        says it is holding back its working attack code until people have had time to
        update.
  related_advice: [ shrink-patch-lag ]
  sources:
