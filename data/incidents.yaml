- id: us-water-utilities-2026-07
  date: 2026-07-27
  title: Hackers tamper with control equipment at water utilities in at least seven US
    states
  kind: current
  type: devices
  summary: >-
    Hackers got into control equipment at water utilities in at least seven US states
    from 27 July 2026, the FBI and the Environmental Protection Agency warned. They
    changed settings and passwords, so operators could no longer watch or control some
    equipment; reported effects included lost water pressure and flooding. The devices
    were reachable directly from the internet. Nobody has been officially blamed.
  impact: Some water operations were degraded, by the FBI and EPA's account (30 July
    2026). In Minnesota more than 30 municipal water facilities were targeted; the
    state said no water supply was contaminated (NBC News, 31 July 2026). The agencies
    gave no total number of utilities.
  ai_involvement:
    - stage: attack
      level: unknown
      note: The FBI and EPA notice names no attacker and does not mention AI. A law
        enforcement official told NBC News the Minnesota attack had hallmarks of Iran;
        that is not an official finding.
  related_advice: [ water-food-medications ]
  sources:
