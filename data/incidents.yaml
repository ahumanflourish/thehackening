- id: faa-ground-stop-2026-11
  date: 2026-11-13
  title: FAA halts flights across the US after air traffic communications failure
  kind: current
  type: outage
  summary: >-
    The FAA, the US aviation regulator, halted flights nationwide for more than four
    hours after communications failed at its regional air traffic control centers. The
    Secretary of Homeland Security said there was no indication of an attack "as of
    right now". The FAA blames a data overload on an old analog system. The cause is
    still under investigation.
  impact: >-
    Flights halted for about four hours 20 minutes (per Wikipedia, citing CNBC); at
    least 827 flights diverted, with roughly 11,000 departures scheduled after it began
    (per OPB).
  ai_involvement:
    - stage: attack
      level: unlikely
      note: Officials call it a telecommunications outage caused by a data overload, with no
        indication of an attack; this is preliminary and nothing has been formally ruled
        out.
    - stage: agent_behavior
      level: unlikely
      note: Officials said they would examine any link to the FAA's new AI tool that
        recommends flight reroutes; Wikipedia reports the FAA denies it caused the halt,
        which no primary source yet confirms.
  related_advice: []
  sources:
    - title: Flights halted at airports across US due to air traffic control communications
        problems, OPB
      url: https://www.opb.org/article/2026/11/13/flights-halted-at-airports-across-us-due-to-air-traffic-control-communications-problems/
    - title: FAA issues nationwide ground stop, KSAT
      url: https://www.ksat.com/news/local/2026/11/13/faa-issues-nationwide-groundstop/
    - title: 2026 FAA communication outage, Wikipedia
      url: https://en.wikipedia.org/wiki/2026_FAA_communication_outage
    - title: Secretary Duffy's post, linked from Elizabeth's thread
      url: https://x.com/SecDuffy/status/2121351591106072679
  needs_research: true
  updated: 2026-11-13

- id: microsoft-365-outage-2026-11
  date: 2026-11-12
  title: Microsoft 365 outage disrupts Outlook, Teams and Copilot worldwide
  kind: current
  type: overload
  summary: >-
    Microsoft's work email and collaboration services, including Exchange Online, Teams,
    SharePoint Online, Copilot and Defender XDR, were disrupted worldwide and were still
    recovering a day later. Microsoft reports no evidence of malicious activity. It said
    servers became unexpectedly unavailable and a process that sets up secure
    connections was overwhelmed, and it rolled back a recent network change that
    coincided with the start.
  impact: Worldwide email and collaboration disruption, starting in the Americas at 1:26
    PM ET and lasting into a second day; no confirmed end time as of 13 Nov.
  ai_involvement:
    - stage: attack
      level: unlikely
      note: Microsoft (incident MO1550821) blames overloaded infrastructure and a
        configuration change and reports no evidence of malicious activity; it has
        promised a post-incident report but has not yet published a root cause.
  related_advice: [ offline-backups ]
  sources:
    - title: Massive Microsoft 365 outage disrupts Outlook, Teams, Copilot worldwide,
        BleepingComputer
      url: https://www.bleepingcomputer.com/news/microsoft/massive-microsoft-365-outage-disrupts-outlook-teams-copilot-worldwide/
    - title: Microsoft 365 outage disrupts Outlook, Exchange Online and Teams, SecurityWeek
      url: https://www.securityweek.com/microsoft-365-outage-disrupts-outlook-exchange-online-and-teams/
    - title: Microsoft 365 Status post, linked from Elizabeth's thread
      url: https://x.com/MSFT365Status/status/2120938282204688468
  needs_research: true
  updated: 2026-11-13

- id: cold-chain-hacks-2026-11
  date: 2026-11-05
  title: US agencies warn of mass hacks of freezers and refrigeration systems
  kind: current
  type: devices
  summary: >-
    Hackers are breaking into internet-connected refrigeration and cold-storage
    monitoring systems, warned the FBI, the US cybersecurity agency CISA and the
    Departments of Agriculture, Health and Human Services, and Transportation. Reported
    targets include supermarket freezers in at least a dozen countries, freezers on US
    military bases and a French blood bank (stopped before supplies were harmed). Some
    were remote-control units that no longer receive updates.
  impact: Food and medical cold storage targeted in several countries; no official word on
    who is responsible.
  ai_involvement:
    - stage: attack
      level: unknown
      note: No official has attributed the intrusions to AI.
  related_advice: [ water-food-medications, shrink-patch-lag ]
  sources:
    - title: US government warns of ongoing cyber threat amid mass hacks of industrial, retail
        and military freezers, TechCrunch
      url: https://techcrunch.com/2026/11/05/u-s-government-warns-of-ongoing-cyber-threat-amid-mass-hacks-of-industrial-retail-and-military-freezers/
  updated: 2026-11-13

- id: india-lenders-ai-agents-2026-11
  date: 2026-11-04
  title: Indian agencies warn of AI-agent attacks on banks and lenders
  kind: current
  type: advisory
  summary: >-
    India's Home Ministry cybercrime unit and cyber emergency team, CERT-In, warned that
    criminals are using AI to attack banks and lenders for money. Days earlier, about Rs
    7.8 crore (78 million rupees) left small-loan lender Spandana Sphoorty's bank
    account for 82 accounts without authorization; neither warning ties that loss to AI.
    CERT-In named an AI-assisted group it calls CRAFTY FALCON.
  impact: At least one lender's funds moved out without authorization; sector-wide advisories.
  ai_involvement:
    - stage: attack
      level: confirmed
      note: The Home Ministry says criminals used AI agents to break into systems and CERT-In
        describes AI-driven scanning and attack scripts, but neither ties the Spandana
        loss itself to AI.
  related_advice: []
  sources:
    - title: Spandana Sphoorty cyber fraud and the Home Ministry advisory, The Week
      url: https://www.theweek.in/news/sci-tech/2026/11/05/spandana-sphoorty-cyber-fraud-mha-advisory.html
  updated: 2026-11-13

- id: arkea-heist-2026-11
  date: 2026-11-01
  title: Attackers steal about €100 million from French bank Crédit Mutuel Arkéa
  kind: current
  type: heist
  summary: >-
    Attackers stole about €100 million from French bank Crédit Mutuel Arkéa, by the
    bank's own figure; it said customer funds were unaffected. The attackers got in
    through a service provider's platform and used the bank's own account to send
    transfers to other banks, later converted to crypto. The bank called it a
    sophisticated outside attack, now contained. Disclosed on 4 Nov.
  impact: About €100 million of the bank's own money; customer funds reported unaffected.
  ai_involvement:
    - stage: attack
