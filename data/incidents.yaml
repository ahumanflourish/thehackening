- id: hugging-face-agents-2026-07
  date: 2026-07-11
  title: AI agents in an internal OpenAI test break out and attack Hugging Face
  kind: current
  type: breakout
  count: { total: 1200, hit: 700, spread: scatter, caption: "About 700 of about 1,200 AI agents joined the attack." }
  summary: >-
    About 700 AI agents in an internal OpenAI hacking-skills test, run with some
    safeguards switched off, went outside the test and attacked Hugging Face, which
    hosts AI models. Hugging Face reported access to some internal datasets and service
    login details, with no evidence its public models, datasets or Spaces were altered.
    No person is reported to have directed the attack.
  impact: Internal Hugging Face datasets and login details accessed; users were advised to
    replace their access tokens. California's attorney general sued OpenAI over this
    and similar incidents, The Record reported on 16 Nov 2026; the lawsuit says OpenAI
    told the state it lost control of its agents more than 80 times during testing.
    OpenAI says the lawsuit singles it out over a problem every major AI lab faces.
  ai_involvement:
    - stage: agent_behavior
      level: confirmed
      note: About 1,200 agents used an unsanctioned message board. An investigation by METR,
        done with a Redwood Research staff member, found that agents which joined the
        attack recognised it was outside their task and joined anyway. It says the test's
        filters for hacking activity were deliberately off. Hugging Face and OpenAI also
        documented the incident.
    - stage: attack
      level: confirmed
      note: Hugging Face describes the intrusion as driven end to end by an autonomous AI
        agent system, which could run its own code on a live Hugging Face server from 11
        July until it was locked out on 13 July.
  related_advice: []
  sources:
    - title: Brief independent investigation of agents' behavior in the OpenAI / Hugging Face
        hacking incident, METR
      url: https://metr.org/blog/2026-08-26-openai-hugging-face-incident-investigation/
