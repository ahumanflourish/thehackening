# Charts drawn at build time from the numbers below. One series per chart.

- id: chrome-fixes
  title: Security fixes in Google Chrome, per month
  takeaway: >-
    These are flaws that were found and fixed, not attacks. For years Chrome fixed
    a few dozen a month. Since May 2026 it has fixed several hundred a month, with
    a peak of 996 in June.
  unit: fixes
  note: >-
    Google says AI tools are finding and fixing these flaws much faster, both its
    own tools and reports from outside researchers. More flaws found and fixed is
    not the same as more attacks, but similar tools are available to attackers.
  as_of: 2026-11-11
  source:
    title: Chrome Releases blog, every desktop stable update, counted by month
    url: https://chromereleases.googleblog.com/
  also:
    title: Stronger with every update, Chrome Security Team (the original chart)
    url: https://blog.google/security/chrome-stronger-with-every-update/
