# Charts drawn at build time from the numbers below. One series per chart.

- id: chrome-fixes
  title: Security fixes in Google Chrome, per month
  takeaway: >-
    For years Chrome shipped a few dozen security fixes a month. In spring 2026
    that jumped more than tenfold and has stayed there.
  unit: fixes
  note: >-
    Most of these flaws were found and fixed by Google itself, which says the
    rise comes from using AI to search its own code. More flaws found is not
    the same as more attacks, but the same tools are available to attackers.
  as_of: 2026-11-11
  source:
    title: Chrome Releases blog, every desktop stable update, counted by month
    url: https://chromereleases.googleblog.com/
  also:
    title: Stronger with every update, Chrome Security Team (the original chart)
    url: https://blog.google/security/chrome-stronger-with-every-update/
