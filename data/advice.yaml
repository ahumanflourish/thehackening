- id: offline-backups
  threat_model: infrastructure
  title: Keep a backup of important files on an unplugged drive
  kind: action
  tier: 2
  rank: 13
  time: 1 hour
  money: "$60"
  covers: [ infrastructure, personal ]
  short: >-
    An attack or a locked account can take your computer and your online files at the
    same time.
  advice: >-
    Copy important files and scans of key documents to an external drive, and keep it
    unplugged and locked away. Write or print your account recovery codes on paper kept
    somewhere else; don't save them as a file.
  why: >-
    Ransomware is an attack that locks your files and demands payment. It, or a locked
    account, can take your computer and your online files at once. A drive that isn't
    plugged in can't be reached over the internet. But it holds copies of your ID, so
    treat it like the originals: the US agency CISA advises "offline, encrypted
    backups". Recovery codes let someone into your accounts without your phone, so keep
    them on paper, apart from the drive.
  protects_against: Losing your files to an attack, a lockout or an outage
  cost: A drive and an hour
  confidence: established
  review_status: unreviewed
  sources:
    - title: "#StopRansomware Guide (maintain offline, encrypted backups of critical data),
        CISA"
      url: https://www.cisa.gov/stopransomware/ransomware-guide
    - title: Sign in with backup codes, Google Account Help
      url: https://support.google.com/accounts/answer/1187538
  thread_refs:
    - author: Julian Bradshaw
      url: https://www.lesswrong.com/posts/puv8fRDCH9jx5yhbX/johnswentworth-s-shortform/comment/Pw4QBAurnykG3zwp7
      note: Suggests a hard drive (HDD) rather than a solid-state drive (SSD) for offline
        backups, saying SSDs decay faster. We have not checked that claim.
    - author: Gurkenglas
      url: https://www.lesswrong.com/posts/puv8fRDCH9jx5yhbX/johnswentworth-s-shortform/comment/rxHRpDWEDfWE2Xdmw
      note: Back up what you don't want to lose; delete what you don't want leaked.
    - author: Alex A
      url: https://www.lesswrong.com/posts/puv8fRDCH9jx5yhbX/johnswentworth-s-shortform/comment/EAifqfeEHYQ6QJscX
      note: Keep offline or physical copies of key documents, with sensitive information
        under lock and key.
  checklist: true
  checklist_text: Back up important files to a drive you keep unplugged and locked away,
    with recovery codes on paper somewhere else.
  steps:
    - do: Buy an external drive.
      detail: Expect to pay about $60. One commenter suggests the kind labelled HDD rather than SSD for long storage.
    - do: If your computer offers to protect the drive with a password, turn that on.
      detail: Write the password on paper kept somewhere else; without it the backup can't be opened. Not every computer or drive offers this.
    - do: Plug the drive into your computer and copy your important files onto it.
      detail: Photos, documents, and anything you couldn't replace. If the computer is behaving oddly, don't plug in your only backup.
    - do: Scan or photograph your key documents and copy those too.
      detail: IDs, passports, birth certificates, insurance policies, property papers. These make the drive as sensitive as the originals.
    - do: Print or hand-write the recovery codes for your email and main accounts; don't save them as a file.
      detail: "Look in each account's security settings for \"backup codes\" or \"recovery codes\". Google offers them only once 2-Step Verification is on. Never send these codes to anyone."
      url: https://support.google.com/accounts/answer/1187538
      link: "Google: backup codes"
    - do: Keep the paper codes somewhere separate from the drive.
    - do: Eject the drive, unplug it, and keep it somewhere locked at home.
    - do: If you can, use two drives and alternate them.
      detail: Then one bad copy can't ruin your only backup.
    - do: Set a monthly reminder to plug the drive in, copy anything new, and unplug it again.
  updated: 2026-11-14

