  steps:
    - do: Choose a laptop or e-reader to hold the manuals, and keep its charger with it.
    - do: Open the Internet Archive's free collection of survival manuals.
      url: https://archive.org/details/homesteading-survival-manuals
      link: Internet Archive manuals library
    - do: Download a first-aid manual first, as a PDF.
      detail: "Under \"Download options\" choose PDF, then pick the file named Full-First-Aid-Manual-FM-2111.pdf."
    - do: Download a few more manuals on the topics you'd most likely need, such as repairs.
    - do: Add a document of your own listing your contacts, your medications and which accounts you hold.
      detail: Write down which accounts exist and where, not their passwords.
    - do: Turn off the device's Wi-Fi and open each file to check it works offline.
    - do: "Optional: an offline AI chatbot built for emergencies can search manuals on your own computer."
      detail: It needs a recent Mac or Windows PC with at least 16 GB of memory, not an e-reader. The project is listed under sources.
