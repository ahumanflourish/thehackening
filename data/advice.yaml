    - do: Buy two weeks of food that keeps without a fridge and needs little cooking.
      detail: Canned beans, fish and vegetables, rice, pasta, peanut butter, cereal bars. Choose things you already eat, and add a hand-operated can opener.
    - do: Ask your doctor or pharmacist how to keep two extra weeks of your daily medications.
      detail: "Ask: \"Can I get an early refill or a longer supply, so I have a reserve?\""
    - do: Buy a first-aid kit and keep it with the supplies.
    - do: Write today's date on everything and store it together.
    - do: Set a reminder every six months to use up and replace the oldest food, water and medications.
  updated: 2026-11-13

- id: offline-backups
  threat_model: infrastructure
  title: Keep a backup of important files on an unplugged drive
  kind: action
  tier: 2
  rank: 11
  time: 1 hour
  money: "$60"
  covers: [ infrastructure, personal ]
  short: >-
    An attack or a locked account can take your computer and your online files at the
    same time.
  advice: >-
    Copy important files, key documents and your account recovery codes (the backup
    codes that let you log in without your phone) to an external drive. Keep it
    unplugged.
  why: >-
    Ransomware is an attack that locks your files and demands payment. It, or losing
    access to an account, can take your computer and your online files at once. A drive
    that isn't plugged in can't be reached over the internet, so it survives both. Use a
    hard drive, not a solid-state drive (SSD): hard drives hold data longer without
    power.
  protects_against: Losing your files to an attack, a lockout or an outage
  cost: A drive and an hour
  confidence: established
  review_status: unreviewed
  sources:
    - title: "#StopRansomware Guide (maintain offline, encrypted backups of critical data),
        CISA"
      url: https://www.cisa.gov/stopransomware/ransomware-guide
  thread_refs:
    - author: Julian Bradshaw
      url: https://www.lesswrong.com/posts/puv8fRDCH9jx5yhbX/johnswentworth-s-shortform/comment/Pw4QBAurnykG3zwp7
      note: Use HDD rather than SSD for offline backups.
    - author: Gurkenglas
      url: https://www.lesswrong.com/posts/puv8fRDCH9jx5yhbX/johnswentworth-s-shortform/comment/rxHRpDWEDfWE2Xdmw
      note: Back up what you don't want to lose; delete what you don't want leaked.
  checklist: true
  checklist_text: Back up important files and recovery codes to a drive you keep unplugged.
  steps:
    - do: "Buy an external hard drive: the kind labelled HDD, not SSD."
      detail: Expect to pay about $60.
    - do: Plug it into your computer and copy your important files onto it.
      detail: Photos, documents, and anything you couldn't replace.
    - do: Scan or photograph your key documents and copy those too.
      detail: IDs, passports, birth certificates, insurance policies, property papers.
    - do: Download the recovery codes for your email and other main accounts and copy them to the drive.
      detail: "Look in each account's security settings for \"backup codes\" or \"recovery codes\". The link shows how for Google. Never send these codes to anyone."
      url: https://support.google.com/accounts/answer/1187538
      link: "Google: backup codes"
    - do: Eject the drive, unplug it, and keep it somewhere safe at home.
    - do: Set a monthly reminder to plug it in, copy anything new, and unplug it again.
  updated: 2026-11-13

- id: offline-maps-and-addresses
  threat_model: infrastructure
  title: Keep offline maps and a written list of key addresses
  kind: action
  tier: 3
  rank: 18
  time: 1 hour
  money: "Free"
  covers: [ infrastructure ]
  short: >-
    If phones and the internet are down, you can't look up where anyone is.
  advice: >-
    Keep maps that work without the internet, and a written list of addresses: family
    and friends you'd want to reach, people who could help you, your bank branches, and
    the nearest community organizations.
  why: >-
    If phones and the internet are down, you can't look up an address or a route. Most
    of what you'd need in an emergency is specific to you: where your people live and
    where your bank's branches are. General survival guides won't have it, so you have
    to write it down beforehand.
  protects_against: Being cut off from people and help
  cost: An hour
  confidence: reasoned
  review_status: unreviewed
  thread_refs:
    - author: AnnaSalamon
      url: https://www.lesswrong.com/posts/YA2r4rg6SpBtwRqtq/the-hackening-justified-practical-advice-and-open-questions?commentId=pDfo3jPjFbEo6GzRJ
      note: Offline maps and addresses; people without local community might note the nearest
        LDS church to volunteer with.
  checklist: true
  checklist_text: Keep paper maps and a written list of addresses for family, friends and
    your bank branches.
  steps:
    - do: Download your area in Google Maps so it works without the internet.
      detail: In the app, tap your profile picture, then Offline maps. Include the areas where your family and friends live.
      url: https://support.google.com/maps/answer/6291838
      link: "Google Maps: offline maps"
    - do: If you use an iPhone, download the same areas in Apple Maps.
      url: https://support.apple.com/en-us/105084
      link: "Apple Maps: offline maps"
    - do: Buy a paper road map of your region.
    - do: Write on paper the addresses of family and friends you'd want to reach, and of people who could help you.
    - do: Add the addresses of your bank branches and the nearest community organizations.
      detail: For example a library, a community center or a place of worship.
    - do: Make a second copy of the list; keep one at home and one in your bag or car.
    - do: Switch your phone to airplane mode and check the downloaded maps still open.
  updated: 2026-11-13

- id: offline-reference-library
  threat_model: infrastructure
  title: Download first-aid and survival manuals to read offline
  kind: action
  tier: 3
  rank: 19
  time: 1 hour
  money: "Free"
  covers: [ infrastructure ]
  short: >-
    First-aid and repair manuals are free to download now and unreachable in an outage.
  advice: >-
    Download a collection of survival and first-aid manuals to an e-reader or laptop. An
    offline AI chatbot built for emergencies (a "survival LLM") is optional.
  why: >-
    A "survival LLM" is a small AI chatbot that runs on your own device and searches a
    limited set of manuals. Most of its value is the manuals themselves, which you can
    download for free. Most of what you'll need is also specific to you (accounts,
    contacts, medications), so your own records matter more than a general-purpose
    chatbot.
  protects_against: Not being able to look things up
  cost: Free to a few hundred dollars
  confidence: reasoned
  review_status: unreviewed
  sources:
    - title: Survival LLM, Brangus
      url: https://www.brangus.io/survival-llm
    - title: Project N.O.M.A.D. (offline survival computer)
      url: https://github.com/Crosstalk-Solutions/project-nomad
    - title: Homesteading and survival manuals library, Internet Archive
      url: https://archive.org/details/homesteading-survival-manuals/Full-First-Aid-Manual-FM-2111/
  thread_refs:
    - author: Elizabeth
      url: https://www.lesswrong.com/posts/YA2r4rg6SpBtwRqtq/the-hackening-justified-practical-advice-and-open-questions?commentId=NLA7sR9nfjiisGCex
      note: Unsure when she'd actually use a survival LLM.
    - author: eukaryote
      url: https://www.lesswrong.com/posts/YA2r4rg6SpBtwRqtq/the-hackening-justified-practical-advice-and-open-questions?commentId=tKbc2zayH3mrFmv9J
      note: Vouches broadly for the survival library (Where There Is No Doctor, Foxfire,
        military and Red Cross texts).
    - author: Brendan Long
      url: https://www.lesswrong.com/posts/YA2r4rg6SpBtwRqtq/the-hackening-justified-practical-advice-and-open-questions?commentId=zBhs9bduESRzFjXDa
      note: Any laptop with local model weights works.
  checklist: false
  steps:
    - do: Choose an e-reader or laptop to hold the manuals, and keep its charger with it.
    - do: Open the Internet Archive's free collection of survival manuals.
      url: https://archive.org/details/homesteading-survival-manuals
      link: Internet Archive manuals library
    - do: Download a first-aid manual first, as a PDF.
      detail: "On a book's page, look for \"Download options\" and choose PDF."
    - do: Download a few more manuals on the topics you'd most likely need, such as repairs.
    - do: Add a document of your own listing your contacts, your medications and which accounts you hold.
      detail: Write down which accounts exist and where, not their passwords.
    - do: Turn off the device's Wi-Fi and open each file to check it works offline.
    - do: "Optional: add an offline AI chatbot built for emergencies, which searches manuals on your own device."
      url: https://www.brangus.io/survival-llm
      link: Survival LLM, Brangus
  updated: 2026-11-13
