# Advice items for thehackening.ai
# Schema and rating definitions: see CONTRIBUTING.md.
# kind: action (goes in a tier) | know (a fact, shown under its threat) | skip (considered and rejected).
# time and money are badge values: keep them to two words at most; the longer story goes in cost.
# rank = position in the list, 1 first: order by protection gained per hour spent.
# tier: 1 = Start here, 2 = Next, 3 = Later. covers = every threat the item helps with.
# short = the one plain line everyone reads; why = the fuller mechanism, shown on demand.
# Every seed item is unreviewed. Paraphrase thread comments; link to them.

# ---------------------------------------------------------------- personal

- id: password-manager-unique-passwords
  threat_model: personal
  title: Use a password manager and a different password everywhere
  kind: action
  tier: 1
  rank: 1
  time: 1 hour
  money: "Free"
  covers: [ personal ]
  short: >-
    Attackers try every stolen password on other sites, so one reused password can open
    many accounts.
  advice: >-
    Use a password manager (a program that creates, remembers and fills in your
    passwords) and give every account its own long, random password. Start with your
    email and money accounts.
  why: >-
    When one site is broken into, attackers automatically try the stolen email and
    password pairs on other sites. A reused password turns one leak into many break-ins;
    a unique one stops it there. Nobody can remember dozens of random passwords, which
    is the manager's job. CISA, the US cybersecurity agency, advises a different strong
    password of at least 16 characters for each account. Email matters most, because it
    can reset your other accounts.
  protects_against: One leaked password opening your other accounts
  cost: An hour to start; the managers built into phones and browsers are free
  confidence: established
  review_status: unreviewed
  sources:
    - title: Use Strong Passwords, CISA
      url: https://www.cisa.gov/secure-our-world/use-strong-passwords
    - title: Use the Passwords app on Apple devices, Apple Support
      url: https://support.apple.com/en-us/120758
    - title: Get started with Google Password Manager, Google Account Help
      url: https://support.google.com/accounts/answer/6208650
  thread_refs:
    - author: Grendel1209
      url: https://www.lesswrong.com/posts/puv8fRDCH9jx5yhbX/johnswentworth-s-shortform/comment/NGfGhPs7zD9EbLygc
      note: Set every new password with a password manager that makes random ones.
    - author: gilch
      url: https://www.lesswrong.com/posts/puv8fRDCH9jx5yhbX/johnswentworth-s-shortform/comment/stH7hqL88qd7uXeq7
      note: Use a completely different password for each financial account.
  checklist: true
  checklist_text: Use a password manager and a different password on every account,
    starting with email and money accounts.
  steps:
    - do: Pick one password manager and use only that one.
      detail: The Passwords app built into iPhones, iPads and Macs is free and is enough. Dedicated password manager programs also work.
      url: https://support.apple.com/en-us/120758
      link: "Apple: the Passwords app"
    - do: On an Android phone or in the Chrome browser, use Google Password Manager.
      detail: It is free and saves passwords to your Google account, so protect that account first.
      url: https://support.google.com/accounts/answer/6208650
      link: "Google: Password Manager"
    - do: Protect the manager itself with a strong screen lock on your phone and computer.
      detail: A dedicated manager has one main password. Make it long, use it nowhere else, and write it on paper kept somewhere safe at home.
    - do: Change your email password first, letting the manager create and save a long random one.
      detail: "Open your email by typing its address yourself. When you choose a new password, accept the one the manager suggests."
    - do: Do the same for each bank, card, brokerage and payment account.
    - do: Change your other passwords as you next sign in to each site.
      detail: The manager will offer to save each new one.
    - do: If the manager warns that a password is reused or has leaked, change that one next.
    - do: Never type a password into a page you reached from a link in a message.
      detail: Type the site's address yourself or use its app.
  updated: 2026-11-14

- id: hang-up-and-call-back
  threat_model: personal
  title: Hang up and call back before sending money or codes
  kind: action
  tier: 1
  rank: 2
  time: 10 min
  money: "Free"
  covers: [ personal, crypto ]
  short: >-
    Scammers pose as your bank, the police or your family, and AI can now copy a voice
    you know.
  advice: >-
    Never move money, read out a code or install software for anyone who contacted you
    first. Hang up and call the number on your card or statement. Agree a family code
    word.
  why: >-
    A caller says your account is under attack and offers a "safe account", or a
    relative's voice begs for urgent help. The US consumer agency, the FTC, says your
    money is safe where it is: never move it to "protect" it, and never share a
    verification code. The only reliable check is to end the contact and call a number
    you already had. Payments you send yourself are usually not refunded.
  protects_against: Being talked into sending money, giving up a code or letting someone
    onto your device
  cost: Ten minutes now; sometimes an awkward call back
  confidence: established
  review_status: unreviewed
  sources:
    - title: Got a call about fraud activity on your bank account? It could be a scammer,
        FTC
      url: https://consumer.ftc.gov/consumer-alerts/2024/06/got-call-about-fraud-activity-your-bank-account-it-could-be-scammer
    - title: Did someone tell you to move or transfer your money? It could be a scam, FTC
      url: https://www.consumer.ftc.gov/consumer-alerts/2024/01/did-someone-tell-you-move-or-transfer-your-money-it-could-be-scam
    - title: Criminals Use Generative Artificial Intelligence to Facilitate Financial
        Fraud, FBI
      url: https://www.ic3.gov/PSA/2024/PSA241203
  thread_refs:
    - author: gilch
      url: https://www.lesswrong.com/posts/puv8fRDCH9jx5yhbX/johnswentworth-s-shortform/comment/stH7hqL88qd7uXeq7
      note: Assume unexpected contact is a scam; hang up and call the known good number on
        your card or statement.
    - author: Grendel1209
      url: https://www.lesswrong.com/posts/puv8fRDCH9jx5yhbX/johnswentworth-s-shortform/comment/NGfGhPs7zD9EbLygc
      note: Have passwords that only your family knows.
  checklist: true
  checklist_text: Hang up and call back on the number on your card. No bank, agency or
    this site will ever tell you to move or withdraw money to keep it safe.
  steps:
    - do: Treat any unexpected call, text or email about your money or accounts as a scam until checked.
      detail: This includes warnings that you have been hacked. A call warning you about fraud can itself be the fraud.
    - do: Hang up, then call the number on your card or statement yourself.
      detail: Don't use a number, link or callback offer from the caller or message. A real bank will not mind.
    - do: Never move or withdraw money because someone says that will keep it safe.
      detail: "No bank, police force, government agency or this site will ever ask you to. A request to use a \"safe account\" is a scam."
    - do: Never read out or forward a login code or verification code to anyone.
      detail: Codes are for you to type into a site or app you opened yourself. Real staff never need them.
    - do: Never install software or share your screen because someone who contacted you asked.
    - do: Agree a code word with your family, in person, to check a caller is really them.
      detail: If a relative calls in trouble and asks for money, ask for the word, or hang up and call their usual number.
    - do: Save each bank's phone number in your contacts now, copied from the back of your card.
    - do: Share these rules with the people around you most likely to be targeted.
  updated: 2026-11-14

- id: know-the-authorized-line
  threat_model: personal
  title: US banks must refund electronic theft, not payments you sent
  kind: know
  covers: [ personal ]
  short: >-
    In the US, banks must repay electronic transfers a thief made, but not wires or
    payments you were tricked into sending.
  advice: >-
    Report any payment you didn't make to your bank or credit union the same day. In the
    US, federal rules then require a refund of most electronic transfers. Wire
    transfers, paper checks and payments you sent yourself are not covered.
  why: >-
    US Regulation E treats an electronic transfer you didn't make as "unauthorized",
    even if you were careless or tricked into revealing your password. If a thief used
    your card or login, report within 2 business days of finding out and you owe at
    most $50; after that, up to $500. If neither was used, you owe nothing if you report
    within 60 days of the statement. After 60 days, later losses may not be refunded.
  protects_against: Someone using your stolen login to take your money
  cost: None; this is knowledge, not an action
  confidence: established
  confidence_note: Applies to US consumer bank and credit union accounts, not business
    accounts or brokerages. Wire transfers and paper checks are outside this rule and
    are handled under other laws. The bank must investigate, usually within 10
    business days, but banks do sometimes refuse claims.
  review_status: unreviewed
  sources:
    - title: How do I get my money back after an unauthorized transaction from my bank
        account?, CFPB
      url: https://www.consumerfinance.gov/ask-cfpb/how-do-i-get-my-money-back-after-i-discovered-an-unauthorized-transaction-or-money-missing-from-my-bank-account-en-1017/
    - title: Regulation E, 12 CFR 1005.6, liability of consumer for unauthorized
        transfers, CFPB
      url: https://www.consumerfinance.gov/rules-policy/regulations/1005/6/
    - title: Regulation E, 12 CFR 1005.3, coverage (checks and wire transfers excluded),
        CFPB
      url: https://www.consumerfinance.gov/rules-policy/regulations/1005/3/
    - title: Electronic Fund Transfers FAQs, CFPB
      url: https://www.consumerfinance.gov/compliance/compliance-resources/deposit-accounts-resources/electronic-fund-transfers/electronic-fund-transfers-faqs/
    - title: Error Resolution Under Regulation E, Consumer Compliance Outlook
      url: https://www.consumercomplianceoutlook.org/articles/2025/third-issue-2025/error-resolution-under-regulation-e-examiner-insights-and-common-violations
  thread_refs:
    - author: RHollerith
      url: https://www.lesswrong.com/posts/puv8fRDCH9jx5yhbX/johnswentworth-s-shortform/comment/BPqcsafhHTjKgkDGz
      note: Pointed out that the practical cost is the time and effort of enforcing your
        refund right.
    - author: Grendel1209
      url: https://www.lesswrong.com/posts/puv8fRDCH9jx5yhbX/johnswentworth-s-shortform/comment/XYjoFEe6HLuH7jPFK
      note: Disagrees, saying banks must repay only if you weren't negligent. The US
        regulator's text says carelessness can't raise what you owe, but expect to have
        to argue your case.
  checklist: true
  checklist_text: If money leaves your account that you didn't send, tell your bank the
    same day. Never send money because of an unexpected call, text or email.
  updated: 2026-11-14

- id: dont-delegate-money-access
  threat_model: personal
  title: Keep AI tools and apps out of your money accounts
  kind: action
  tier: 2
  rank: 9
  time: 30 min
  money: "Free"
  covers: [ personal, crypto ]
  short: >-
    If something you gave access to moves your money, you usually can't get it refunded.
  advice: >-
    Keep AI assistants, budgeting apps and other connected tools out of any account that
    can send or transfer money. View-only access is safer, but never give a tool your
    password, and check what each connection can do.
  why: >-
    A loss caused by something you gave access to generally counts as authorized, so
    refund promises don't cover it. The broker Fidelity's guarantee says so, naming
    apps, agents and AI, and also excludes losses from sharing your login details.
    Regulation E, the US bank refund rule, has a similar exception. Axios reported in
    October 2026 that major US banks had found outside AI agents in customer accounts,
    some apparently attempting actions users hadn't asked for.
  protects_against: Losing your right to a refund; AI tools misbehaving or being taken over
  cost: Some convenience
  confidence: reasoned
  confidence_note: The broker's terms are clear; whether the bank rule's exception covers
    AI agents hasn't been tested. The Axios report rests on unnamed sources, and no
    losses were reported.
  review_status: unreviewed
  sources:
    - title: Fidelity Customer Protection Guarantee
      url: https://www.fidelity.com/security/customer-protection-guarantee
    - title: Regulation E, 12 CFR 1005.2, definitions (unauthorized transfer), CFPB
      url: https://www.consumerfinance.gov/rules-policy/regulations/1005/2/
    - title: US banks have detected unvetted AI agents accessing customer bank accounts,
        TechRadar
      url: https://www.techradar.com/pro/security/us-banks-have-detected-unvetted-ai-agents-accessing-customer-bank-accounts
  thread_refs:
    - author: Alex A
      url: https://www.lesswrong.com/posts/puv8fRDCH9jx5yhbX/johnswentworth-s-shortform/comment/EAifqfeEHYQ6QJscX
    - author: gilch
      url: https://www.lesswrong.com/posts/puv8fRDCH9jx5yhbX/johnswentworth-s-shortform/comment/stH7hqL88qd7uXeq7
      note: Never give third-party services your password, least of all AI agents.
  checklist: true
  checklist_text: Don't connect AI assistants or budgeting apps to accounts that can move money.
  steps:
    - do: "List every account that can send or transfer money: bank, credit union, brokerage and payment apps."
    - do: Sign in to each one by typing its address or opening its own app, not by following a link.
    - do: Find the list of connected apps and remove any AI assistant, budgeting app or tool you don't need.
      detail: "Look in Settings or Security for \"Connected apps\", \"Linked apps\" or \"Third-party access\". Before removing a connection, check no bill, paycheck or tax filing depends on it."
    - do: For each connection you keep, check that it can only view the account, not move money.
      detail: The connection's entry usually lists what it is allowed to do. If you can't confirm it is view-only, remove it.
    - do: In each AI assistant you use, open its settings and disconnect any bank, brokerage or payment account.
    - do: Change the password on any money account whose password you ever typed into another app or tool.
      detail: Type the new password only into the institution's own site or app.
  updated: 2026-11-14

- id: be-a-normal-case
  threat_model: personal
  title: Banks refund ordinary fraud faster than unusual cases
  kind: know
  covers: [ personal, institutional ]
  short: >-
    Banks refund common kinds of fraud by routine; unusual setups get slow, case-by-case
    review.
  advice: >-
    Keep your money in standard accounts at standard banks and pay through standard
    channels. Then if something goes wrong, it looks like the cases your bank handles
    every day.
  why: >-
    Unusual cases, such as malware picked up while coding with AI or an AI agent you set
    up yourself, are harder to explain and more likely to be treated as approved by you.
    The broker Fidelity pays only if it decides a loss happened "through no fault of
    your own." Losses that hit many customers of a big institution at once get shared
    out; unusual setups don't. Customers of finance apps built on the intermediary
    Synapse were locked out for months, and some never got all their money back.
  protects_against: Slow or refused refunds
  confidence: reasoned
  review_status: unreviewed
  sources:
    - title: Fidelity Customer Protection Guarantee
      url: https://www.fidelity.com/security/customer-protection-guarantee
    - title: Thousands of Americans see their savings vanish in Synapse fintech crisis, NBC
        News
      url: https://www.nbcnews.com/business/consumer/-no-money-thousands-americans-see-savings-vanish-synapse-fintech-crisi-rcna181419
  thread_refs:
    - author: Alex A
      url: https://www.lesswrong.com/posts/puv8fRDCH9jx5yhbX/johnswentworth-s-shortform/comment/EAifqfeEHYQ6QJscX
  checklist: false
  updated: 2026-11-14

- id: uneven-hygiene
  threat_model: personal
  title: Check what you've installed and connected, not just your passwords
  kind: action
  tier: 3
  rank: 17
  time: 1 hour
  money: "Free"
  covers: [ personal, crypto ]
  short: >-
    Strong passwords don't help if a browser add-on or AI tool you installed can act as
    you once you're logged in.
  advice: >-
    Go through every AI tool connected to your email or money accounts, and every
    browser extension, app and code package you installed without checking it. Review
    these as carefully as your passwords.
  why: >-
    Attackers use the weakest way in. Once you log in, your browser keeps you logged in
    so you aren't asked again. A malicious extension or code package can steal that
    logged-in state, which skips your password and any extra login code entirely. Many
    technical people have strong passwords and extra login codes but also connect AI
    agents to email and financial accounts and install unchecked tools.
  protects_against: Malicious add-ons and tools acting as you; AI agents being taken over
  cost: An hour of auditing
  confidence: speculative
  confidence_note: This is a guess about where technical people's gaps are; nobody has measured it.
  review_status: unreviewed
  thread_refs:
    - author: Alex A
      url: https://www.lesswrong.com/posts/puv8fRDCH9jx5yhbX/johnswentworth-s-shortform/comment/EAifqfeEHYQ6QJscX
  checklist: false
  steps:
    - do: Open your email account's list of connected apps and remove any you don't recognise or no longer use.
      detail: For Gmail, the link below shows how. Other email providers list connected apps under their Security or Privacy settings.
      url: https://support.google.com/accounts/answer/13533235
      link: "Google: manage connected apps"
    - do: Check each money account for connected apps and tools in the same way.
      detail: "Look in Settings or Security for \"Connected apps\" or \"Third-party access\". Before removing a connection, check no bill, paycheck or tax filing depends on it."
    - do: Open each AI tool you use, see which accounts it is connected to, and disconnect any it doesn't need.
    - do: Open your browser's list of extensions (small add-on programs) and remove any you don't use or can't identify.
      detail: "In Chrome: the three-dot menu, then Extensions. In Safari: Settings, then Extensions. Other browsers have a similar menu."
      url: https://support.google.com/chrome_webstore/answer/2664769
      link: "Chrome: manage extensions"
    - do: Go through the apps on your phone and computer and delete those you don't use.
      detail: If you don't know what something is, search its name first. Keep your password manager and any app that shows login codes.
    - do: If you write code, list the packages and tools you installed without checking and uninstall those you no longer need.
      detail: A code package is ready-made code downloaded from the internet. If you don't write code, skip this step.
    - do: For anything you removed that looked suspicious, change that account's password and sign out of all devices.
      detail: "Most accounts have a \"Sign out everywhere\" or \"Log out of all devices\" button under Security."
  updated: 2026-11-14

- id: strong-login-and-number-lock
  threat_model: personal
  title: Lock your phone number and stop relying on text-message codes
  kind: action
  tier: 1
  rank: 3
  time: 1 hour
  money: "$0–60"
  covers: [ personal ]
  short: >-
    Text-message codes can be stolen by taking over your phone number, and your email
    can reset every other account.
  advice: >-
    Ask your phone carrier to lock your number against both SIM changes and transfers to
    another carrier. On email and money accounts, add a passkey or security key, set up
    a backup way in, then remove text-message codes.
  why: >-
    A phone number can be taken over two ways: a SIM swap moves it to the attacker's SIM
    card, and a port-out transfers it to another carrier. Either way the attacker gets
    your text codes, so lock against both. Adding a passkey does not switch text codes
    off; remove them yourself after testing another way in. Only passkeys and security
    keys resist fake login pages; codes from an authenticator app can be tricked out of
    you, like text codes.
  protects_against: Someone taking over your phone number or tricking you out of a login code
  cost: About an hour; roughly $30 to $60 per security key if you buy one
  confidence: established
  review_status: unreviewed
  sources:
    - title: My Verizon app, enable or disable SIM Protection and Number Lock, Verizon
      url: https://www.verizon.com/support/knowledge-base-309293/
    - title: Implementing Phishing-Resistant MFA, CISA
      url: https://www.cisa.gov/sites/default/files/publications/fact-sheet-implementing-phishing-resistant-mfa-508c.pdf
    - title: Sign in with a passkey instead of a password, Google Account Help
      url: https://support.google.com/accounts/answer/13548313
    - title: The Hackening (Peter Wildeford's list), Zvi
      url: https://www.lesswrong.com/posts/iqgZaJMnmyDCYfnuC/the-hackening-1
  thread_refs:
    - author: Terence Coelho
      url: https://www.lesswrong.com/posts/puv8fRDCH9jx5yhbX/johnswentworth-s-shortform/comment/EMkqX2trSffWznaXv
      note: Banks often don't allow authenticator apps but do accept YubiKeys.
  checklist: true
  checklist_text: Ask your carrier to block SIM changes and number transfers, then put a
    passkey or security key on your email and bank logins.
  steps:
    - do: In the US, on Verizon, turn on both SIM Protection and Number Lock in the My Verizon app.
      detail: Open the Me tab, then Edit profile and settings, then Security. SIM Protection blocks SIM changes; Number Lock blocks transfers to another carrier. You need both.
      url: https://www.verizon.com/support/knowledge-base-309293/
      link: "Verizon: SIM Protection and Number Lock"
    - do: On AT&T, turn on Wireless Account Lock in the AT&T app.
      detail: "Open the app, tap the person icon, choose \"Wireless account lock\" and swipe to lock. It is free and switches off key account changes on all your lines."
      url: https://www.att.com/support/article/wireless/000102016/
      link: "AT&T: Wireless Account Lock"
    - do: On T-Mobile, turn on both SIM Protection and Port Out Protection in the T-Life app.
      detail: Look for the gear icon, then Security. Menus differ between app versions, so follow the help page below if yours looks different.
      url: https://www.t-mobile.com/support/plans-features/help-with-t-mobile-account-fraud
      link: "T-Mobile: protect your account"
    - do: On any other carrier, call the number on your bill and ask for both protections.
      detail: "Say: \"Please block SIM changes and transfers of my number unless I approve them.\" Never give a PIN or code to anyone who calls or messages you."
    - do: Add a passkey to your email account.
      detail: A passkey means you unlock your phone the way you normally do, and that proves it's you. For Gmail, follow the link; type the address yourself.
      url: https://support.google.com/accounts/answer/13548313
      link: "Google: sign in with a passkey"
    - do: If your email is Outlook or Hotmail, add the passkey in your Microsoft account instead.
      detail: "Sign in, open the security options, choose \"Add a new way to sign in or verify\", then \"Face, Fingerprint, PIN, or Security Key\"."
      url: https://support.microsoft.com/en-us/accounts-billing/security/create-save-passkey
      link: "Microsoft: create a passkey"
    - do: With another email provider, look in its security settings for a passkey or security key option.
    - do: Set up a second way in and test it before you remove anything.
      detail: Add a second passkey or security key, or print backup codes on paper. Google offers backup codes only once 2-Step Verification is on. Sign in once using the backup.
      url: https://support.google.com/accounts/answer/1187538
      link: "Google: backup codes"
    - do: Only then, remove text messages as a sign-in option on your email account.
      detail: Adding a passkey leaves text codes switched on. In the security settings, find the sign-in or 2-step methods and remove the text-message option.
    - do: Repeat on each bank and money account that offers a passkey or security key.
      detail: A security key is a small USB device, roughly $30 to $60. An authenticator app (a phone app showing login codes) beats text codes but can be fooled by fake login pages.
    - do: If text codes are the only extra step your bank offers, leave them on.
      detail: They are much better than nothing, and the carrier locks above protect them.
  updated: 2026-11-14

- id: freeze-everything
  threat_model: personal
  title: Freeze your credit and get an IRS Identity Protection PIN
  kind: action
  tier: 1
  rank: 4
  time: 2 hours
  money: "Free"
  covers: [ personal ]
  short: >-
    Your details have probably leaked; a freeze stops them being used to open accounts
    in your name.
  advice: >-
    In the US, freeze your credit at Equifax, Experian, TransUnion, Innovis and
    ChexSystems (used by many banks to screen new accounts). Get an IRS Identity
    Protection PIN and create your my Social Security account before someone else does.
  why: >-
    Assume your personal details have already leaked: the US saw a record 3,322 data
    compromises in 2025. Most lenders check your credit file before opening an account;
    a freeze blocks that check, so a thief is usually turned down. It is free, doesn't
    change your credit score and doesn't affect accounts you already have. The IRS PIN
    is a number needed to file a tax return in your name; a new one is issued every
    year.
  protects_against: Someone opening accounts or filing taxes in your name
  cost: About two hours across seven websites; free
  confidence: established
  review_status: unreviewed
  sources:
    - title: Credit Freezes and Fraud Alerts, FTC
      url: https://consumer.ftc.gov/articles/credit-freeze-or-fraud-alert-whats-right-your-credit-report
    - title: What is a credit freeze or security freeze on my credit report?, CFPB
      url: https://www.consumerfinance.gov/ask-cfpb/what-does-it-mean-to-put-a-security-freeze-on-my-credit-report-en-1341/
    - title: Get an identity protection PIN, IRS
      url: https://www.irs.gov/identity-theft-fraud-scams/get-an-identity-protection-pin
    - title: 2025 Annual Data Breach Report, Identity Theft Resource Center
      url: https://www.idtheftcenter.org/post/2025-annual-data-breach-report/
    - title: The Hackening (Peter Wildeford's list), Zvi
      url: https://www.lesswrong.com/posts/iqgZaJMnmyDCYfnuC/the-hackening-1
  checklist: true
  checklist_text: Freeze your credit at Equifax, Experian, TransUnion, Innovis and
    ChexSystems, and get an IRS Identity Protection PIN.
  steps:
    - do: In the US, get an IRS Identity Protection PIN through your IRS online account.
      detail: It is a six-digit number, new every year. The online tool is closed from 16 November 2026 until mid-January 2027; if it is closed, set a reminder to return.
      url: https://www.irs.gov/identity-theft-fraud-scams/get-an-identity-protection-pin
      link: "IRS: get an IP PIN"
    - do: Create your my Social Security account, typing the address yourself rather than following a link.
      detail: "Do this before freezing: signing up includes an identity check, and a credit freeze can sometimes get in its way. You'll need an email address and photo ID."
      url: https://www.ssa.gov/myaccount/
      link: my Social Security
    - do: Freeze your credit at Equifax.
      detail: "You create a free account and confirm your identity. The freeze is free. Decline any paid \"lock\" or monitoring offer; the free freeze is what you need. Write each login on paper."
      url: https://www.equifax.com/personal/credit-report-services/credit-freeze/
      link: Equifax freeze page
    - do: Freeze your credit at Experian.
      url: https://www.experian.com/help/credit-freeze/
      link: Experian freeze page
    - do: Freeze your credit at TransUnion.
      url: https://www.transunion.com/credit-freeze
      link: TransUnion freeze page
    - do: Freeze your credit file at Innovis, a smaller credit bureau.
      detail: Use the online request form on this page, or call 1-866-712-4546.
      url: https://www.innovis.com/personal/securityFreeze
      link: Innovis freeze page
    - do: Place a freeze at ChexSystems, which many banks check before opening a new account.
      detail: You'll receive a PIN by mail or in your online account. Keep it with your important papers; you need it to lift the freeze.
      url: https://www.chexsystems.com/security-freeze/place-freeze
      link: ChexSystems freeze page
    - do: Before you apply for a new card, loan or bank account, lift the freeze, then refreeze afterwards.
      detail: Ask the lender which bureau it checks and lift only that one. At the three big bureaus, a lift requested online or by phone takes effect within an hour.
  updated: 2026-11-14

- id: alerts-and-fast-reporting
  threat_model: personal
  title: Turn on alerts and report anything odd immediately
  kind: action
  tier: 1
  rank: 6
  time: 10 min
  money: "Free"
  covers: [ personal, institutional ]
  short: >-
    Your right to a refund depends on reporting quickly, and you can't report what you
    haven't noticed.
  advice: >-
    Turn on alerts for logins, transfers and profile changes on every financial account,
    and report anything unexpected the same day.
  why: >-
    Refund rules reward speed. In the US, under Regulation E (the rule covering
    bank-account transfers), reporting a stolen card or login within 2 business days of
    finding out caps your loss at $50; waiting can raise it to $500, and losses after 60
    days from the statement may not be refunded. The brokerage Fidelity's guarantee
    likewise requires prompt reporting. Alerts tell you the day something happens,
    instead of weeks later on a statement.
  protects_against: Losing refund rights by noticing too late
  cost: Ten minutes
  confidence: established
  review_status: unreviewed
  sources:
    - title: How do I get my money back after an unauthorized transaction from my bank
        account?, CFPB
      url: https://www.consumerfinance.gov/ask-cfpb/how-do-i-get-my-money-back-after-i-discovered-an-unauthorized-transaction-or-money-missing-from-my-bank-account-en-1017/
    - title: Regulation E, 12 CFR 1005.6, liability of consumer for unauthorized
        transfers, CFPB
      url: https://www.consumerfinance.gov/rules-policy/regulations/1005/6/
    - title: Fidelity Customer Protection Guarantee
      url: https://www.fidelity.com/security/customer-protection-guarantee
    - title: Error Resolution Under Regulation E, Consumer Compliance Outlook
      url: https://www.consumercomplianceoutlook.org/articles/2025/third-issue-2025/error-resolution-under-regulation-e-examiner-insights-and-common-violations
  checklist: true
  checklist_text: Turn on login, transfer and profile-change alerts on every money account.
  steps:
    - do: Sign in to each financial account by typing its address or opening its own app.
    - do: Open the alerts or notifications settings.
      detail: Usually under Settings, Profile or Security. If you can't find them, call the number on the back of your card and ask.
    - do: Turn on alerts for logins, for transfers and withdrawals, and for changes to your profile.
      detail: Profile changes means a new password, phone number, email or address. Set money alerts to the lowest amount offered.
    - do: Choose how alerts reach you (app notification, email or text) and pick one you look at every day.
    - do: Save each institution's fraud phone number, from the back of your card or a statement, in your contacts.
    - do: If an alert shows something you didn't do, call that saved number the same day and report it.
      detail: Don't use a phone number or link inside the alert itself. Note the date, the time and the name of the person you spoke to.
  updated: 2026-11-14

- id: spend-on-credit-cards
  threat_model: personal
  title: Spend on credit cards rather than debit cards
  kind: action
  tier: 1
  rank: 7
  time: 15 min
  money: "Possible interest"
  covers: [ personal ]
  short: >-
    A fraudulent credit card charge spends the bank's money while it's disputed; a debit
    charge empties your account.
  advice: >-
    Use credit cards for day-to-day spending and pay the full balance every month from a
    bank account, so you pay no interest.
  why: >-
    US federal law caps your liability for unauthorized credit card charges at $50, and
    issuers usually waive even that. A fraudulent charge spends the bank's money while
    it's disputed, not yours; a fraudulent debit charge empties your account until it's
    resolved.
  protects_against: Card fraud draining your cash
  cost: Free if you pay the full balance every month; interest if you don't
  confidence: established
  review_status: unreviewed
  sources:
    - title: Regulation Z, 12 CFR 1026.12(b), liability of cardholder for unauthorized use,
        CFPB
      url: https://www.consumerfinance.gov/rules-policy/regulations/1026/12/
    - title: 15 U.S.C. 1643, liability of holder of credit card, Cornell Legal Information
        Institute
      url: https://www.law.cornell.edu/uscode/text/15/1643
    - title: How do I get my money back after an unauthorized transaction from my bank
        account?, CFPB
      url: https://www.consumerfinance.gov/ask-cfpb/how-do-i-get-my-money-back-after-i-discovered-an-unauthorized-transaction-or-money-missing-from-my-bank-account-en-1017/
  checklist: false
  steps:
    - do: Pick a credit card you already have to use for everyday spending.
      detail: If you don't have one, ask your own bank or credit union what it offers. If your credit is frozen, lift the freeze before you apply.
    - do: Set the card to pay its full balance automatically each month from your bank account.
      detail: "In the card's site or app, look for AutoPay and choose \"statement balance\" or \"pay in full\"."
    - do: Swap your debit card for the credit card in shops, online stores, subscriptions and your phone's wallet.
    - do: Keep your debit card for withdrawing cash only.
    - do: Look over the card's charges each week and report any you don't recognise by calling the number on the card.
  updated: 2026-11-14

- id: shrink-patch-lag
  threat_model: personal
  title: Turn on automatic updates and retire devices that can't update
  kind: action
  tier: 1
  rank: 5
  time: 10 min
  money: "Free"
  covers: [ personal ]
  short: >-
    Once a fix is released, attackers go after devices that haven't installed it, often
    within days.
  advice: >-
    Turn on automatic updates, restart regularly so they install, and replace or unplug
    old routers, phones and cameras that no longer receive updates.
  why: >-
    Once a fix is released, attackers go after devices that haven't installed it.
    CrowdStrike reported that in the first half of 2026, for flaws with public
    demonstration code, 88% of the attacks it observed came within 48 hours of that
    code's release. Most published flaws are never used in attacks, but you can't tell
    which will be. Devices that no longer get updates keep every flaw for good.
  protects_against: Attacks on flaws an update would have fixed
  cost: Minimal; occasional device replacement
  confidence: established
  review_status: unreviewed
  sources:
    - title: CrowdStrike 2026 Threat Hunting Report, press release
      url: https://www.crowdstrike.com/en-us/press-releases/crowdstrike-2026-threat-hunting-report/
    - title: Windows 10 support has ended on October 14, 2025, Microsoft
      url: https://support.microsoft.com/en-us/windows/windows-10-support-has-ended-on-october-14-2025-2ca8b313-1946-43d3-b55c-2b95b107f281
    - title: The Hackening, Zvi
      url: https://www.lesswrong.com/posts/iqgZaJMnmyDCYfnuC/the-hackening-1
  checklist: true
  checklist_text: Turn on automatic updates everywhere and replace devices that no longer get them.
  steps:
    - do: On an iPhone or iPad, turn on automatic updates.
      detail: Open Settings, then General, then Software Update, then Automatic Updates, and switch everything on.
      url: https://support.apple.com/en-us/118575
      link: "Apple: update your iPhone or iPad"
    - do: On an Android phone, check for updates and install any that are waiting.
      detail: Open Settings, then System, then Software update. The wording varies by phone maker.
      url: https://support.google.com/android/answer/7680439
      link: "Google: update Android"
    - do: On a Windows computer, open Windows Update and install everything offered.
      detail: Open Start, then Settings, then Windows Update.
      url: https://support.microsoft.com/en-us/windows/deployment/updates-lifecycle/install-windows-updates
      link: "Microsoft: install Windows updates"
    - do: If the PC runs Windows 10, upgrade it to Windows 11 if it can.
      detail: Windows 10 stopped getting security updates on 14 October 2025. If the PC can't upgrade, treat it as a device that no longer gets updates; Microsoft's page lists the options.
      url: https://support.microsoft.com/en-us/windows/windows-10-support-has-ended-on-october-14-2025-2ca8b313-1946-43d3-b55c-2b95b107f281
      link: "Microsoft: Windows 10 support has ended"
    - do: On a Mac, turn on automatic updates.
      detail: Open System Settings, then General, then Software Update. Click the (i) button next to Automatic Updates, switch everything on and click Done.
      url: https://support.apple.com/guide/mac-help/keep-your-mac-up-to-date-mchlpx1065/mac
      link: "Apple: keep your Mac up to date"
    - do: Restart every phone and computer at least once a week.
      detail: Many updates only finish installing when the device restarts.
    - do: Look up your router, cameras and other connected devices on their makers' websites to see if they still get updates.
      detail: "Search for the model number printed on the device plus \"end of support\". If its app offers automatic updates, turn them on."
    - do: Replace or unplug any device that no longer gets updates.
      detail: If your internet company supplied the router, call and ask for a current model.
  updated: 2026-11-14

# ----------------------------------------------------------- institutional

- id: spending-money-on-separate-rails
  threat_model: institutional
  title: Split your spending money across two or three unrelated banks
  kind: action
  tier: 2
  rank: 11
  time: 2 hours
  money: "Free"
  covers: [ institutional ]
  short: >-
    Many small banks rent the same systems, so one attack can take several offline at
    once.
  advice: >-
    Split about a month of spending money across two or three institutions that don't
    share systems. Whether to also split long-term savings is disputed. In the US, stay
    within the $250,000 deposit-insurance limit at each.
  why: >-
    Theft and lost access pull in opposite directions: more accounts means more places
    to break into, but one institution is one point of failure. Credit unions and small
    banks mostly rent their main software from a few suppliers. A 2023 ransom attack on
    one outside IT supplier caused outages at about 60 credit unions, and the US credit
    union regulator reported in 2024 that about 73% of incidents reported to it involved
    an outside supplier.
  protects_against: One bank or its supplier going down
  cost: Managing an extra account
  confidence: reasoned
  confidence_note: The shared-supplier outages are documented; the split we recommend is
    our reasoning from them. US deposit insurance covers $250,000 per depositor, per
    insured bank, for each ownership category.
  review_status: unreviewed
  sides:
    for: Thane Ruthenis suggests splitting money across several very different banks, even
      other countries, plus cash and crypto. Eoin Cassidy and gilch also suggest several
      institutions; gilch accepts that this gives attackers more to aim at.
    against: "This site's own view, not the commenters': every extra account is another
      login to defend, so long-term savings may be safer in one well-defended place.
      Foreign accounts and crypto also bring transfers that can't be reversed."
    synthesis: Split spending money now, across banks in your own country. Splitting
      long-term savings is a judgment call between more accounts to defend and a single
      point of failure. Either way, stay within deposit-insurance limits at each.
  sources:
    - title: 60 credit unions facing outages due to ransomware attack, Cybersecurity Dive
      url: https://www.cybersecuritydive.com/news/credit-unions-outages-ransomware/701442/
    - title: Cybersecurity and Credit Union System Resilience, annual report to Congress
        (June 2024), NCUA
      url: https://ncua.gov/news/publication-search/cybersecurity/cybersecurity-and-credit-union-system-resilience-annual-report-congress-2
    - title: Understanding Deposit Insurance, FDIC
      url: https://www.fdic.gov/resources/deposit-insurance/understanding-deposit-insurance
    - title: Share Insurance Coverage, NCUA
      url: https://ncua.gov/consumers/share-insurance-coverage
    - title: Credit Union & Community Bank Cyber Incident Report 2026, BlueRadius
      url: https://blueradius.io/credit-union-cyber-incident-report-2026
  thread_refs:
    - author: Thane Ruthenis
      url: https://www.lesswrong.com/posts/puv8fRDCH9jx5yhbX/johnswentworth-s-shortform/comment/4bAkyL8jgkmpoCFkc
      note: Diversify across providers with different vulnerability profiles.
    - author: Eoin Cassidy
      url: https://www.lesswrong.com/posts/wJunGnpY3qACWSvnh/on-open-weights-mythos-capabilities?commentId=exKY2kwxHcfSuCm2m
      note: Spread cash and assets across multiple institutions.
    - author: gilch
      url: https://www.lesswrong.com/posts/puv8fRDCH9jx5yhbX/johnswentworth-s-shortform/comment/stH7hqL88qd7uXeq7
      note: Recommends multiple insured accounts; more to attack, but you probably won't
        lose them all at once.
  checklist: true
  checklist_text: Keep a month of spending money split between two or three different
    banks or credit unions.
  steps:
    - do: Work out roughly what you spend in a month.
      detail: "Add up last month's payments from your statements: rent or mortgage, bills, food, transport."
    - do: "List where you bank now and note what kind each is: large bank, credit union or brokerage."
    - do: Pick one or two more institutions of a different kind, so you have two or three in total.
      detail: "For example: a large national bank, a local credit union, and a cash account at a brokerage (an investment firm)."
    - do: Open the new accounts at a branch, or online by typing the institution's address yourself.
      detail: Expect to show ID. Ask about monthly fees before you sign. If you froze your credit or ChexSystems file, lift the freeze first.
    - do: Split about one month of spending money across the accounts.
    - do: Decide for yourself whether to split long-term savings too; people disagree.
      detail: In the US, keep your total at each bank or credit union within the $250,000 deposit-insurance limit. The FDIC page below explains how the limit works.
      url: https://www.fdic.gov/resources/deposit-insurance/understanding-deposit-insurance
      link: "FDIC: understanding deposit insurance"
  updated: 2026-11-14

- id: link-accounts-in-advance
  threat_model: institutional
  title: Link your accounts to each other before you need to
  kind: action
  tier: 2
  rank: 12
  time: 1 hour
  money: "Free"
  covers: [ institutional ]
  short: >-
    A second account only helps if you can already spend from it, and you can't set that
    up during an outage.
  advice: >-
    If your brokerage (investment firm) offers one, get a debit card for its cash
    account. Add a second bank as a backup payment source for your credit cards. Link
    only spending accounts, not the account holding long-term savings.
  why: >-
    Extra accounts are only useful if money can leave them. You need a card to spend
    from the backup, and a way to pay bills and move money between accounts. Both have
    to be in place beforehand, because you can't set them up during an outage. A link
    works in both directions, though: someone who breaks into one account may be able to
    pull money from the other, so leave long-term savings unlinked.
  protects_against: Being stuck when one institution is down
  cost: An hour
  confidence: reasoned
  review_status: unreviewed
  checklist: true
  checklist_text: Make sure you can spend from and pay bills out of at least two separate accounts.
  steps:
    - do: Ask your brokerage (investment firm) whether it offers a debit card on its cash account.
      detail: "Call the number on your statement, or look under \"Cards\" or \"Cash management\". Not every brokerage offers one; if yours doesn't, rely on a second bank's debit card."
    - do: When the card arrives, activate it and make one small purchase to check it works.
    - do: In each credit card account, add a second bank account as a payment source.
      detail: "Look under Payments for \"Add bank account\". Enter the account details only on the card company's own site or app."
    - do: Link your spending accounts at different institutions so you can move money between them.
      detail: If offered a choice, pick the method that uses account and routing numbers with two small test deposits, not the one that asks for your other bank's password.
    - do: Don't link the account that holds your long-term savings.
      detail: A link lets someone who breaks into one account pull money from the other.
    - do: Ask your employer's payroll office about paying your paycheck into two institutions.
      detail: This one is optional. Ask for the direct deposit form.
    - do: "Test the setup: pay one bill from the backup account and move a small amount between accounts."
  updated: 2026-11-14

- id: cash-sized-to-outages
  threat_model: institutional
  title: Keep about two to three weeks of essentials in cash
  kind: action
  tier: 2
  rank: 10
  time: 30 min
  money: "Earns nothing"
  covers: [ institutional, infrastructure ]
  short: >-
    The best-known US bank outage from an attack lasted about two weeks, with card
    payments and cash withdrawals limited.
  advice: >-
    Keep enough cash at home for two to three weeks of things that can't wait: food,
    gas, medicine. Use mostly $20 bills and smaller, kept somewhere safe and out of
    sight. Don't tell people or post about it.
  why: >-
    In 2024 a ransom attack left Patelco Credit Union without online banking, its app
    or bill payments for about two weeks; cards and cash machines kept working, but
    with limits. That is one credit union: how long an outage across many banks would
    last is a guess, and the amount to hold is our judgment. It will be more than
    renters insurance typically pays for stolen cash (about $200); that uninsured risk
    is the price.
  protects_against: Payment systems or your banks being down
  cost: Uninsured cash earning nothing
  confidence: reasoned
  confidence_note: The Patelco outage is documented; how much cash to hold is a judgment,
    and people disagree about it.
  review_status: unreviewed
  sides:
    for: One commenter suggests about four weeks of expenses in cash as a partial hedge;
      gilch says to keep food, water and cash on hand and that three days isn't enough.
    against: Larger amounts are uninsured against theft and fire and earn nothing. hadad
      calls stored cash "semi-reasonable" but argues against holding much, because it
      misses out on investment growth.
    synthesis: Hold enough cash for essentials through a two-week outage plus a margin, not
      enough to cover all your expenses.
  sources:
    - title: Patelco restores most banking services weeks after ransomware attack, KQED
      url: https://www.kqed.org/news/11994012/patelco-restores-most-banking-services-weeks-after-massive-ransomware-attack
    - title: Patelco CEO update to members, 1 July 2024 (cards limited, ATMs available)
      url: https://patelco.org/wp-content/uploads/2024/07/July-1-CEO-Update.pdf
    - title: Patelco ransomware outage, The Register (card and ATM limits)
      url: https://www.theregister.com/2024/07/03/patelco_ransomware_outage/
    - title: Does renters insurance cover stolen cash?, Policygenius
      url: https://www.policygenius.com/renters-insurance/does-renters-insurance-cover-stolen-cash/
  thread_refs:
    - author: RHollerith
      url: https://www.lesswrong.com/posts/puv8fRDCH9jx5yhbX/johnswentworth-s-shortform/comment/BPqcsafhHTjKgkDGz
      note: Suggests about four weeks of expenses in cash as a partial hedge against weeks
        without payment systems.
    - author: gilch
      url: https://www.lesswrong.com/posts/puv8fRDCH9jx5yhbX/johnswentworth-s-shortform/comment/stH7hqL88qd7uXeq7
      note: Keep food, water and cash on hand; three days isn't enough, with diminishing
        returns beyond.
    - author: hadad
      url: https://www.lesswrong.com/posts/wJunGnpY3qACWSvnh/on-open-weights-mythos-capabilities
      note: Cash stored securely could be "semi-reasonable", but holding it all in cash
        misses investment growth.
  checklist: true
  checklist_text: Keep two to three weeks of essentials in cash at home, mostly $20s and smaller.
  steps:
    - do: Add up what your household spends in two to three weeks on food, gas and medicine.
    - do: Withdraw that amount at a bank branch and ask for $20 bills and smaller.
      detail: For a larger sum, phone the branch first so they have it ready.
    - do: Store the cash at home somewhere safe and out of sight.
    - do: Don't mention the cash to anyone outside your household, and don't post that you've done this.
    - do: Replace anything you spend from it as soon as you can.
  updated: 2026-11-14

- id: act-on-early-signals
  threat_model: institutional
  title: Decide now what you will do if banks are attacked
  kind: action
  tier: 3
  rank: 18
  time: 30 min
  money: "Free"
  covers: [ institutional ]
  short: >-
    A calm plan made now beats a rushed decision on a frightening news day.
  advice: >-
    Decide now on one narrow trigger: banks you use, or several banks in your country,
    have stopped card payments or withdrawals for over a day, confirmed by the banks or
    regulators. Then top up to your planned emergency cash only.
  why: >-
    "Your bank has been hacked, move your money" is the script of a common scam, so the
    trigger must be narrow. Stolen customer records, and the events on this site's news
    page, do not meet it. The precedents are thin: in June 2015 Greece closed its banks
    for almost three weeks and capped withdrawals at €60 a day, in a debt crisis, not a
    cyberattack. After suspected AI-assisted breaches in South Korea in 2026,
    instant-access deposits at the five biggest banks fell about 3%; the cause is not
    established.
  protects_against: Deciding in a panic, or being short of cash in a long outage
  cost: None until triggered
  confidence: speculative
  confidence_note: Nobody in the source discussions proposed this; it is the maintainer's
    own idea. The precedents are a debt crisis and one unexplained fall in deposits.
  review_status: unreviewed
  sources:
    - title: Got a call about fraud activity on your bank account? It could be a scammer,
        FTC
      url: https://consumer.ftc.gov/consumer-alerts/2024/06/got-call-about-fraud-activity-your-bank-account-it-could-be-scammer
    - title: After 3 years, Greece ends limits on bank cash withdrawals, Fox Business/AP
      url: https://www.foxbusiness.com/markets/after-3-years-greece-ends-limits-on-bank-cash-withdrawals
    - title: Capital controls in Greece, Wikipedia
      url: https://en.wikipedia.org/wiki/Capital_controls_in_Greece
    - title: Banks race to ramp up AI defenses as deposits fall after cyberattacks, The
        Korea Times
      url: https://www.koreatimes.co.kr/business/banking-finance/20261011/banks-race-to-ramp-up-ai-defenses-as-deposits-fall-after-cyberattacks
  checklist: false
  steps:
    - do: Ignore any call, text, email or social media post telling you to move or withdraw money.
      detail: No bank, agency or this site will ever tell you to move money to keep it safe. If unsure, hang up and call the number on your card.
    - do: "Now: write down the nearest branch address and opening hours for each of your banks."
    - do: "Now: ask each bank how much cash you can withdraw at a branch in one day."
    - do: "Now: write down your planned emergency cash amount, the same figure as in the cash guide."
      detail: That figure is your cap. If you already hold it, your plan for the day is to do nothing.
    - do: Act only if banks you use, or several in your country, stop payments or withdrawals for over a day.
      detail: Confirm it on the banks' or regulator's own websites, typing the address yourself, and in established news outlets. Stolen records alone don't count.
    - do: If that happens and you hold less than your planned amount, withdraw only the difference.
      detail: Go inside a branch of a bank that is still working, with your ID. Take the cash straight home.
  updated: 2026-11-14

- id: offline-statements
  threat_model: institutional
  title: Keep offline copies of your official monthly statements
  kind: action
  tier: 2
  rank: 14
  time: Monthly
  money: "Free"
  covers: [ institutional ]
  short: >-
    If a bank's records are damaged, its own statements are the best proof of what you
    had.
  advice: >-
    Save each official monthly statement PDF somewhere offline, and print the most
    recent ones for each account.
  why: >-
    If a bank's records are damaged, someone must rebuild who owns what, and a statement
    the bank issued is stronger evidence than your screenshot. The industry's backup is
    less certain. Sheltered Harbor, the standard for daily offline copies of customer
    accounts, covered over 69% of US retail bank deposit accounts and 56% of retail
    brokerage assets in 2018. It plans to wind down and pass its specification to
    industry group FS-ISAC, without saying whether independent certification continues.
  protects_against: A bank losing or damaging its records
  cost: A few minutes a month
  confidence: reasoned
  review_status: unreviewed
  sides:
    for: Thane Ruthenis and hadad both suggest keeping statements; Julian Bradshaw suggests
      hard drives over SSDs for long-term offline storage.
    against: hadad notes a plain printout may need notarizing to carry much weight as proof.
    synthesis: Keep the bank's own PDFs plus printouts. Notarize them only if banks actually
      start losing records.
  sources:
    - title: Sheltered Harbor announces planned wind-down, FS-ISAC
      url: https://www.fsisac.com/who-we-are/sheltered-harbor
    - title: FS-ISAC congressional testimony, 2018
      url: https://www.fsisac.com/hubfs/Resources/FS-ISAC-Testimony_BillNelson-2018-FIN.pdf
    - title: Gimme Shelter (participating institutions make a daily copy of account data),
        ICBA
      url: https://www.icba.org/w/gimme-shelter
  thread_refs:
    - author: Thane Ruthenis
      url: https://www.lesswrong.com/posts/puv8fRDCH9jx5yhbX/johnswentworth-s-shortform/comment/4bAkyL8jgkmpoCFkc
      note: Printed statements refreshed monthly.
    - author: hadad
      url: https://www.lesswrong.com/posts/wJunGnpY3qACWSvnh/on-open-weights-mythos-capabilities
