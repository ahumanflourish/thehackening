# Advice items for thehackening.ai
# Schema and rating definitions: see CONTRIBUTING.md.
# kind: action (goes in a tier) | know (a fact, shown under its threat) | skip (considered and rejected).
# time and money are badge values: keep them to two words at most; the longer story goes in cost.
# rank = position in the list, 1 first: order by protection gained per hour spent.
# tier: 1 = the minimum, 2 = a weekend, 3 = going further. covers = every threat the item helps with.
# short = the one plain line everyone reads; why = the fuller mechanism, shown on demand.
# Every seed item is unreviewed. Paraphrase thread comments; link to them.

# ---------------------------------------------------------------- personal

- id: know-the-authorized-line
  threat_model: personal
  title: US banks must refund theft, not payments you made yourself
  kind: know
  covers: [ personal ]
  short: >-
    If a thief moves your money the bank must repay it, but usually not if a scammer
    tricks you into sending it.
  advice: >-
    Report any payment you didn't make to your bank or credit union promptly: US federal
    rules then require a refund. If a scammer tricks you into pressing send yourself,
    the payment counts as approved and those rules don't apply.
  why: >-
    US Regulation E calls an electronic transfer you didn't make "unauthorized", even if
    you were careless or tricked into giving up your password. Report within 60 days of
    the statement showing it and you owe nothing. With a lost card, report within 2
    business days and you owe at most $50. The bank must investigate within 10 business
    days or credit you meanwhile, and must prove you approved it.
  protects_against: Someone using your stolen login to take your money
  cost: None; this is knowledge, not an action
  confidence: established
  confidence_note: Applies to consumer bank and credit union accounts, not business
    accounts or brokerages.
  review_status: unreviewed
  sources:
    - title: Regulation E training, Michigan Credit Union League
      url: https://www.mcun.coop/wp-content/uploads/2025/07/Regulation-E_Session_2.pdf
    - title: Error Resolution Under Regulation E, Consumer Compliance Outlook
      url: https://www.consumercomplianceoutlook.org/articles/2025/third-issue-2025/error-resolution-under-regulation-e-examiner-insights-and-common-violations
    - title: What Is Regulation E?, Chargeback.io
      url: https://www.chargeback.io/es/blog/regulation-e-glossary
  thread_refs:
    - author: RHollerith
      url: https://www.lesswrong.com/posts/puv8fRDCH9jx5yhbX/johnswentworth-s-shortform/comment/BPqcsafhHTjKgkDGz
      note: Worried a ~$400 unauthorized withdrawal would need small-claims court to recover;
        Reg E means the bank owes the refund.
  checklist: true
  checklist_text: If money leaves your account that you didn't send, tell your bank the
    same day, and never send money to someone who contacted you first.
  updated: 2026-11-13

- id: dont-delegate-money-access
  threat_model: personal
  title: Keep AI tools and apps out of your money accounts
  kind: action
  tier: 2
  rank: 8
  time: 30 min
  money: "Free"
  covers: [ personal, crypto ]
  short: >-
    If something you gave access to moves your money, you usually can't get it refunded.
  advice: >-
    Keep AI assistants, budgeting apps and other connected tools out of any account that
    can send or transfer money. View-only access is safer, but check what each
    connection can actually do.
  why: >-
    A loss caused by someone you gave access to generally counts as authorized, so
    refund promises don't cover it. The broker Fidelity's Customer Protection Guarantee
    says this explicitly, and Regulation E, the US bank refund rule, has a similar
    exception. Major US banks have also found outside AI agents they hadn't approved
    inside customer accounts, some doing more than users asked, and are restricting
    their access.
  protects_against: Losing your right to a refund; AI tools misbehaving or being taken over
  cost: Some convenience
  confidence: reasoned
  confidence_note: The broker's terms are clear; whether the bank rule's exception covers
    AI agents hasn't been tested.
  review_status: unreviewed
  sources:
    - title: Fidelity Customer Protection Guarantee
      url: https://www.fidelity.com/security/customer-protection-guarantee
    - title: US banks have detected unvetted AI agents accessing customer bank accounts,
        TechRadar
      url: https://www.techradar.com/pro/security/us-banks-have-detected-unvetted-ai-agents-accessing-customer-bank-accounts
  thread_refs:
    - author: Alexander (maintainer)
      url: https://www.lesswrong.com/posts/puv8fRDCH9jx5yhbX/johnswentworth-s-shortform/comment/LtpgcFZKY7yusQedF
  checklist: true
  checklist_text: Don't connect AI assistants or budgeting apps to accounts that can move money.
  steps:
    - do: "List every account that can send or transfer money: bank, credit union, brokerage and payment apps."
    - do: Sign in to each one by typing its address or opening its own app, not by following a link.
    - do: Find the list of connected apps and remove any AI assistant, budgeting app or tool you don't need.
      detail: "Look in Settings or Security for \"Connected apps\", \"Linked apps\" or \"Third-party access\". If you can't find it, call the number on your card and ask."
    - do: For each connection you keep, check that it can only view the account, not move money.
      detail: The connection's entry usually lists what it is allowed to do. If you can't confirm it is view-only, remove it.
    - do: In each AI assistant you use, open its settings and disconnect any bank, brokerage or payment account.
    - do: Change the password on any money account whose password you ever typed into another app or tool.
      detail: Type the new password only into the institution's own site or app.
  updated: 2026-11-13

- id: be-a-normal-case
  threat_model: personal
  title: Banks refund ordinary fraud faster than unusual cases
  kind: know
  covers: [ personal, institutional ]
  short: >-
    Banks refund common kinds of fraud by routine; unusual setups get slow, case-by-case
    review.
  advice: >-
    Keep your money in standard accounts at standard banks and pay through standard
    channels. Then if something goes wrong, it looks like the cases your bank handles
    every day.
  why: >-
    Unusual cases, such as malware picked up while coding with AI or an AI agent you set
    up yourself, are harder to explain and more likely to be treated as approved by you.
    The broker Fidelity pays only if it decides a loss happened "through no fault of
    your own." Losses that hit many customers of a big institution at once get shared
    out; unusual setups don't. Customers of finance apps built on the intermediary
    Synapse had money frozen for about six months, and some recovered pennies on the
    dollar.
  protects_against: Slow or refused refunds
  confidence: reasoned
  review_status: unreviewed
  sources:
    - title: Fidelity Customer Protection Guarantee
      url: https://www.fidelity.com/security/customer-protection-guarantee
    - title: Thousands of Americans see their savings vanish in Synapse fintech crisis, NBC
        News
      url: https://www.nbcnews.com/business/consumer/-no-money-thousands-americans-see-savings-vanish-synapse-fintech-crisi-rcna181419
  thread_refs:
    - author: Alexander (maintainer)
      url: https://www.lesswrong.com/posts/puv8fRDCH9jx5yhbX/johnswentworth-s-shortform/comment/LtpgcFZKY7yusQedF
  checklist: false
  updated: 2026-11-13

- id: uneven-hygiene
  threat_model: personal
  title: Check what you've installed and connected, not just your passwords
  kind: action
  tier: 3
  rank: 15
  time: 1 hour
  money: "Free"
  covers: [ personal, crypto ]
  short: >-
    Strong passwords don't help if a browser add-on or AI tool you installed can act as
    you once you're logged in.
  advice: >-
    Go through every AI tool connected to your email or money accounts, and every
    browser extension, app and code package you installed without checking it. Review
    these as carefully as your passwords.
  why: >-
    Attackers use the weakest way in. Once you log in, your browser keeps you logged in
    so you aren't asked again. A malicious extension or code package can steal that
    logged-in state, which skips your password and any extra login code entirely. Many
    technical people have strong passwords and extra login codes but also connect AI
    agents to email and financial accounts and install unchecked tools.
  protects_against: Malicious add-ons and tools acting as you; AI agents being taken over
  cost: An hour of auditing
  confidence: speculative
  confidence_note: This is a guess about where technical people's gaps are; nobody has measured it.
  review_status: unreviewed
  thread_refs:
    - author: Alexander (maintainer)
      url: https://www.lesswrong.com/posts/puv8fRDCH9jx5yhbX/johnswentworth-s-shortform/comment/LtpgcFZKY7yusQedF
  checklist: false
  steps:
    - do: Open your email account's list of connected apps and remove any you don't recognise or no longer use.
      detail: For Gmail, the link below shows how. Other email providers list connected apps under their Security or Privacy settings.
      url: https://support.google.com/accounts/answer/13533235
      link: "Google: manage connected apps"
    - do: Check each money account for connected apps and tools in the same way.
      detail: "Look in Settings or Security for \"Connected apps\" or \"Third-party access\"."
    - do: Open each AI tool you use, see which accounts it is connected to, and disconnect any it doesn't need.
    - do: Open your browser's list of extensions (small add-on programs) and remove any you don't use or can't identify.
      detail: "In Chrome: the three-dot menu, then Extensions. In Safari: Settings, then Extensions. Other browsers have a similar menu."
      url: https://support.google.com/chrome_webstore/answer/2664769
      link: "Chrome: manage extensions"
    - do: Go through the apps on your phone and computer and delete those you don't use or don't remember installing.
    - do: If you write code, list the packages and tools you installed without checking and uninstall those you no longer need.
      detail: A code package is ready-made code downloaded from the internet. If you don't write code, skip this step.
    - do: For anything you removed that looked suspicious, change that account's password and sign out of all devices.
      detail: "Most accounts have a \"Sign out everywhere\" or \"Log out of all devices\" button under Security."
  updated: 2026-11-13

- id: strong-login-and-number-lock
  threat_model: personal
  title: Replace text-message login codes and lock your phone number
  kind: action
  tier: 1
  rank: 1
  time: 1 hour
  money: "$0–50"
  covers: [ personal ]
  short: >-
    Text-message codes can be stolen by taking over your phone number, and your email
    can reset every other account.
  advice: >-
    On your email and money accounts, replace text-message codes with a passkey, a
    hardware security key or an authenticator app. Ask your phone carrier for a number
    lock, also called a port-out PIN.
  why: >-
    In a SIM swap, an attacker gets your number moved to their own phone and receives
    your text codes. A number lock makes the carrier ask for a PIN before moving your
    number. Passkeys, security keys and authenticator apps don't depend on your phone
    number, so taking over the number doesn't help. Some banks don't offer authenticator
    apps but do accept USB security keys.
  protects_against: Someone taking over your phone number or tricking you out of a login code
  cost: About an hour; ~$50 per hardware key
  confidence: established
  review_status: unreviewed
  sources:
    - title: The Hackening (Peter Wildeford's list), Zvi
      url: https://www.lesswrong.com/posts/iqgZaJMnmyDCYfnuC/the-hackening-1
  thread_refs:
    - author: Terence Coelho
      url: https://www.lesswrong.com/posts/puv8fRDCH9jx5yhbX/johnswentworth-s-shortform/comment/EMkqX2trSffWznaXv
      note: Banks often don't allow authenticator apps but do accept YubiKeys.
  checklist: true
  checklist_text: Put a passkey or security key on your email and bank logins, and ask
    your carrier for a number lock.
  steps:
    - do: "Add a passkey to your email account: a login that uses your phone or fingerprint instead of a code."
      detail: For Gmail, follow the link below. Reach your account by typing its address yourself, not from a link in a message.
      url: https://support.google.com/accounts/answer/13548313
      link: "Google: sign in with a passkey"
    - do: If your email is Outlook or Hotmail, add the passkey in your Microsoft account instead.
      detail: "Sign in, open the security options, choose \"Add a new way to sign in or verify\", then \"Face, Fingerprint, PIN, or Security Key\"."
      url: https://support.microsoft.com/en-us/accounts-billing/security/create-save-passkey
      link: "Microsoft: create a passkey"
    - do: Do the same on each bank and money account, then switch off text-message codes where the account allows.
      detail: If there is no passkey option, choose a security key (a small USB device, about $50) or an authenticator app (a phone app that shows login codes). Save any backup codes on paper.
    - do: In the US, if your carrier is Verizon, turn on Number Lock in the My Verizon app.
      detail: Open the app, find Number Lock, and switch it on for each phone number. It is free.
      url: https://www.verizon.com/support/knowledge-base-309293/
      link: "Verizon: turn on Number Lock"
    - do: If your carrier is AT&T, turn on Wireless Account Lock in the AT&T app.
      detail: "Open the app, tap the person icon, choose \"Wireless account lock\" and swipe to lock. It is free."
      url: https://www.att.com/support/article/wireless/000102016/
      link: "AT&T: Wireless Account Lock"
    - do: If your carrier is T-Mobile, turn on SIM Protection and Port Out Protection.
      detail: "In the T-Life app: Manage, the gear icon, Security, then SIM Protection. The help page below covers both features. Both are free."
      url: https://www.t-mobile.com/support/plans-features/help-with-t-mobile-account-fraud
      link: "T-Mobile: protect your account"
    - do: On any other carrier, call the number on your bill and ask for a number lock or port-out PIN.
      detail: "Say: \"Please lock my number so it can't be moved without my PIN.\" Never give that PIN to anyone who calls or messages you."
  updated: 2026-11-13

- id: freeze-everything
  threat_model: personal
  title: Freeze your credit and get an IRS Identity Protection PIN
  kind: action
  tier: 1
  rank: 2
  time: 1 hour
  money: "Free"
  covers: [ personal ]
  short: >-
    Your details have probably leaked; a freeze stops them being used to open accounts
    in your name.
  advice: >-
    Freeze your credit at Equifax, Experian and TransUnion, plus Innovis and ChexSystems
    (which blocks new bank accounts opened in your name). Get an IRS Identity Protection
    PIN and create your my Social Security account before someone else does.
  why: >-
    Assume your personal details have already leaked: the US saw a record 3,322 data
    compromises in 2025. Most lenders check your credit file before opening an account.
    A freeze blocks that check, so a thief holding your details is usually turned down.
    The IRS PIN is a number needed to file a tax return in your name, which makes it
    much harder for a thief to file first.
  protects_against: Someone opening accounts or filing taxes in your name
  cost: About an hour; free
  confidence: established
  review_status: unreviewed
  sources:
    - title: The Hackening (Peter Wildeford's list), Zvi
      url: https://www.lesswrong.com/posts/iqgZaJMnmyDCYfnuC/the-hackening-1
    - title: Identity Theft Statistics for 2026, Swif
      url: https://www.swif.ai/blog/identity-theft-statistics
  checklist: true
  checklist_text: Freeze your credit at Equifax, Experian, TransUnion, Innovis and
    ChexSystems, and get an IRS Identity Protection PIN.
  steps:
    - do: In the US, create your my Social Security account, typing the address yourself rather than following a link.
      detail: "Do this first: signing up includes an identity check, and a credit freeze can sometimes get in its way. You'll need an email address and photo ID."
      url: https://www.ssa.gov/myaccount/
      link: my Social Security
    - do: Get an IRS Identity Protection PIN through your IRS online account.
      detail: It is a six-digit number that changes every year. The online tool closes from mid-November to mid-January; if it is closed, set a reminder to return.
      url: https://www.irs.gov/identity-theft-fraud-scams/get-an-identity-protection-pin
      link: "IRS: get an IP PIN"
    - do: Freeze your credit at Equifax.
      detail: You create a free account and confirm your identity. The freeze is free, and you can lift it when you apply for credit yourself. Write each login down on paper.
      url: https://www.equifax.com/personal/credit-report-services/credit-freeze/
      link: Equifax freeze page
    - do: Freeze your credit at Experian.
      url: https://www.experian.com/help/credit-freeze/
      link: Experian freeze page
    - do: Freeze your credit at TransUnion.
      url: https://www.transunion.com/credit-freeze
      link: TransUnion freeze page
    - do: Freeze your credit file at Innovis, a smaller credit bureau.
      detail: Use the online request form on this page, or call 1-866-712-4546.
      url: https://www.innovis.com/personal/securityFreeze
      link: Innovis freeze page
    - do: Place a freeze at ChexSystems, which blocks new bank accounts opened in your name.
      detail: You'll receive a PIN by mail or in your online account. Keep it with your important papers; you need it to lift the freeze.
      url: https://www.chexsystems.com/security-freeze/place-freeze
      link: ChexSystems freeze page
  updated: 2026-11-13

- id: alerts-and-fast-reporting
  threat_model: personal
  title: Turn on alerts and report anything odd immediately
  kind: action
  tier: 1
  rank: 4
  time: 10 min
  money: "Free"
  covers: [ personal, institutional ]
  short: >-
    Your right to a refund depends on reporting quickly, and you can't report what you
    haven't noticed.
  advice: >-
    Turn on alerts for logins, transfers and profile changes on every financial account,
    and report anything unexpected the same day.
  why: >-
    Refund rules reward speed. In the US, protection under Regulation E, the rule
    covering bank-account transfers, depends on reporting within 60 days of the
    statement. The brokerage Fidelity's guarantee likewise doesn't apply if you don't
    report unauthorized activity promptly. Alerts tell you the day something happens,
    instead of weeks later on a statement.
  protects_against: Losing refund rights by noticing too late
  cost: Ten minutes
  confidence: established
  review_status: unreviewed
  sources:
    - title: Fidelity Customer Protection Guarantee
      url: https://www.fidelity.com/security/customer-protection-guarantee
    - title: Error Resolution Under Regulation E, Consumer Compliance Outlook
      url: https://www.consumercomplianceoutlook.org/articles/2025/third-issue-2025/error-resolution-under-regulation-e-examiner-insights-and-common-violations
  checklist: true
  checklist_text: Turn on login, transfer and profile-change alerts on every money account.
  steps:
    - do: Sign in to each financial account by typing its address or opening its own app.
    - do: Open the alerts or notifications settings.
      detail: Usually under Settings, Profile or Security. If you can't find them, call the number on the back of your card and ask.
    - do: Turn on alerts for logins, for transfers and withdrawals, and for changes to your profile.
      detail: Profile changes means a new password, phone number, email or address. Set money alerts to the lowest amount offered.
    - do: Choose how alerts reach you (app notification, email or text) and pick one you look at every day.
    - do: Save each institution's fraud phone number, from the back of your card or a statement, in your contacts.
    - do: If an alert shows something you didn't do, call that saved number the same day and report it.
      detail: Don't use a phone number or link inside the alert itself. Note the date, the time and the name of the person you spoke to.
  updated: 2026-11-13

- id: spend-on-credit-cards
  threat_model: personal
  title: Spend on credit cards rather than debit cards
  kind: action
  tier: 1
  rank: 5
  time: No time
  money: "Free"
  covers: [ personal ]
  short: >-
    A fraudulent credit card charge spends the bank's money while it's disputed; a debit
    charge empties your account.
  advice: Use credit cards for day-to-day spending and pay them off from a bank account.
  why: >-
    US federal law caps your liability for unauthorized credit card charges at $50, and
    issuers usually waive even that. A fraudulent charge spends the bank's money while
    it's disputed, not yours; a fraudulent debit charge empties your account until it's
    resolved.
  protects_against: Card fraud draining your cash
  cost: None if you pay in full
  confidence: established
  review_status: unreviewed
  sources:
    - title: Regulation Z, 12 CFR 1026.12(b), liability of cardholder for unauthorized use,
        CFPB
      url: https://www.consumerfinance.gov/rules-policy/regulations/1026/12/
    - title: 15 U.S.C. 1643, liability of holder of credit card, Cornell Legal Information
        Institute
      url: https://www.law.cornell.edu/uscode/text/15/1643
    - title: How do I get my money back after an unauthorized transaction from my bank
        account?, CFPB
      url: https://www.consumerfinance.gov/ask-cfpb/how-do-i-get-my-money-back-after-i-discovered-an-unauthorized-transaction-or-money-missing-from-my-bank-account-en-1017/
  checklist: false
  steps:
    - do: Pick a credit card you already have to use for everyday spending.
      detail: If you don't have one, ask your own bank or credit union what it offers.
    - do: Set the card to pay its full balance automatically each month from your bank account.
      detail: "In the card's site or app, look for AutoPay and choose \"statement balance\" or \"pay in full\"."
    - do: Swap your debit card for the credit card in shops, online stores, subscriptions and your phone's wallet.
    - do: Keep your debit card for withdrawing cash only.
    - do: Look over the card's charges each week and report any you don't recognise by calling the number on the card.
  updated: 2026-11-13

- id: shrink-patch-lag
  threat_model: personal
  title: Turn on automatic updates and retire devices that can't update
  kind: action
  tier: 1
  rank: 3
  time: 10 min
  money: "Free"
  covers: [ personal ]
  short: >-
    Updates reveal the flaws they fix, and attackers now strike within days at devices
    that haven't updated.
  advice: >-
    Turn on automatic updates, restart regularly so they install, and replace or unplug
    old routers, phones and cameras that no longer receive updates.
  why: >-
    An update fixes a flaw, but publishing it also shows attackers where the flaw was.
    Most attacks on flaws now start that way, within days. The security firm CrowdStrike
    found that for flaws with public demonstration code, 88% of attacks came within 48
    hours of release. Devices that no longer get updates keep every flaw for good.
  protects_against: Attacks on flaws an update would have fixed
  cost: Minimal; occasional device replacement
  confidence: established
  review_status: unreviewed
  sources:
    - title: AI Vulnerability Management 2026 Guide, NeuralTrust
      url: https://neuraltrust.ai/blog/ai-vulnerability-management
    - title: The Hackening, Zvi
      url: https://www.lesswrong.com/posts/iqgZaJMnmyDCYfnuC/the-hackening-1
  thread_refs:
    - author: Claude Fable
      url: https://www.lesswrong.com/posts/YA2r4rg6SpBtwRqtq/the-hackening-justified-practical-advice-and-open-questions?commentId=dG5MWY4ee9TSFDm2R
      note: Ranks shrinking patch lag first by expected value.
  checklist: true
  checklist_text: Turn on automatic updates everywhere and replace devices that no longer get them.
  steps:
    - do: On an iPhone or iPad, turn on automatic updates.
      detail: Open Settings, then General, then Software Update, then Automatic Updates, and switch everything on.
      url: https://support.apple.com/en-us/118575
      link: "Apple: update your iPhone or iPad"
    - do: On an Android phone, check for updates and install any that are waiting.
      detail: Open Settings, then System, then Software update. The wording varies by phone maker.
      url: https://support.google.com/android/answer/7680439
      link: "Google: update Android"
    - do: On a Windows computer, open Windows Update and install everything offered.
      detail: Open Start, then Settings, then Windows Update.
      url: https://support.microsoft.com/en-us/windows/deployment/updates-lifecycle/install-windows-updates
      link: "Microsoft: install Windows updates"
    - do: On a Mac, turn on automatic updates.
      detail: Open the Apple menu, then System Settings, then General, then Software Update.
      url: https://support.apple.com/en-us/108382
      link: "Apple: update macOS"
    - do: Restart every phone and computer at least once a week.
      detail: Many updates only finish installing when the device restarts.
    - do: Look up your router, cameras and other connected devices on their makers' websites to see if they still get updates.
      detail: "Search for the model number printed on the device plus \"end of support\". If its app offers automatic updates, turn them on."
    - do: Replace or unplug any device that no longer gets updates.
      detail: If your internet company supplied the router, call and ask for a current model.
  updated: 2026-11-13

# ----------------------------------------------------------- institutional

- id: spending-money-on-separate-rails
  threat_model: institutional
  title: Split your spending money across two or three unrelated banks
  kind: action
  tier: 2
  rank: 9
  time: 2 hours
  money: "Free"
  covers: [ institutional ]
  short: >-
    Many small banks rent the same systems, so one attack can take several offline at
    once.
  advice: >-
    Keep long-term savings in one well-defended place. Split about a month of spending
    money across institutions that don't share systems: for example a large bank, a
    credit union, and a cash account at a brokerage (investment firm).
  why: >-
    Theft and lost access call for opposite setups: fewer accounts against theft, more
    independent accounts against being locked out. Credit unions and small banks mostly
    rent their main software from a few suppliers, so one break-in takes many offline. A
    2023 ransom attack on one supplier caused outages at about 60 credit unions. The US
    credit union regulator's chair said over 60% of incidents reported to it involve
    outside suppliers.
  protects_against: One bank or its supplier going down
  cost: Managing an extra account
  confidence: reasoned
  confidence_note: The shared-supplier outages are documented; the split we recommend is
    our reasoning from them.
  review_status: unreviewed
  sides:
    for: Thane Ruthenis suggests spreading money across very different providers, including
      other countries and crypto.
    against: Foreign accounts and crypto bring transfers that can't be reversed and less
      help getting money back. For a bank outage, that matters more than the extra
      spread.
    synthesis: Spread spending money across banks in your own country that run on different
      systems. Keep savings in one well-defended place.
  sources:
    - title: 60 credit unions facing outages due to ransomware attack, Cybersecurity Dive
      url: https://www.cybersecuritydive.com/news/credit-unions-outages-ransomware/701442/
    - title: Credit Union & Community Bank Cyber Incident Report 2026, BlueRadius
      url: https://blueradius.io/credit-union-cyber-incident-report-2026
  thread_refs:
    - author: Thane Ruthenis
      url: https://www.lesswrong.com/posts/puv8fRDCH9jx5yhbX/johnswentworth-s-shortform/comment/4bAkyL8jgkmpoCFkc
      note: Diversify across providers with different vulnerability profiles.
    - author: Eoin Cassidy
