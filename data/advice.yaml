- id: insurance-covers-failure-not-hacks
  threat_model: institutional
  title: Deposit insurance covers a failed bank, not a drained account
  kind: know
  covers: [ institutional ]
  short: >-
    If a thief empties your account, deposit insurance pays nothing; separate refund
    rules decide whether you get the money back.
  advice: >-
    Don't choose a bank or broker for its deposit insurance as protection against
    hacking. Against hacking, what protects you is the refund rules and your broker's
    guarantee.
  why: >-
    US deposit insurance (FDIC for banks, NCUA for credit unions) pays only when the
    institution fails. It is backed by the full faith and credit of the US government,
    and both agencies say nobody has ever lost insured deposits. SIPC covers a failed
    broker, and hacking losses only if the hack forces the firm to close. The FDIC fund
    held about $161 billion in mid-2026 and SIPC's about $5 billion. Our reasoning: if
    many institutions failed together, the government, not those funds, would be the
    backstop.
  protects_against: Counting on insurance that will not pay
  cost: None
  confidence: established
  confidence_note: The coverage rules, the government backing and the fund sizes are
    documented. What would happen if many institutions failed at once is our reasoning.
    In the US the limit is $250,000 per depositor, per insured bank, for each ownership
    category.
  review_status: unreviewed
  sources:
    - title: Understanding Deposit Insurance, FDIC
      url: https://www.fdic.gov/resources/deposit-insurance/understanding-deposit-insurance
    - title: Share Insurance Coverage, NCUA
