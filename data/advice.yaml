- id: gold-is-the-wrong-hedge
  threat_model: crypto
  title: Gold won't help much in a hack or outage
  kind: skip
  covers: [ crypto, institutional ]
  short: >-
    Gold only helps if the dollar itself fails, and you can't buy groceries with it
    during an outage.
  advice: >-
    Don't buy gold as protection against hacks or outages. It only helps if the dollar
    system itself fails.
  why: >-
    You can't buy groceries with a gold coin during an outage. Dealers sell gold for
    well above what they pay to buy it back, so you lose money on each trade. Insurance
    on things kept at home typically covers only about $200 of cash, and the same limit
    applies to gold. A gold fund is not physical gold: it is another digital record at
    an institution.
  protects_against: Money spent on the wrong protection
  confidence: reasoned
  review_status: unreviewed
  sides:
    for: hadad suggests keeping some share of savings in something physical could make
      sense.
    against: Gold doesn't help with the failures most likely in the next two years.
    synthesis: Reconsider only if financial records stay corrupted for weeks or withdrawal
      limits appear in the US.
  sources:
