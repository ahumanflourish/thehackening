- id: avoid-self-custody-savings
  threat_model: crypto
  title: Don't keep real savings in crypto
  kind: action
  tier: 2
  rank: 16
  time: Varies
  money: "Possible tax"
  covers: [ crypto ]
  short: >-
    A crypto transfer is final: nobody can cancel it, and no rule requires anyone to
    refund you.
  advice: >-
    If you hold crypto, keep it to an amount you could lose entirely, whether you hold
    it yourself or on an exchange. Don't count on it as protection against a wave of
    hacking.
  why: >-
    A crypto transfer is final: nobody can cancel it, and no rule requires anyone to
    refund you. In 2026, tampered supplier code on Polymarket's website drained an
    estimated $3 million from at least 11 users' wallets; Polymarket said it would repay
    them, but nothing required it to. Exchanges are not a safe alternative: in October
    2026 about $6.3 billion was stolen from the exchange Binance. One commenter argues
    crypto-theft insurers would fail if many people claimed at once.
  protects_against: Theft that can't be undone
  cost: Possible tax or a locked-in loss if you sell; forgoing crypto as a diversifier
  confidence: reasoned
  review_status: unreviewed
  sides:
    for: Thane Ruthenis lists crypto as one way to spread money across separate systems.
    against: Kabir Kumar thinks crypto is probably not safe. hadad says crypto you hold
      yourself is broken into regularly, with no recourse. gilch doubts crypto is safe
      after the Binance theft.
    synthesis: Spread your money across institutions that have refund rules instead.
  sources:
    - title: $3 Million Reportedly Stolen in Polymarket Hack, SecurityWeek
      url: https://www.securityweek.com/3-million-reportedly-stolen-in-polymarket-hack/
    - title: Polymarket hit by cyberattack, user funds stolen, TechRadar
      url: https://www.techradar.com/pro/security/prediction-market-giant-polymarket-hit-by-cyberattack-with-company-confirming-user-funds-stolen-here-is-what-we-know
    - title: FBI links $6.3 billion Binance crypto heist to North Korean hackers,
        BleepingComputer
      url: https://www.bleepingcomputer.com/news/security/fbi-links-63-billion-binance-crypto-heist-to-north-korean-hackers/
    - title: On Open-Weights Mythos Capabilities, hadad
      url: https://www.lesswrong.com/posts/wJunGnpY3qACWSvnh/on-open-weights-mythos-capabilities
  thread_refs:
    - author: Thane Ruthenis
      url: https://www.lesswrong.com/posts/puv8fRDCH9jx5yhbX/johnswentworth-s-shortform/comment/4bAkyL8jgkmpoCFkc
    - author: Kabir Kumar
      url: https://www.lesswrong.com/posts/puv8fRDCH9jx5yhbX/johnswentworth-s-shortform/comment/8sHq6Zp9yYZWEeeAc
    - author: gilch
      url: https://www.lesswrong.com/posts/puv8fRDCH9jx5yhbX/johnswentworth-s-shortform/comment/stH7hqL88qd7uXeq7
  checklist: false
  steps:
    - do: Add up the value of all the crypto you hold, in your own wallets and on exchanges.
      detail: A wallet you control yourself and an account at an exchange both count.
    - do: Decide the amount you could lose entirely without it hurting.
    - do: If you hold more than that, consider reducing it. Selling is your decision.
      detail: Selling can be taxed and can lock in a loss. If you do sell, start it yourself in the wallet or exchange you already use, never through a link or a caller.
    - do: Plan your emergency money without counting any crypto.
    - do: "Never type your wallet's recovery phrase into a website or give it to anyone, including \"support\" staff."
      detail: The recovery phrase is the list of words that restores your wallet. Anyone who has it can take everything.
  updated: 2026-11-14

- id: slow-money-is-safer
  threat_model: crypto
  title: Keep most of your money where it moves slowly
  kind: action
  tier: 1
  rank: 8
  time: 15 min
  money: "Free"
  covers: [ crypto, personal ]
  short: >-
    Money that takes days to move can often be stopped before a thief gets away with it.
  advice: >-
    If your savings already sit in an ordinary savings account and you don't keep money
    in payment apps, you are done. Otherwise keep balances in payment apps small, and
    ask your bank to lower Zelle and wire limits.
  why: >-
    Thieves go for money that moves instantly. A transfer that takes days gives your
    alerts and the bank's fraud team time to stop it, though not always. Zelle and wires
    draw on your whole bank account, so lower limits, not small balances, protect you
    there. In the US, if a thief sends money from your payment app or account, report it
    at once: federal rules can still require a refund. If you were tricked into sending
    it yourself, nobody is required to refund you.
  protects_against: Theft that is too fast to stop
  cost: Slower access to the bulk of your money
  confidence: reasoned
  review_status: unreviewed
  sources:
    - title: Electronic Fund Transfers FAQs (person-to-person payments), CFPB
      url: https://www.consumerfinance.gov/compliance/compliance-resources/deposit-accounts-resources/electronic-fund-transfers/electronic-fund-transfers-faqs/
    - title: Regulation E, 12 CFR 1005.3, coverage (wire transfers excluded), CFPB
      url: https://www.consumerfinance.gov/rules-policy/regulations/1005/3/
  checklist: true
  checklist_text: Keep balances in instant-payment apps small, and ask your bank to lower
    Zelle and wire limits.
  steps:
    - do: Open each payment app you use, such as Venmo or Cash App, and check the balance sitting in it.
    - do: Transfer all but a small amount from each app to your bank account.
    - do: Turn off any setting that pays your wages into the app or tops it up automatically.
    - do: Ask your bank to lower your daily Zelle and wire limits, or switch off ones you never use.
      detail: Call the number on your card. Zelle and wires draw on your whole bank balance, so a small app balance doesn't limit them. Not every bank will change limits.
    - do: Keep most of your money in an ordinary savings account, where moving it out takes days.
      detail: Don't connect that account to Zelle or to a payment app.
    - do: If money leaves an app or account without you, report it to that company and your bank at once.
      detail: In the US, federal rules can require a refund of electronic transfers a thief made. They don't cover wires, crypto, or payments you were tricked into sending.
  updated: 2026-11-14

- id: gold-is-the-wrong-hedge
  threat_model: crypto
  title: Gold won't help much in a hack or outage
  kind: skip
  covers: [ crypto, institutional ]
  short: >-
    Gold only helps if the dollar itself fails, and you can't buy groceries with it
    during an outage.
  advice: >-
    Don't buy gold as protection against hacks or outages. It only helps if the dollar
    system itself fails.
  why: >-
    You can't buy groceries with a gold coin during an outage. Dealers sell gold for
    well above what they pay to buy it back, so you lose money on each trade. Insurance
    on things kept at home typically covers only about $200 of cash, and the same limit
    applies to gold. A gold fund is not physical gold: it is another digital record at
    an institution.
  protects_against: Money spent on the wrong protection
  confidence: reasoned
  review_status: unreviewed
  sides:
    for: hadad suggests keeping some share of savings in something physical could make
      sense.
    against: Gold doesn't help with the failures most likely in the next two years.
    synthesis: Reconsider only if financial records stay corrupted for weeks or withdrawal
      limits appear in the US.
  sources:
    - title: Does renters insurance cover stolen cash?, Policygenius
      url: https://www.policygenius.com/renters-insurance/does-renters-insurance-cover-stolen-cash/
  checklist: false
  updated: 2026-11-13

