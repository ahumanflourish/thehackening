    - author: Elizabeth
      url: https://www.lesswrong.com/posts/YA2r4rg6SpBtwRqtq/the-hackening-justified-practical-advice-and-open-questions?commentId=QCB2oBMeHhCJegRbv
      note: Daily medications and a first-aid kit; discusses further medical options.
    - author: Jenna_Parr
      url: https://www.lesswrong.com/posts/YA2r4rg6SpBtwRqtq/the-hackening-justified-practical-advice-and-open-questions?commentId=zFkuBT3jGmnvjQWdg
      note: Water and sewer systems are vulnerable and fragmented.
    - author: Grendel1209
      url: https://www.lesswrong.com/posts/puv8fRDCH9jx5yhbX/johnswentworth-s-shortform/comment/NGfGhPs7zD9EbLygc
      note: Keep emergency supplies that last several weeks, and a basic first-aid kit.
  checklist: true
  checklist_text: Keep about two weeks of water, food and daily medications, plus a first-aid kit.
  steps:
    - do: Count the people in your home.
    - do: "Store one gallon of water per person per day: 14 gallons each for two weeks."
      detail: Sealed store-bought bottles or jugs are simplest. Keep them somewhere cool and dark.
      url: https://www.redcross.org/get-help/how-to-prepare-for-emergencies/survival-kit-supplies.html
      link: Red Cross supply list
    - do: Buy two weeks of food that keeps without a fridge and needs little cooking.
      detail: Canned beans, fish and vegetables, rice, pasta, peanut butter, cereal bars. Choose things you already eat, and add a hand-operated can opener.
    - do: Ask your doctor or pharmacist how to keep two extra weeks of your daily medications.
      detail: "Ask: \"Can I get an early refill or a longer supply, so I have a reserve?\""
    - do: Buy a first-aid kit and keep it with the supplies.
