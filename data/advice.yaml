- id: cash-sized-to-outages
  threat_model: institutional
  title: Keep about two to three weeks of essentials in cash
  kind: action
  tier: 1
  rank: 7
  time: 30 min
  money: "No interest"
  covers: [ institutional, infrastructure ]
  short: >-
    Past bank outages from attacks lasted about two weeks, and food, fuel and medicine
    can't wait that long.
  advice: >-
    Keep enough cash at home for two to three weeks of things that can't wait: food,
    gas, medicine. Use mostly $20 bills and smaller, stored somewhere fire-resistant and
    out of sight.
  why: >-
    Ransom attacks took Patelco Credit Union and CDK Global offline for about two weeks
    each in 2024. If many banks are hit at once, repairs queue up; three to six weeks is
    a guess, not a precedent. In mass outages bills are usually deferred quickly; food,
    gas and medicine can't wait. Renters and homeowners insurance typically pays only
    about $200 for stolen cash, so holding much more adds uninsured risk.
  protects_against: Payment systems or your banks being down
  cost: Uninsured cash earning nothing
  confidence: established
  confidence_note: Two-week outages have happened; how long an outage across many banks
    would last is a guess.
  review_status: unreviewed
  sides:
    for: RHollerith keeps about four weeks of expenses in cash; hadad calls physical cash
      "semi-reasonable" as a hedge.
    against: Kabir Kumar suggests only a few days of water; larger cash amounts are
      uninsured against theft and fire.
    synthesis: Hold enough cash for essentials through a two-week outage plus a margin, not
      enough to cover all your expenses.
  sources:
    - title: Patelco restores most banking services weeks after ransomware attack, KQED
      url: https://www.kqed.org/news/11994012/patelco-restores-most-banking-services-weeks-after-massive-ransomware-attack
    - title: CDK says substantially all car dealerships restored after hack, Bloomberg
