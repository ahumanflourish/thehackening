- id: move-deadline-money-early
  threat_model: institutional
  title: Get deadline money ready a week or two early
  kind: action
  tier: 3
  rank: 19
  time: 30 min
  money: "Free"
  covers: [ institutional, personal ]
  short: >-
    Fraud checks and outages can hold up large honest payments, so money moved at the
    last minute may arrive late.
  advice: >-
    For any large payment with a deadline (a house purchase, tuition), have the money
    in the account you will pay from a week or two early. Send it only when the
    recipient, confirmed by phone, says to.
  why: >-
    Banks hold large transfers to check for fraud, and new restrictions slow honest
    payments too. Having the money in your own paying account early leaves time for a
    hold to clear. Don't send it early: house purchases run through small title and
    escrow companies, the kind of poorly defended business attackers target, and
    diverting the buyer's payment to a thief's account is an established scam.
  protects_against: Missed deadlines from holds or outages; payments diverted to a thief
  cost: None
  confidence: reasoned
  review_status: unreviewed
  sources:
    - title: "Mortgage closing scams: how to protect yourself and your closing funds, CFPB"
      url: https://www.consumerfinance.gov/about-us/blog/mortgage-closing-scams-how-protect-yourself-and-your-closing-funds/
  checklist: false
  steps:
    - do: Write down each large payment you have coming up that has a deadline, with its due date.
      detail: For example a house purchase, tuition, or a large event payment.
    - do: Ask the recipient for the payment instructions at least two weeks before the due date.
    - do: Confirm the account details by phoning the recipient on a number you looked up yourself.
      detail: Don't use a phone number from the email or message that contained the instructions. Treat any last-minute change of bank details as a scam until confirmed this way.
    - do: Ask your bank how long a transfer of that size takes and whether it could be limited or held.
      detail: "Ask: \"Is there a daily limit, and could this payment be held for review?\""
    - do: Have the money in the account you will pay from one to two weeks before it is due.
    - do: Send it when the recipient, confirmed by phone on that number, says to.
      detail: Allow for the transfer time your bank quoted, so the payment still arrives before the deadline.
    - do: Check with the recipient that the money arrived.
  updated: 2026-11-14

- id: big-bank-or-credit-union
  threat_model: institutional
  title: "Big bank or credit union: which is safer is disputed"
  kind: know
  covers: [ institutional ]
  short: >-
    Big banks have stronger defenses but attract more attacks, and people who know the
    field disagree on which matters more.
  advice: "This is not a recommendation to move your money. Which kind is safer is
    disputed, with no clear winner. One middle course is an account at each kind, on our
    reasoning that they may not fail together."
  why: >-
    Large banks can put far more into defense: Bank of America put about 4,000 people on
    fixing flaws found by the newest AI models, and in a 2026 survey 85% of banks said
    they felt prepared for a cyberattack, against 72% of credit unions. But large banks
    are bigger targets. Credit unions mostly share a few outside suppliers, so one
    supplier's failure can hit many at once. That the two kinds may not fail together is
    our reasoning, not a documented fact.
  protects_against: Choosing one institution type for the wrong reason
  confidence: speculative
  review_status: unreviewed
  sides:
    for: Grendel1209, who says they work at a threat-intelligence company, recommends
      switching to a top-5 bank.
    against: hadad judges big and regional banks roughly equally risky, since bigger targets
      have only slightly better security.
    synthesis: "Our view: hold an account at each kind if you can. Where to keep long-term
      savings is a separate, disputed question, covered in the guide to splitting your
      money."
  sources:
