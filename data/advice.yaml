- id: water-food-medications
  threat_model: infrastructure
  title: Store about two weeks of water, food and medications
  kind: action
  tier: 2
  rank: 15
  time: 3 hours
  money: "Few hundred"
  covers: [ infrastructure ]
  short: >-
    If water or deliveries are cut, you can stay home, and the same supplies cover
    storms and earthquakes.
  advice: >-
    Keep about two weeks of water, shelf-stable food, and daily medications, plus a
    first-aid kit.
  why: >-
    Two weeks is the Red Cross figure for water and food when staying at home; its list
    says seven days for medications, so two weeks of those is our own margin. Storms and
    earthquakes justify the supplies even if no attack comes. Water and sewer systems
    are split among many separate operators and look unusually exposed to cyberattacks.
    Whether the three to seven days in most guides is enough here is an open question.
  protects_against: Water, power or deliveries being cut
  cost: Depends on household size; a few hundred dollars and storage space
  confidence: established
  confidence_note: This is standard emergency advice; how many days an attack would call
    for is not known.
  review_status: unreviewed
  sources:
    - title: Survival kit supplies (3-day supply for evacuation, 2-week supply for home),
        American Red Cross
      url: https://www.redcross.org/get-help/how-to-prepare-for-emergencies/survival-kit-supplies.html
    - title: America's sewer systems are surprisingly vulnerable to cyber attacks, FAI
      url: https://www.thefai.org/posts/america-s-sewer-systems-are-surprisingly-vulnerable-to-cyber-attacks
  thread_refs:
    - author: Elizabeth
      url: https://www.lesswrong.com/posts/YA2r4rg6SpBtwRqtq/the-hackening-justified-practical-advice-and-open-questions?commentId=HeNoSTDPZfvFvMZyz
