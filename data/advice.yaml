- id: insurance-covers-failure-not-hacks
  threat_model: institutional
  title: Deposit insurance covers a failed bank, not a drained account
  kind: know
  covers: [ institutional ]
  short: >-
    If a thief empties your account, deposit insurance pays nothing; separate refund
    rules decide whether you get the money back.
  advice: >-
    Don't choose a bank or broker for its deposit insurance as protection against
    hacking. Against hacking, what protects you is the refund rules and your broker's
    guarantee.
  why: >-
    US deposit insurance (FDIC for banks, NCUA for credit unions) pays only when the
    institution fails. SIPC covers a failed broker, and hacking losses only if the hack
    forces the firm to close. The funds are sized for scattered failures, not many at
    once: SIPC's fund targets $5 billion plus a $2.5 billion Treasury credit line, and
    the FDIC fund is estimated at $157.4 billion against roughly $11 trillion in insured
    deposits. If many institutions fail together, the real backstop is political.
  protects_against: Counting on insurance that will not pay
  cost: None
  confidence: established
  confidence_note: The coverage rules and fund sizes are documented; that politicians
    would decide the outcome of a mass failure is our reasoning.
  review_status: unreviewed
  sources:
    - title: SIPC insurance, what it does and doesn't protect, NerdWallet
      url: https://www.nerdwallet.com/investing/learn/sipc-insurance-what-it-does-and-does-not-protect
