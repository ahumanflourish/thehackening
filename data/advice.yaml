  checklist: true
  checklist_text: Save each monthly bank statement offline and print the latest ones.
  steps:
    - do: Sign in to each account by typing its address or opening its own app.
    - do: Download the latest official monthly statement as a PDF.
      detail: "Look under \"Statements\" or \"Documents\". Download the statement itself, not a screenshot or a list of transactions."
    - do: Save the PDF to your backup drive, then unplug it.
      detail: Use the same drive as in the backup guide. Make one folder per account and name each file by month, such as 2026-10.
    - do: Print the most recent statement for each account.
    - do: Keep the printouts somewhere locked at home, apart from your written recovery codes.
