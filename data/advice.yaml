- id: slow-money-is-safer
  threat_model: crypto
  title: Keep most of your money where it moves slowly
  kind: action
  tier: 1
  rank: 6
  time: 15 min
  money: "Free"
  covers: [ crypto, personal ]
  short: >-
    Money that takes days to move can be stopped and returned if someone steals it.
  advice: >-
    Keep the bulk of your money in places where withdrawals take days and can be
    reversed, and keep instant payment balances (Zelle, Venmo, Cash App, wires, crypto)
    small.
  why: >-
    Thieves go for money that moves instantly and can't be pulled back. A transfer that
    takes days gives your alerts and the institution's fraud team time to stop it. Money
    in a payment app may also be held by a middleman company, not a bank. When one such
    company, Synapse, went bankrupt in 2024, customers were locked out for about six
    months.
  protects_against: Theft that is too fast to stop
  cost: Slower access to the bulk of your money
  confidence: reasoned
  review_status: unreviewed
  checklist: true
  checklist_text: Keep balances in instant-payment apps small.
  steps:
    - do: Open each payment app you use, such as Venmo or Cash App, and check the balance sitting in it.
    - do: Transfer all but a small amount from each app to your bank account.
    - do: Turn off any setting that pays your wages into the app or tops it up automatically.
    - do: Keep most of your money in a savings or brokerage account where withdrawals take days.
      detail: Don't connect that account to Zelle or to a payment app.
