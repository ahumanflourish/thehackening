- id: avoid-self-custody-savings
  threat_model: crypto
  title: Don't keep real savings in crypto you hold yourself
  kind: action
  tier: 2
  rank: 14
  time: No time
  money: "Free"
  covers: [ crypto ]
  short: >-
    Crypto transfers can't be reversed and nobody refunds them.
  advice: >-
    If you hold crypto, keep it to an amount you could lose entirely. Don't count on it
    as protection against a wave of hacking.
  why: >-
    A crypto transfer is final: nobody can cancel it or refund you. If
    internet-connected devices can be broken into, you are a weaker defender than the
    security team at a large company that holds crypto for its customers. Insurers that
    cover crypto theft would likely fail if many people claimed at once. In 2026,
    tampered supplier code on Polymarket's website drained about $3 million from users'
    wallets.
