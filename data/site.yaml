# The four threats, in display order.
# tab = short tab label; mark = one-word column heading in the advice overview; reach = how it reaches an ordinary person;
# how = two or three plain sentences on how it would happen.
threat_models:
  - id: personal
    name: Personal attacks
    tab: Your accounts
    mark: Accounts
    reach: Someone gets into your accounts
    summary: Scams, fake messages and stolen logins aimed at you.
    how: >-
      Attackers buy leaked personal details in bulk and use AI to write convincing
      messages, copy voices, and try stolen passwords on every site at once. Nobody
      needs to pick you out: it is cheap enough to try everyone. The usual prize is your
      email, because it can reset every other password.
    incidents: [ south-korea-banks-2026-10 ]
  - id: institutional
    name: Institutional
    tab: Your bank
    mark: Bank
    reach: Your bank goes offline for days
    summary: Your bank, broker or one of their suppliers is hacked or shut down.
    how: >-
      Your money is probably still there, but you may not be able to reach it. An
      attacked bank usually shuts its systems down until it can prove they are clean. In
      the best-known case, a California credit union in 2024, that took about two weeks.
      Many smaller banks rent systems from the same few suppliers, so one attack can take
      several offline.
    incidents: [ patelco-2024, trellance-2023 ]
  - id: crypto
    name: Crypto and irreversible payments
    tab: Instant payments
    mark: Payments
    reach: Money is sent that can't be pulled back
    summary: Crypto, wire transfers and payment apps, where a payment can't be undone.
    how: >-
      Bank transfers that take days can often be stopped. Crypto, wire transfers and
      instant payment apps can't be pulled back once sent. If you were tricked into
      sending the money yourself, nobody is required to refund you. If a thief sent it
      from your US payment app or bank account without you, report it at once: federal
      rules can still require a refund. Crypto has no such rule.
    incidents: [ binance-breach-2026-10, polymarket-vendor-2026-06 ]
  - id: infrastructure
    name: Infrastructure
    tab: Power and internet
    mark: Outages
    reach: Power, internet or supplies are cut
    summary: The internet, utilities or deliveries are disrupted.
    how: >-
      Water systems, power grids and delivery networks run on software too, and much of
      it is old and rarely updated. A serious attack is less likely than the other three
      threats here, but the preparation is the same as for a storm or an earthquake, so
      it is cheap to cover.
    incidents: [ cold-chain-hacks-2026-11 ]

home:
  hero_cta: See the steps
  byline: A volunteer-run guide
  reach_title: What this could mean for you
  why_title: What has happened so far
  examples_more: See the news feed
  # figure = the one number that makes the point; label = what it counts, and what is
  # not confirmed. The first example is shown as the lead.
  examples:
    - incident: cairn-campaign-2026-10
      figure: $50
      label: per company website broken into, in one campaign
      text: >-
        One hacker used AI tools to break into more than 100 company websites,
        including a John Deere website, a security researcher told Reuters in
        October 2026. Deere said it had no sign that sensitive information was
        reached.
    - incident: hugging-face-agents-2026-07
      figure: About 700 AI programs
      label: attacked a real company during a lab test
      text: >-
        In July 2026, AI programs in an internal hacking-skills test at OpenAI, run
        with some safeguards switched off, went outside the test and attacked another
        company, Hugging Face. No person is reported to have told them to.
        Hugging Face and the research group METR have published accounts.
    - incident: arkea-heist-2026-11
      figure: €100 million
      label: stolen from one bank; AI use not known
      text: >-
        Attackers got into a French bank through one of its suppliers in November
        2026. The bank says customers' money was not touched. Nobody has said whether
        AI was used.
    - incident: south-korea-banks-2026-10
      figure: 37 financial firms
      label: leaked personal records in five weeks; AI suspected
      text: >-
        South Korean regulators counted about 473,000 leaked records as of 3 Nov
        2026. Four of the firms are banks. The president said there were signs AI was
        used; that is not confirmed.
  then_now_title: What changed
  chart_about: About this chart
  then_now_head: [ Before, Now ]
  then_now:
    - what: Cost of a break-in
      before: A skilled person's time
      now: About $50 per company website, in one 2026 campaign
    - what: Who gets targeted
      before: Whoever is worth the effort
      now: Cheap enough to try everyone
    - what: Finding a new weakness
      before: Slow, skilled work
      now: Newly published flaws nearly quadrupled, January to October 2026 (most are never used in attacks)
    - what: Time until a known weakness is used
      before: Weeks or months
      now: When a known flaw is attacked, it is often within two days (most flaws never are)
  outlook: >-
    These are early cases, and not all of them are known to involve AI. People
    have started calling this "the Hackening". The tools behind it are getting
    cheaper and easier to get, and many defenses were built for a world where
    breaking in was expensive. Nobody knows how far this goes.
  threats_title: The four threats
  threats_intro: Each one reaches you differently and needs a different defense.
  threat_incidents_label: Related news
  threat_know_label: Good to know
  threat_link: See the steps to take
  advice_title: What to do
