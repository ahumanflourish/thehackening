# The four threats, in display order.
# tab = short tab label; mark = one-word column heading in the advice overview; reach = how it reaches an ordinary person;
# how = two or three plain sentences on how it would happen.
threat_models:
  - id: personal
    name: Personal attacks
    tab: Your accounts
    mark: Accounts
    reach: Someone gets into your accounts
    summary: Scams, fake messages and stolen logins aimed at you.
    how: >-
      Attackers buy leaked personal details in bulk and use AI to write convincing
      messages, copy voices, and try stolen passwords on every site at once. Nobody
      needs to pick you out: it is cheap enough to try everyone. The usual prize is your
      email, because it can reset every other password.
    incidents: [ cairn-campaign-2026-10, banks-detect-ai-agents-2026-10 ]
  - id: institutional
    name: Institutional
    tab: Your bank
    mark: Bank
    reach: Your bank goes offline for days
    summary: Your bank, broker or one of their suppliers is hacked or shut down.
    how: >-
      Your money is probably still there, but you can't reach it. An attacked bank
      usually shuts its systems down until it can prove they are clean. Past cases took
      about two weeks. Many smaller banks rent systems from the same few suppliers, so
      one attack can take several offline.
    incidents: [ arkea-heist-2026-11, south-korea-banks-2026-10, patelco-2024, trellance-2023 ]
  - id: crypto
    name: Crypto and irreversible payments
    tab: Instant payments
    mark: Payments
    reach: Money is sent that can't be pulled back
    summary: Crypto, wire transfers and payment apps, where a payment can't be undone.
    how: >-
      Bank transfers that take days can be stopped and reversed. Crypto, wire transfers
      and instant payment apps can't: once the money moves, it is gone, and nobody is
      required to refund you. That makes them the first thing thieves go for.
    incidents: [ binance-breach-2026-10, polymarket-vendor-2026-06 ]
  - id: infrastructure
    name: Infrastructure
    tab: Power and internet
    mark: Outages
    reach: Power, internet or supplies are cut
    summary: The internet, utilities or deliveries are disrupted.
    how: >-
      Water systems, power grids and delivery networks run on software too, and much of
      it is old and rarely updated. A serious attack is less likely than the other three
      threats here, but the preparation is the same as for a storm or an earthquake, so
      it is cheap to cover.
    incidents: [ cold-chain-hacks-2026-11, faa-ground-stop-2026-11 ]

home:
  hero_cta: Protect yourself now
  reach_title: What this could mean for you
  why_title: This is already happening
  examples_more: See the news feed
  # figure = the one number that makes the point; label = what it counts.
  # The first example is shown as the lead.
  examples:
    - incident: hugging-face-agents-2026-07
      figure: AI hackers
      label: attacked a company with no human directing them
      text: >-
        AI programs being tested at OpenAI broke out of their test and hacked
        another company, Hugging Face. No person planned or directed the attack.
        The programs organized it among themselves.
    - incident: cairn-campaign-2026-10
      figure: $50
      label: per break-in
      text: One person used AI tools to break into more than 100 company websites, including John Deere.
    - incident: arkea-heist-2026-11
      figure: €100 million
      label: taken from one bank
      text: Attackers got into a French bank through one of its suppliers. The bank says customers' money was not touched.
    - incident: south-korea-banks-2026-10
      figure: 16 banks
      label: breached together
      text: About 100,000 customer records were stolen in South Korea. The president said there were signs AI was used.
  then_now_title: What changed
  chart_about: About this chart
  then_now_head: [ Before, Now ]
  then_now:
    - what: Cost of a break-in
      before: Weeks of an expert's time
      now: About $50 of computer time
    - what: Who gets targeted
      before: Whoever is worth the effort
      now: Everyone gets tried
    - what: Finding a new weakness
      before: Slow, skilled work
      now: Reports nearly quadrupled from January to October 2026
    - what: Time until a known weakness is used
      before: Weeks or months
      now: Often within two days
  outlook: >-
    These are early cases. The tools behind them are getting cheaper and
    easier to get, and the defenses most of us rely on were built for a world
    where breaking in was expensive. Nobody knows how far this goes. Preparing
    takes a few hours.
