definitions:
  confidence:
    established:
      label: Established
      meaning: Rests on law, regulation, official terms, or documented past events.
    reasoned:
      label: Reasoned
      meaning: Follows from a clear picture of how things work, but has not been directly
        tested.
    speculative:
      label: Speculative
      meaning: Plausible, with weak or disputed evidence.
  review_status:
    unreviewed:
      label: Nobody yet
      meaning: No professional with relevant experience has checked this item yet.
    expert_reviewed:
      label: A professional
      meaning: A named reviewer with relevant experience has checked this item.
  review_due_months: 6
  review_due_label: Due for re-check
  ai_stage:
    discovery:
      label: Finding the weakness
      meaning: Was AI used to find the flaw?
    attack:
      label: The attack
      meaning: Was AI used to carry out the break-in or fraud?
    agent_behavior:
      label: AI acting alone
      meaning: Did AI programs act on their own or beyond their instructions?
  ai_level:
    confirmed:
      label: Confirmed
      meaning: The victim, the supplier, or an official investigator says AI was used.
    suspected:
      label: Suspected
      meaning: Officials or credible reporting point to signs of AI, without confirmation.
    unlikely:
      label: Unlikely
      meaning: A cause that isn't AI has been given, or the event came before capable AI tools.
    unknown:
      label: Unknown
      meaning: No information either way.
  question_status:
    open: { label: Open }
    partly_answered: { label: Partly answered }
    answered: { label: Answered }
