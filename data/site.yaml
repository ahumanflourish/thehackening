# Sitewide copy and definitions for thehackening.ai.
# Templates hold no content: every sentence a reader sees comes from this file,
# the other data files, CONTRIBUTING.md, or research/notes.md.
# Text fields here accept inline Markdown (links, emphasis).
# Write for a reader with no technical background and no knowledge of the
# online discussions this site grew out of.

name: The Hackening
domain: thehackening.ai
headline: A wave of AI hacking may be coming.
subhead: What it means for you, and how to get ready.
lede: >-
  People who follow AI closely expect break-ins and scams to become far more common
  over the next year, because AI can now do work that used to need skilled people.
  The first cases have happened. Nobody knows how bad it will get. Getting ready
  takes an afternoon, and most of it is worth doing anyway.
# notice = shown at the foot of every page and on the printed checklist.
notice: >-
  Not financial, legal or security advice. This site was drafted by one unpaid
  volunteer, the maintainer, working with an AI coding assistant. Nothing here has
  been checked by a professional unless the item says so. The "Evidence" labels and
  the estimates are the maintainer's own judgment. Most of the advice is written for
  the United States. Numbers carry a date and go out of date.
# never = what this site will never do, so that copies and impostors are easy to spot.
# Meant to be shown next to the notice on every page.
never: >-
  The only address for this site is thehackening.ai (and, until that domain is live,
  thehackening.vercel.app). The site has no accounts, no app, no helpline and no
  email list. It will never contact you, ask you to sign in, or ask for money or
  personal details. No bank, agency or this site will ever tell you to move or
  withdraw money to keep it safe.

repo_url: https://github.com/ahumanflourish/thehackening
thread_url: https://www.lesswrong.com/posts/YA2r4rg6SpBtwRqtq/the-hackening-justified-practical-advice-and-open-questions

