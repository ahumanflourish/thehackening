# Sitewide copy and definitions for thehackening.ai.
# Templates hold no content: every sentence a reader sees comes from this file,
# the other data files, CONTRIBUTING.md, or research/notes.md.
# Text fields here accept inline Markdown (links, emphasis).
# Write for a reader with no technical background and no knowledge of the
# online discussions this site grew out of.

name: The Hackening
domain: thehackening.ai
headline: Hacking just got cheap.
subhead: What that means for you, and what to do about it.
lede: >-
  AI tools can now find weaknesses in software and break in through them,
  faster and more cheaply than people ever could. Attacks that once took
  experts weeks now cost a few dollars, and most people, banks and utilities
  have not adjusted. People have started calling this "the Hackening".
notice: >-
  Not financial, legal or security advice. This site is maintained by volunteers and
  summarizes public reporting and discussion. Nothing here has been checked by a
  professional unless the item says so. Numbers carry a date and go out of date.

repo_url: https://github.com/ahumanflourish/thehackening
thread_url: https://www.lesswrong.com/posts/YA2r4rg6SpBtwRqtq/the-hackening-justified-practical-advice-and-open-questions

