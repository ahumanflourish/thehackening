# Open questions for thehackening.ai
# status: open | partly_answered | answered

- id: what-can-it-shut-down
  question: Could AI-driven hacking shut down gas, electricity, water, roads, trucking or
    the police?
  asked_by:
    - author: TsviBT
      url: https://www.lesswrong.com/posts/YA2r4rg6SpBtwRqtq/the-hackening-justified-practical-advice-and-open-questions?commentId=vrWadZoutdakXX9vn
  status: open
  current_best_answer: >-
    Water and sewer systems look most exposed, because they are split among many small,
    underfunded operators. Traders on the prediction site Manifold put about 8–9% on a
    major US blackout caused by hacking by 2027. Metaculus forecasters put about 10% on
    one caused by an attack aimed at AI systems before 2028.
  sources:
    - title: America's sewer systems are surprisingly vulnerable to cyber attacks, FAI
      url: https://www.thefai.org/posts/america-s-sewer-systems-are-surprisingly-vulnerable-to-cyber-attacks
    - title: Will there be at least one major US blackout caused by a cyberattack by 2027?,
        Manifold
      url: https://manifold.markets/JamieWahls/will-there-be-at-least-one-major-us
  related_advice: [ water-food-medications ]

- id: internet-before-utilities
  question: Could the internet itself fail before utilities do, and if it did, what else
    would fail with it?
  asked_by:
    - author: kman
      url: https://www.lesswrong.com/posts/YA2r4rg6SpBtwRqtq/the-hackening-justified-practical-advice-and-open-questions?commentId=fxLENPKfmFhbm2kTA
  status: open
  current_best_answer: >-
    No good answer yet. Traders on the prediction site Manifold put about 45% on a
    worldwide internet disruption of two hours or more before 2028, though that figure
    counts accidents too. They put 14% on an outage cutting off a quarter of internet
    users for 24 hours before 2030.
  sources:
    - title: Will there be a massive internet outage before 2028?, Manifold
      url: https://manifold.markets/Plant/will-there-be-a-massive-internet-ou
  related_advice: [ offline-maps-and-addresses, offline-reference-library ]

- id: how-much-supplies
  question: How many days of water, food and supplies are enough, and how much extra
    should you keep for neighbors who didn't prepare?
  asked_by:
    - author: Elizabeth
      url: https://www.lesswrong.com/posts/YA2r4rg6SpBtwRqtq/the-hackening-justified-practical-advice-and-open-questions?commentId=HeNoSTDPZfvFvMZyz
  status: partly_answered
  current_best_answer: >-
    Most guides plan for three to seven days; the Red Cross figure for staying at home
    is about two weeks. When a single financial institution has been hacked, the outage
    has run about two weeks. Nobody has answered how much to keep for neighbors.
  related_advice: [ water-food-medications, cash-sized-to-outages ]

- id: when-use-survival-llm
  question: When would you actually use a survival AI chatbot that runs on your own
    computer without the internet?
  asked_by:
    - author: Elizabeth
      url: https://www.lesswrong.com/posts/YA2r4rg6SpBtwRqtq/the-hackening-justified-practical-advice-and-open-questions?commentId=NLA7sR9nfjiisGCex
  status: partly_answered
  current_best_answer: >-
    Probably rarely. The useful part is the offline reference library it searches, which
    is free on its own. Most of what you'd need is specific to your situation and has to
    be prepared in advance.
  related_advice: [ offline-reference-library ]

- id: who-wants-long-outages
  question: Does anyone able to cause long outages actually want them?
  asked_by:
    - author: Claude Fable
      url: https://www.lesswrong.com/posts/YA2r4rg6SpBtwRqtq/the-hackening-justified-practical-advice-and-open-questions?commentId=dG5MWY4ee9TSFDm2R
  status: open
  current_best_answer: >-
    Probably not criminals. They get paid through extortion and theft, which favors
    stealing data and short outages. Lasting damage to infrastructure probably needs a
    government, someone who wants destruction for its own sake, or AI programs running
    outside anyone's control.
  sources:
    - title: On Open-Weights Mythos Capabilities (see JennaS's comment), hadad
      url: https://www.lesswrong.com/posts/wJunGnpY3qACWSvnh/on-open-weights-mythos-capabilities

- id: do-defenders-have-the-advantage
  question: If attackers and defenders have equally capable AI, don't defenders win, since
    they know their own systems and can outspend any one attacker?
  asked_by:
    - author: Afterimage
      url: https://www.lesswrong.com/posts/puv8fRDCH9jx5yhbX/johnswentworth-s-shortform/comment/rcQREbEgBpiuFBnnQ
  status: partly_answered
  current_best_answer: >-
    Not automatically. Finding flaws isn't the slow part; installing fixes is. Defenders
    found the PHP2Shell flaw on August 1, yet attackers were using it by October 17.
    CrowdStrike, a security firm, found that 88% of attacks using published attack code
    came within 48 hours of its release. Vitalik Buterin thinks defense may win
    eventually, but the transition is hard.
  sources:
    - title: The Hackening, Zvi
      url: https://www.lesswrong.com/posts/iqgZaJMnmyDCYfnuC/the-hackening-1
    - title: AI Vulnerability Management 2026 Guide, NeuralTrust
      url: https://neuraltrust.ai/blog/ai-vulnerability-management
  related_advice: [ shrink-patch-lag ]

- id: what-does-a-banking-attack-look-like
  question: What would an attack on many banks at once actually look like? Where would the
    money go, and couldn't the government block large transfers?
  asked_by:
    - author: cousin_it
      url: https://www.lesswrong.com/posts/wJunGnpY3qACWSvnh/on-open-weights-mythos-capabilities
  status: open
  current_best_answer: >-
    So far, attacks on banks have mostly stolen data, not moved money. The likelier way
    for many banks to fail together is customers losing access: a supplier or central
    computer system that many banks share goes down, as in the 2023 Trellance attack.
  related_advice: [ spending-money-on-separate-rails, insurance-covers-failure-not-hacks ]

- id: spiral-or-muddle-through
  question: Do we get a "death spiral" where infrastructure goes down faster than it
    recovers, or do we muddle through with scattered outages and theft?
  asked_by:
    - author: Thane Ruthenis
      url: https://www.lesswrong.com/posts/puv8fRDCH9jx5yhbX/johnswentworth-s-shortform/comment/4bAkyL8jgkmpoCFkc
  status: open
  current_best_answer: >-
    Most likely we muddle through. This site's maintainer puts the chance of a
    months-long, hard-to-reverse breakdown of online finance at about 1–3% over 18
    months. Claude Fable's most likely guess is similar: a grinding year or two of
    repeated break-ins and outages lasting hours to days.

- id: open-weights-timeline
  question: When will AI models that anyone can download be as good at hacking as the most
    advanced ones?
  asked_by:
    - author: johnswentworth
      url: https://www.lesswrong.com/posts/wJunGnpY3qACWSvnh/on-open-weights-mythos-capabilities
  status: open
  current_best_answer: >-
    hadad put 85% on a downloadable model hacking as well as Mythos, a leading model,
    within 24 months of August 2026. Vladimir_Nesov guessed maybe 2028, limited mainly
    by computing power in China. Metaculus's professional forecasters put about 95% on
    one matching Mythos on a hacking test before July 2027, but a test is not real-world
    attack ability.
  sources:
    - title: On Open-Weights Mythos Capabilities, hadad
      url: https://www.lesswrong.com/posts/wJunGnpY3qACWSvnh/on-open-weights-mythos-capabilities
    - title: Forecasting the fallout from the Hugging Face incident, Metaculus
      url: https://metaculus.substack.com/p/forecast-hugging-face-incident-openai-breach-cyberattack

- id: sheltered-harbor-future
  question: Sheltered Harbor, which sets the standard for banks' nightly offline backups,
    is closing. Will banks keep the backups, and will anyone independent still check
    them?
  asked_by:
    - author: Alexander (maintainer)
      url: https://www.fsisac.com/who-we-are/sheltered-harbor
  status: open
  current_best_answer: >-
    The backups likely continue, because banks and their suppliers run the storage
    themselves. The closing notice hands the standard to the industry group FS-ISAC and
    doesn't mention independent certification.
  sources:
    - title: Sheltered Harbor announces planned wind-down, FS-ISAC
      url: https://www.fsisac.com/who-we-are/sheltered-harbor
  related_advice: [ offline-statements ]

- id: big-bank-or-credit-union
  question: Against AI-driven hacking, is your money safer at one of the five biggest
    banks or at a credit union?
  asked_by:
    - author: RHollerith
      url: https://www.lesswrong.com/posts/puv8fRDCH9jx5yhbX/johnswentworth-s-shortform/comment/BPqcsafhHTjKgkDGz
  status: partly_answered
  current_best_answer: Disputed. Big banks defend better but are bigger targets. Credit
    unions run on different systems, so the two tend to fail at different times. Holding
    accounts at both is the cautious choice.
  related_advice: [ big-bank-or-credit-union ]
