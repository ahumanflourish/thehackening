# Open questions for thehackening.ai
# status: open | partly_answered | answered
# Say whose view or estimate each answer gives. Prediction-market figures need a date,
# the number of participants, and "play money" where that applies.
# Do not credit an AI-generated comment as an asker or as support for an estimate.

- id: what-can-it-shut-down
  question: Could AI-driven hacking shut down gas, electricity, water, roads, trucking or
    the police?
  asked_by:
    - author: TsviBT
      url: https://www.lesswrong.com/posts/YA2r4rg6SpBtwRqtq/the-hackening-justified-practical-advice-and-open-questions?commentId=vrWadZoutdakXX9vn
  status: open
  current_best_answer: >-
    Nobody knows. Water and sewer systems look unusually exposed, because they are split
    among thousands of small operators that must each find and fix their own flaws. On
    Manifold, a prediction site that uses play money, a market with about 40
    participants put about 6% on a major US blackout caused by a cyberattack before 1
    January 2027 (as of 14 Nov 2026). A market that small is a rough signal, not a
    forecast. One commenter, Thane Ruthenis, argues that what matters more is how fast
    emergency services could restore a basic offline service: power and deliveries
    worked in the 1970s, and Ukraine has kept essentials running under bombardment.
    Another, Archimedes, suggests expecting regular disruptions at least as bad as the
    November 2026 Outlook outage and US flight halt, without saying those were attacks.
    A third, Zian, says it depends on how far a service relies on networked computers
    to control it, and thinks a takeover of a gas utility's control room could almost
    certainly cause physical damage.
  sources:
    - title: Comment by Zian
      url: https://www.lesswrong.com/posts/YA2r4rg6SpBtwRqtq/the-hackening-justified-practical-advice-and-open-questions?commentId=Sb9JtMZTCkm4KpnYn
    - title: Comment by Thane Ruthenis
      url: https://www.lesswrong.com/posts/YA2r4rg6SpBtwRqtq/the-hackening-justified-practical-advice-and-open-questions?commentId=zzwJiDLHv9Ci9f6iH
    - title: Comment by Archimedes
      url: https://www.lesswrong.com/posts/YA2r4rg6SpBtwRqtq/the-hackening-justified-practical-advice-and-open-questions?commentId=3tQLCJcdtJMsMrudo
    - title: America's sewer systems are surprisingly vulnerable to cyber attacks, FAI
      url: https://www.thefai.org/posts/america-s-sewer-systems-are-surprisingly-vulnerable-to-cyber-attacks
    - title: Will there be at least one major US blackout caused by a cyberattack by 2027?,
        Manifold
      url: https://manifold.markets/JamieWahls/will-there-be-at-least-one-major-us
  related_advice: [ water-food-medications ]

- id: how-much-supplies
  question: How many days of water, food and supplies are enough, and how much extra
    should you keep for neighbors who didn't prepare?
  asked_by:
    - author: Elizabeth
      url: https://www.lesswrong.com/posts/YA2r4rg6SpBtwRqtq/the-hackening-justified-practical-advice-and-open-questions?commentId=HeNoSTDPZfvFvMZyz
  status: partly_answered
  current_best_answer: >-
    Most guides plan for three to seven days; the Red Cross figure for water and food
    when staying at home is about two weeks. In the best-known hack of a single
    financial institution, a California credit union in 2024, online banking was out
    for about two weeks. One commenter, Philipp Risius, suggests planning for up to two
    weeks without mains electricity. Another, Thane Ruthenis, doubts that preparing
    for a total breakdown fits the threat. A third, sudo-nym, would prepare for
    something like the 2003 Northeast blackout or the damage after a hurricane, and
    says that past about a month, preparing without a local community becomes an
    expensive hobby; Thane Ruthenis agrees on that point. Nobody has answered how much
    to keep for neighbors.
  sources:
    - title: Comment by sudo-nym
      url: https://www.lesswrong.com/posts/YA2r4rg6SpBtwRqtq/the-hackening-justified-practical-advice-and-open-questions?commentId=yzmMyHW8WnkRqfApd
    - title: Reply by Thane Ruthenis
      url: https://www.lesswrong.com/posts/YA2r4rg6SpBtwRqtq/the-hackening-justified-practical-advice-and-open-questions?commentId=2KxTvgcjWvpcDuYrG
    - title: Comment by Philipp Risius
      url: https://www.lesswrong.com/posts/YA2r4rg6SpBtwRqtq/the-hackening-justified-practical-advice-and-open-questions?commentId=FsnPHYaFecmhwKcA2
    - title: Comment by Thane Ruthenis
      url: https://www.lesswrong.com/posts/YA2r4rg6SpBtwRqtq/the-hackening-justified-practical-advice-and-open-questions?commentId=zzwJiDLHv9Ci9f6iH
  related_advice: [ water-food-medications, cash-sized-to-outages ]

- id: when-use-survival-llm
  question: When would you actually use a survival AI chatbot that runs on your own
    computer without the internet?
  asked_by:
    - author: Elizabeth
      url: https://www.lesswrong.com/posts/YA2r4rg6SpBtwRqtq/the-hackening-justified-practical-advice-and-open-questions?commentId=NLA7sR9nfjiisGCex
  status: partly_answered
  current_best_answer: >-
    Probably rarely, in the view of most of the commenters who have discussed it; none
    says they have tried one in an emergency. The useful part is the offline reference
    library it searches, which is free on its own. One commenter, lilkim2025, expects a
    plain search tool over the same manuals to be faster and more reliable than a small
    chatbot. Another, Thane Ruthenis, thinks it is not unhelpful but doesn't fit the
    threat well. Most of what you'd need is specific to your situation and has to be
    prepared in advance.
  sources:
    - title: Comment by lilkim2025
      url: https://www.lesswrong.com/posts/YA2r4rg6SpBtwRqtq/the-hackening-justified-practical-advice-and-open-questions?commentId=6dkA6DkA5YhyDbTzF
    - title: Comment by Thane Ruthenis
      url: https://www.lesswrong.com/posts/YA2r4rg6SpBtwRqtq/the-hackening-justified-practical-advice-and-open-questions?commentId=sgeKtbPwygc9EakBz
  related_advice: [ offline-reference-library ]

- id: who-wants-long-outages
  question: Does anyone able to cause long outages actually want them?
  status: open
  current_best_answer: >-
    Nobody knows. One commenter, Jenna_Parr, sorts attackers into three groups:
    criminals, who want money and so favor theft, extortion and ransoms; states and
    people who want destruction for its own sake; and AI agents that no longer answer
    to anyone. On that view, lasting damage is more likely to come from the last two.
    But criminals have caused long outages too: ransomware kept one US credit union's
    online banking down for about two weeks in 2024.
  sources:
    - title: Comment by Jenna_Parr on "On Open-Weights Mythos Capabilities"
      url: https://www.lesswrong.com/posts/wJunGnpY3qACWSvnh/on-open-weights-mythos-capabilities?commentId=vCphKJzz7xodJwEg7

- id: do-defenders-have-the-advantage
  question: If attackers and defenders have equally capable AI, don't defenders win, since
    they know their own systems and can outspend any one attacker?
  asked_by:
    - author: Afterimage
      url: https://www.lesswrong.com/posts/puv8fRDCH9jx5yhbX/johnswentworth-s-shortform/comment/rcQREbEgBpiuFBnnQ
  status: partly_answered
  current_best_answer: >-
    Not automatically, and people who follow this disagree. Finding a flaw first isn't
    enough. Defenders found the PHP2Shell flaw on August 1, yet attackers were using it
    by October 17, four days before a fix was released. The writer Zvi expects
    attackers to have the advantage, because they can aim at whichever systems have
    not yet installed a fix (19 November 2026). Google's security researchers reported
    in November 2026 that attackers increasingly use AI to work out what a new fix
    repairs and build an attack from it, with no person involved. Grendel1209, who
    described working in cybersecurity at a threat-intelligence company, expects
    freely downloadable AI models to favor attackers. Vitalik Buterin predicts defense
    wins in the end, "but the transition will be hard".
  sources:
    - title: The Hackening, Zvi
      url: https://www.lesswrong.com/posts/iqgZaJMnmyDCYfnuC/the-hackening-1
    - title: "AI #195: Opening Bell, Zvi (19 November 2026)"
      url: https://www.lesswrong.com/posts/De5LBagrSCKd3Q9cs/ai-195-opening-bell
    - title: "GTIG AI Threat Tracker: Agentic Threat Activity Crosses a Significant
        Threshold (16 November 2026), Google Threat Intelligence Group"
      url: https://cloud.google.com/blog/topics/threat-intelligence/agentic-threat-activity-crosses-a-significant-threshold
    - title: Comment by Grendel1209
      url: https://www.lesswrong.com/posts/puv8fRDCH9jx5yhbX/johnswentworth-s-shortform/comment/NGfGhPs7zD9EbLygc
  related_advice: [ shrink-patch-lag ]

- id: what-does-a-banking-attack-look-like
  question: What would an attack on many banks at once actually look like? Where would the
    money go, and couldn't the government block large transfers?
  asked_by:
    - author: cousin_it
      url: https://www.lesswrong.com/posts/wJunGnpY3qACWSvnh/on-open-weights-mythos-capabilities?commentId=png7tkGbgJhuytooJ
  status: open
  current_best_answer: >-
    Nobody has a clear picture. Most reported attacks on banks so far have leaked data,
    but money has been moved too: about €100 million was stolen from the French bank
    Crédit Mutuel Arkéa in November 2026, out of the bank's own account. Another way
    many banks could fail together is customers losing access when a supplier that many
    banks share goes down, as in the 2023 Trellance attack. Whether a government could
    block very large transfers has not been answered.
  related_advice: [ spending-money-on-separate-rails, insurance-covers-failure-not-hacks ]

- id: spiral-or-muddle-through
  question: Do we get a "death spiral" where infrastructure goes down faster than it
    recovers, or do we muddle through with scattered outages and theft?
  asked_by:
    - author: Thane Ruthenis
      url: https://www.lesswrong.com/posts/puv8fRDCH9jx5yhbX/johnswentworth-s-shortform/comment/4bAkyL8jgkmpoCFkc
  status: open
  current_best_answer: >-
    Nobody knows. Thane Ruthenis, who asked, was unsure: it "seems possible"
    there will be a spiral, "or maybe not". This site's maintainer guesses the chance of
    a months-long, hard-to-reverse breakdown of online finance at about 1–3% over 18
    months (a guess made in late October 2026). That is one person's judgment, not a
    forecast. The reasoning: past attacks on financial firms caused outages of days to
    weeks followed by recovery, and banks keep offline backups of account records.
    Against that, nothing like today's tools has been seen before, so the past is a
    weak guide. On 14 November 2026 Thane Ruthenis added that the real question is how
    quickly basic services could be restored offline, and that preparing for total
    breakdown "doesn't really seem threat-appropriate"; he also asked whether he was
    underrating how fragile these systems are.
  sources:
    - title: Comment by Thane Ruthenis (14 November 2026)
      url: https://www.lesswrong.com/posts/YA2r4rg6SpBtwRqtq/the-hackening-justified-practical-advice-and-open-questions?commentId=zzwJiDLHv9Ci9f6iH

- id: open-weights-timeline
  question: When will AI models that anyone can download be as good at hacking as the most
    advanced ones?
  asked_by:
    - author: johnswentworth
      url: https://www.lesswrong.com/posts/wJunGnpY3qACWSvnh/on-open-weights-mythos-capabilities?commentId=KwPbBtCA9HqqsfQg5
  status: partly_answered
  current_best_answer: >-
    Two reports in September 2026 give part of the answer. CAISI, the US government's
    AI testing center, said on 17 September that GLM-5.3, a Chinese model anyone can
    download, was the most capable downloadable model at hacking so far. It also said
    GLM-5.3 was "significantly lower" than the best US models, about four months behind
    on its tests. Anthropic, an AI company, reported on 29 September that in its tests
    GLM-5.3 built working attacks about as often as its own model Claude Mythos
    Preview, announced about five months earlier: 50 of 410 attempts against 56 on one
    test. Anthropic also found GLM-5.3's safety limits easy to get around. So on these
    tests downloadable models have reached about where the leading models were a few
    months before, and they still trail the newest US models, some of which are
    released only to vetted users. Tests are not real-world attack ability. Earlier
    guesses in the discussion were slower. In August 2026 hadad put 85% on a
    downloadable model hacking as well as Mythos, a leading model, within 24 months,
    and Vladimir_Nesov guessed "maybe 2 years, in 2028". In October 2026 the writer Zvi
    judged the best downloadable model "more than six months behind". Forecasters at
    the forecasting site Metaculus put about 95% on one matching Mythos on a hacking
    test before July 2027.
  sources:
    - title: CAISI's Assessment of Z.ai's GLM-5.3 Cyber Capabilities (17 September 2026),
        NIST
      url: https://www.nist.gov/news-events/news/2026/09/caisis-assessment-zais-glm-53-cyber-capabilities
    - title: GLM-5.3 and the spread of advanced cyber capabilities (29 September 2026),
        Anthropic
      url: https://www.anthropic.com/research/glm-5-3-and-the-spread-of-advanced-cyber-capabilities
    - title: Post-Glasswing cybersecurity projects, osmarks (pointed to the Anthropic
        report)
      url: https://www.lesswrong.com/posts/nW3g2spGXuoLsRsWh/post-glasswing-cybersecurity-projects
    - title: On Open-Weights Mythos Capabilities, hadad
      url: https://www.lesswrong.com/posts/wJunGnpY3qACWSvnh/on-open-weights-mythos-capabilities
    - title: The Hackening, Zvi
      url: https://www.lesswrong.com/posts/iqgZaJMnmyDCYfnuC/the-hackening-1
    - title: Forecasting the fallout from the Hugging Face incident, Metaculus
      url: https://metaculus.substack.com/p/forecast-hugging-face-incident-openai-breach-cyberattack

- id: sheltered-harbor-future
  question: Sheltered Harbor, which sets the standard for banks' nightly offline backups,
    is closing. Will banks keep the backups, and will anyone independent still check
    them?
  asked_by:
    - author: Alex A
      url: https://www.lesswrong.com/posts/puv8fRDCH9jx5yhbX/johnswentworth-s-shortform/comment/EAifqfeEHYQ6QJscX
  status: open
  current_best_answer: >-
    Not known. The maintainer's guess is that the backups continue, because banks and
    their suppliers run the storage themselves. The closing notice hands the standard
    to the industry group FS-ISAC and doesn't mention independent certification.
  sources:
    - title: Sheltered Harbor announces planned wind-down, FS-ISAC
      url: https://www.fsisac.com/who-we-are/sheltered-harbor
  related_advice: [ offline-statements ]

- id: big-bank-or-credit-union
  question: Against AI-driven hacking, is your money safer at one of the five biggest
    banks or at a credit union?
  status: partly_answered
  current_best_answer: >-
    Disputed, and nothing here is a recommendation to move your money. Grendel1209, who
    described working in cybersecurity at a threat-intelligence company, recommends a top-five bank, on the
    view that only the biggest firms can afford strong defenses. Thane Ruthenis
    suggests splitting money across several different banks. The maintainer's own
    reasoning, which is untested, is that a big bank and a credit union may not fail at
    the same time, so holding accounts at both is the cautious choice.
  sources:
    - title: Comment by Grendel1209
      url: https://www.lesswrong.com/posts/puv8fRDCH9jx5yhbX/johnswentworth-s-shortform/comment/NGfGhPs7zD9EbLygc
    - title: Comment by Thane Ruthenis
      url: https://www.lesswrong.com/posts/puv8fRDCH9jx5yhbX/johnswentworth-s-shortform/comment/4bAkyL8jgkmpoCFkc
  related_advice: [ big-bank-or-credit-union ]

- id: which-password-manager
  question: Are some password managers safer than others, and is a good one good enough?
  asked_by:
    - author: Elizabeth
      url: https://www.lesswrong.com/posts/YA2r4rg6SpBtwRqtq/the-hackening-justified-practical-advice-and-open-questions?commentId=NFq8kLF6eXRdjKJKg
  status: open
  current_best_answer: >-
    Nobody in the discussion has answered yet. Elizabeth asks whether one well-known
    password manager is better than another, naming LastPass and 1Password, and whether
    the better one is good enough. This site has not compared them or checked either
    one's record. Its guide says the free password managers built into Apple and Google
    devices are enough to start with. Elizabeth also points out that replacing old
    backup codes (the one-time codes that let you into an account without your phone)
    seems worth doing but was on nobody's list; the backup guide now includes it.
  related_advice: [ password-manager-unique-passwords, offline-backups ]

- id: will-incidents-keep-rising
  question: Will the number of hacks and outages level off soon, or keep climbing?
  asked_by:
    - author: Mike W
      url: https://www.lesswrong.com/posts/RPsgjBsAbAuRQegjm/nunosempere-s-shortform?commentId=M8EqYZyzzgc9ZAbjE
  status: open
  current_best_answer: >-
    Nobody knows. NunoSempere posted a chart counting the cyber incidents in the weekly
    news roundups of Sentinel, a group that watches for signs of global catastrophes. It peaks at 12 in the week of 2
    November 2026; most weeks in 2025 had two or fewer. That counts what the roundups
    mentioned, not every incident. He says both outcomes are possible and sees no limit
    on how many incidents there could be or how bad. He puts the lower counts of the
    latest two weeks down to noise.
  sources:
    - title: Chart posted by NunoSempere (18 November 2026)
      url: https://www.lesswrong.com/posts/RPsgjBsAbAuRQegjm/nunosempere-s-shortform?commentId=FkgogiseH9gnhk3Bg
    - title: Reply by NunoSempere on whether the rise will continue
      url: https://www.lesswrong.com/posts/RPsgjBsAbAuRQegjm/nunosempere-s-shortform?commentId=xKbnRQntf7gTuvdab
    - title: Reply by NunoSempere on the latest two weeks
      url: https://www.lesswrong.com/posts/RPsgjBsAbAuRQegjm/nunosempere-s-shortform?commentId=a8zMrybBkRHYD4jNE
